// State for the active archive entry + reader
let archiveActiveIndex = -1;
let archiveReader = null;

const archiveIndexEl = document.getElementById('archiveIndex');
const archiveEntryEl = document.getElementById('archiveEntry');
const archiveIndexListEl = document.getElementById('archiveIndexList');
const archiveEntryLabelEl = document.getElementById('archiveEntryLabel');
const archiveEntryTitleEl = document.getElementById('archiveEntryTitle');
const archiveEntryCaptionEl = document.getElementById('archiveEntryCaption');
const archiveEntryPassageEl = document.getElementById('archiveEntryPassage');
const archivePlayBtn = document.getElementById('archivePlay');
const archiveSpeedLabel = document.getElementById('archiveSpeedLabel');

function renderArchiveIndex() {
  archiveIndexListEl.innerHTML = '';
  archive.forEach((entry, i) => {
    const btn = document.createElement('button');
    btn.className = 'archive-index-item';
    btn.innerHTML = `
      <div class="item-label">${entry.id}</div>
      <div class="item-title">${entry.title}</div>
      <div class="item-meta">${entry.meta}</div>
    `;
    btn.addEventListener('click', () => openArchiveEntry(i));
    archiveIndexListEl.appendChild(btn);
  });
}
renderArchiveIndex();

function openArchiveEntry(idx) {
  archiveActiveIndex = idx;
  const entry = archive[idx];
  archiveIndexEl.classList.remove('active');
  archiveEntryEl.classList.add('active');
  archiveEntryLabelEl.textContent = entry.id;
  archiveEntryTitleEl.textContent = entry.title;
  archiveEntryCaptionEl.innerHTML = linkifyReference(entry.caption);
  // Build the passage element with word-by-word spans
  buildArchivePassage(entry);
  // Reset reader to paused at start
  if (archiveReader) {
    archiveReader.setPaused(true);
    archiveReader.jumpTo(0);
  }
  // Apply current reading mode (lit / cream / read-along)
  setMode(currentMode);
  // Reset scroll + hide floating-back
  archiveEntryPassageEl.scrollTop = 0;
  if (typeof floatingBack !== 'undefined') floatingBack.classList.remove('visible');
}

function backToArchiveIndex() {
  archiveEntryEl.classList.remove('active');
  archiveIndexEl.classList.add('active');
  if (archiveReader) archiveReader.setPaused(true);
  archiveActiveIndex = -1;
  if (typeof floatingBack !== 'undefined') floatingBack.classList.remove('visible');
}

document.getElementById('archiveBack').addEventListener('click', backToArchiveIndex);

// Build the read-along passage for an archive entry.
// Verse entries preserve line breaks; prose entries flow.
function buildArchivePassage(entry) {
  archiveEntryPassageEl.innerHTML = '';
  const wordEls = [];
  entry.paragraphs.forEach((para, pi) => {
    if (entry.format === 'verse') {
      // Each line in the paragraph becomes a separate visual line
      const lines = para.split('\n');
      lines.forEach((line, li) => {
        const lineSpan = document.createElement('span');
        lineSpan.style.display = 'block';
        wrapWordsInto(line, lineSpan, wordEls);
        archiveEntryPassageEl.appendChild(lineSpan);
      });
    } else {
      const span = document.createElement('span');
      wrapWordsInto(para, span, wordEls);
      archiveEntryPassageEl.appendChild(span);
    }
    if (pi < entry.paragraphs.length - 1) {
      const br = document.createElement('span');
      br.className = 'br';
      archiveEntryPassageEl.appendChild(br);
    }
  });
  wordEls.forEach((el, i) => el.addEventListener('click', () => archiveReader.jumpTo(i)));
  archiveReader = new ArchiveReader(wordEls);
}

function wrapWordsInto(text, container, wordEls) {
  // Split into words preserving spaces
  const parts = text.split(/(\s+)/);
  parts.forEach(part => {
    if (/^\s+$/.test(part)) {
      container.appendChild(document.createTextNode(part));
    } else if (part) {
      // Check for italic markers (we use <em>...</em> in the source)
      // Since the data has plain text, just wrap as words
      const span = document.createElement('span');
      span.className = 'word';
      span.textContent = part;
      container.appendChild(span);
      wordEls.push(span);
    }
  });
}

// Lightweight reader for archive entries — same mechanic as the main reader
// but lives in archive's DOM. Default paused. 0.5× start speed.
class ArchiveReader {
  constructor(wordEls) {
    this.wordEls = wordEls;
    this.idx = -1;
    this.paused = true;
    this.speed = 0.5;
    this.elapsed = 0;
    this.msPerWord = 220;  // base; effective = msPerWord / speed
    this.updateSpeedLabel();
    archivePlayBtn.innerHTML = '▶';
  }
  setPaused(p) {
    this.paused = p;
    archivePlayBtn.innerHTML = p ? '▶' : '❚❚';
  }
  jumpTo(i) {
    this.wordEls.forEach((el, j) => {
      el.classList.toggle('current', j === i);
      el.classList.toggle('read', j < i);
    });
    this.idx = i;
    this.elapsed = 0;
    if (i >= 0 && i < this.wordEls.length) {
      this.wordEls[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
  setSpeed(s) {
    this.speed = Math.max(0.1, Math.min(3, s));
    this.updateSpeedLabel();
  }
  updateSpeedLabel() {
    archiveSpeedLabel.textContent = this.speed.toFixed(1) + '×';
  }
  step(deltaMs) {
    if (this.paused) return;
    this.elapsed += deltaMs;
    const interval = this.msPerWord / this.speed;
    while (this.elapsed >= interval) {
      this.elapsed -= interval;
      const next = (this.idx < 0 ? 0 : this.idx + 1);
      if (next >= this.wordEls.length) {
        this.setPaused(true);
        return;
      }
      this.jumpTo(next);
    }
  }
}

archivePlayBtn.addEventListener('click', () => {
  if (!archiveReader) return;
  archiveReader.setPaused(!archiveReader.paused);
  if (!archiveReader.paused && archiveReader.idx < 0) archiveReader.jumpTo(0);
});
document.getElementById('archiveSpeedUp').addEventListener('click', () => {
  if (archiveReader) archiveReader.setSpeed(archiveReader.speed + 0.1);
});
document.getElementById('archiveSpeedDown').addEventListener('click', () => {
  if (archiveReader) archiveReader.setSpeed(archiveReader.speed - 0.1);
});


let activeView = 'ephemera';

function setView(name) {
  // Pause archive reader if leaving archive
  if (activeView === 'archive' && name !== 'archive' && archiveReader) {
    archiveReader.setPaused(true);
  }
  activeView = name;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  const isReading = name === 'reading';
  const isStaticList = name === 'references' || name === 'archive';
  const isRotating = !isReading && !isStaticList;
  document.getElementById('rotateControls').style.display = isRotating ? 'flex' : 'none';
  document.getElementById('dots').style.display = isRotating ? 'flex' : 'none';
  // Always start reading on TOC
  if (isReading) {
    backToTOC();
  }
  // Always start archive on index
  if (name === 'archive') {
    backToArchiveIndex();
  }
  // Hide floating back button on view switch — re-shows on scroll if applicable
  if (typeof floatingBack !== 'undefined') floatingBack.classList.remove('visible');
  rebuildDots();
  updateCounter();
}

document.querySelectorAll('nav button').forEach(b => {
  b.addEventListener('click', () => setView(b.dataset.view));
});

// ============================================================
//   R O T A T I O N   C O N T R O L S
// ============================================================

const dotsEl = document.getElementById('dots');
const currentEl = document.getElementById('current');
const totalEl = document.getElementById('total');

function activeRotator() {
  if (activeView === 'ephemera') return ephemeraRotator;
  if (activeView === 'discography') return discographyRotator;
  return null;
}

function rebuildDots() {
  dotsEl.innerHTML = '';
  const r = activeRotator();
  if (!r) return;
  r.entries.forEach((_, i) => {
    const dot = document.createElement('button');
    dot.className = 'dot' + (i === r.current ? ' active' : '');
    dot.setAttribute('aria-label', `entry ${i + 1}`);
    dot.addEventListener('click', () => { r.goTo(i); rebuildDots(); updateCounter(); });
    dotsEl.appendChild(dot);
  });
}

function updateCounter() {
  const r = activeRotator();
  if (!r) return;
  currentEl.textContent = String(r.current + 1).padStart(2, '0');
  totalEl.textContent = String(r.entries.length).padStart(2, '0');
}

document.getElementById('next').addEventListener('click', () => { const r = activeRotator(); if (r) { r.next(); rebuildDots(); updateCounter(); } });
document.getElementById('prev').addEventListener('click', () => { const r = activeRotator(); if (r) { r.prev(); rebuildDots(); updateCounter(); } });
const pauseBtn = document.getElementById('pause');
pauseBtn.addEventListener('click', () => {
  if (activeView === 'reading') {
    reader.paused = !reader.paused;
    pauseBtn.innerHTML = reader.paused ? '▶' : '||';
  } else {
    const r = activeRotator();
    if (r) { r.paused = !r.paused; pauseBtn.innerHTML = r.paused ? '▶' : '||'; }
  }
});

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape' && fnPopover.classList.contains('show')) {
    e.preventDefault();
    hideFootnote();
    return;
  }
  if (e.key === 'Escape' && figPopover.classList.contains('show')) {
    e.preventDefault();
    hideFigure();
    return;
  }
  if (e.key === 'Escape' && lightboxEl.classList.contains('show')) {
    e.preventDefault();
    closeLightbox();
    return;
  }
  if (activeView === 'reading') {
    if (e.key === 'ArrowRight') reader.jumpTo(reader.wordIndex + 5);
    else if (e.key === 'ArrowLeft') reader.jumpTo(reader.wordIndex - 5);
    else if (e.key === ' ') { e.preventDefault(); reader.setPaused(!reader.paused); }
  } else {
    if (e.key === 'ArrowRight') document.getElementById('next').click();
    else if (e.key === 'ArrowLeft') document.getElementById('prev').click();
    else if (e.key === ' ') { e.preventDefault(); pauseBtn.click(); }
  }
});

// ============================================================
//   F L O A T I N G   B A C K   B U T T O N
// ============================================================

// Shows after ~30% scroll on an archive entry or reading passage,
// clicks return to the respective index (archive index / reading TOC).
const floatingBack = document.getElementById('floatingBack');
const floatingBackLabel = document.getElementById('floatingBackLabel');

function getActiveScrollable() {
  // Returns the currently-relevant scroll container, or null if none.
  if (activeView === 'archive' && archiveActiveIndex >= 0) {
    return { el: archiveEntryPassageEl, label: 'back to voices', backFn: backToArchiveIndex };
  }
  if (activeView === 'reading' && readingPassageEl && readingPassageEl.style.display !== 'none') {
    return { el: passageEl, label: 'table of contents', backFn: backToTOC };
  }
  return null;
}

let _currentBackFn = null;
function updateFloatingBack() {
  const ctx = getActiveScrollable();
  if (!ctx) {
    floatingBack.classList.remove('visible');
    _currentBackFn = null;
    return;
  }
  // Update label and back function
  floatingBackLabel.textContent = ctx.label;
  _currentBackFn = ctx.backFn;
  // Compute scroll progress on the scrollable element
  const el = ctx.el;
  const max = Math.max(1, el.scrollHeight - el.clientHeight);
  const pct = el.scrollTop / max;
  // Visible after 30% scroll, hidden when at very top
  if (pct > 0.30) {
    floatingBack.classList.add('visible');
  } else {
    floatingBack.classList.remove('visible');
  }
}

floatingBack.addEventListener('click', () => {
  if (_currentBackFn) _currentBackFn();
  floatingBack.classList.remove('visible');
});

// Bind scroll listeners (one-time, the elements always exist after init)
if (archiveEntryPassageEl) {
  archiveEntryPassageEl.addEventListener('scroll', updateFloatingBack);
}
if (passageEl) {
  passageEl.addEventListener('scroll', updateFloatingBack);
}

// ============================================================
//   M A I N   L O O P
// ============================================================

const progressEl = document.getElementById('progress');
let lastTime = null;

function loop(ts) {
  if (lastTime === null) lastTime = ts;
  const delta = ts - lastTime;
  lastTime = ts;

  // Step the archive reader if active
  if (activeView === 'archive' && archiveActiveIndex >= 0 && archiveReader) {
    archiveReader.step(delta);
  }

  if (activeView === 'reading') {
    if (readingPassageEl.style.display !== 'none') {
      reader.step(delta);
      const total = reader.wordEls.length;
      const pct = total > 0 ? (reader.wordIndex / Math.max(1, total - 1)) * 100 : 0;
      progressEl.style.width = pct + '%';
    } else {
      progressEl.style.width = '0%';
    }
  } else {
    const r = activeRotator();
    if (r) {
      const beforeIdx = r.current;
      r.step(delta);
      progressEl.style.width = r.progressPct() + '%';
      if (r.current !== beforeIdx) { rebuildDots(); updateCounter(); }
    }
  }
  requestAnimationFrame(loop);
}

rebuildDots();
updateCounter();
requestAnimationFrame(loop);
</script>
