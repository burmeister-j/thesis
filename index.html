<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>a [re]sounding message</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,700;1,9..144,300;1,9..144,400&family=Newsreader:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink-deep: #0d0a14;
    --ink-mid: #181122;
    --ink-warm: #221629;
    --cream: #f4ead8;
    --cream-dim: #c9bfac;
    --cream-faint: #6e6754;
    --cream-vfaint: #3d382e;
    --saffron: #e89244;
    --rose: #c08389;
    --violet: #7a5b8e;
    --hover: #a8d4ce;
    --aurora-1: rgba(232, 146, 68, 0.18);
    --aurora-2: rgba(122, 91, 142, 0.22);
    --aurora-3: rgba(192, 131, 137, 0.14);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--ink-deep);
    color: var(--cream);
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 300;
    overflow: hidden;
    height: 100vh;
  }

  /* ---------- cosmic atmosphere ---------- */
  .cosmos { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
  .cosmos::before, .cosmos::after, .cosmos .glow {
    content: ''; position: absolute; border-radius: 50%;
    filter: blur(80px); opacity: 0.85; will-change: transform;
  }
  .cosmos::before {
    width: 70vw; height: 70vw;
    background: radial-gradient(circle, var(--aurora-1) 0%, transparent 60%);
    top: -20vw; left: -10vw;
    animation: drift1 38s ease-in-out infinite alternate;
  }
  .cosmos::after {
    width: 60vw; height: 60vw;
    background: radial-gradient(circle, var(--aurora-2) 0%, transparent 60%);
    bottom: -15vw; right: -10vw;
    animation: drift2 46s ease-in-out infinite alternate;
  }
  .cosmos .glow {
    width: 50vw; height: 50vw;
    background: radial-gradient(circle, var(--aurora-3) 0%, transparent 60%);
    top: 30%; left: 40%;
    animation: drift3 52s ease-in-out infinite alternate;
  }
  @keyframes drift1 { 0%{transform:translate(0,0) scale(1);} 100%{transform:translate(15vw,8vh) scale(1.15);} }
  @keyframes drift2 { 0%{transform:translate(0,0) scale(1);} 100%{transform:translate(-10vw,-10vh) scale(1.2);} }
  @keyframes drift3 { 0%{transform:translate(0,0) scale(0.9);} 100%{transform:translate(-12vw,6vh) scale(1.1);} }

  .grain {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.07;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode: overlay;
  }

  .progress { position: fixed; top: 0; left: 0; right: 0; height: 2px; background: rgba(244,234,216,0.08); z-index: 50; }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--saffron) 0%, var(--rose) 100%);
    transition: width 0.1s linear;
    box-shadow: 0 0 12px rgba(232,146,68,0.5);
  }

  /* ---------- header & nav ---------- */
  header {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 28px 48px 0; z-index: 20;
    display: flex; flex-direction: column; gap: 18px;
    pointer-events: none;
  }
  .header-row {
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .mark {
    font-family: 'DM Mono', monospace;
    font-size: 12px; font-weight: 400;
    letter-spacing: 0.08em;
    color: var(--cream-faint);
  }
  .mark .accent { color: var(--saffron); }
  .mark-stack {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .pdf-download {
    pointer-events: auto;
    display: inline-flex; align-items: center; gap: 5px;
    font-family: 'DM Mono', monospace;
    font-size: 9px; letter-spacing: 0.2em;
    color: var(--cream-faint);
    text-decoration: none; text-transform: uppercase;
    padding: 4px 10px;
    border: 1px solid rgba(244, 234, 216, 0.10);
    border-radius: 100px;
    background: rgba(13, 10, 20, 0.4);
    backdrop-filter: blur(8px);
    transition: color 0.3s ease, border-color 0.3s ease, background 0.3s ease;
  }
  .pdf-download:hover {
    color: var(--saffron);
    border-color: rgba(232, 146, 68, 0.45);
    background: rgba(232, 146, 68, 0.08);
  }
  .pdf-download svg { display: block; flex-shrink: 0; }
  nav {
    display: flex; gap: 4px; align-self: flex-start;
    pointer-events: auto;
    background: rgba(13, 10, 20, 0.4);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(244, 234, 216, 0.06);
    border-radius: 100px;
    padding: 4px;
  }
  nav button {
    background: transparent; border: none;
    color: var(--cream-faint);
    font-family: 'DM Mono', monospace;
    font-size: 11px; font-weight: 400;
    letter-spacing: 0.15em; text-transform: uppercase;
    padding: 9px 18px; border-radius: 100px;
    cursor: pointer; transition: all 0.3s ease;
  }
  nav button:hover { color: var(--cream-dim); }
  nav button.active {
    color: var(--cream);
    background: rgba(232, 146, 68, 0.12);
    box-shadow: inset 0 0 0 1px rgba(232,146,68,0.3);
  }

  main {
    position: relative; z-index: 10;
    height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 160px 48px 110px;
  }

  .view {
    width: 100%; max-width: 1180px;
    position: relative; min-height: 60vh;
    display: none;
  }
  .view.active { display: block; }

  /* ============ ROTATING CARDS ============ */
  .stage {
    position: relative;
    min-height: 60vh;
    max-height: calc(100vh - 270px);
    overflow: hidden;
  }

  .entry {
    position: absolute; inset: 0;
    opacity: 0; transform: translateY(24px);
    visibility: hidden;
    transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1),
                transform 1.4s cubic-bezier(0.4, 0, 0.2, 1),
                visibility 0s linear 1.2s;
    pointer-events: none;
    display: grid;
    grid-template-columns: 1fr 0.85fr;
    gap: 72px; align-items: center;
  }
  .entry.active {
    opacity: 1; transform: translateY(0); pointer-events: auto;
    visibility: visible;
    transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1),
                transform 1.4s cubic-bezier(0.4, 0, 0.2, 1),
                visibility 0s linear 0s;
  }
  .entry-text { min-width: 0; }

  .entry-label {
    font-family: 'DM Mono', monospace;
    font-size: 12px; letter-spacing: 0.2em;
    color: var(--saffron); margin-bottom: 22px;
    text-transform: uppercase;
    display: flex; align-items: center; gap: 14px;
  }
  .entry-label::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--saffron) 0%, transparent 100%);
    opacity: 0.35;
  }

  .entry-title {
    font-family: 'Fraunces', serif; font-weight: 400;
    font-variation-settings: "opsz" 144;
    font-size: clamp(26px, 3.4vw, 42px);
    line-height: 1.08; letter-spacing: -0.01em;
    color: var(--cream); margin-bottom: 16px;
  }
  .entry-title em { font-style: italic; color: var(--rose); font-weight: 300; }

  .entry-meta {
    font-family: 'Fraunces', serif; font-style: italic; font-weight: 300;
    font-size: 14px; color: var(--cream-dim);
    margin-bottom: 24px; letter-spacing: 0.01em;
  }

  .entry-body {
    font-family: 'Newsreader', Georgia, serif; font-weight: 300;
    font-size: clamp(14px, 1.05vw, 16px); line-height: 1.65;
    color: var(--cream-dim); text-wrap: pretty;
    max-height: 36vh; overflow-y: auto; padding-right: 8px;
  }
  .entry-body::-webkit-scrollbar { width: 4px; }
  .entry-body::-webkit-scrollbar-track { background: transparent; }
  .entry-body::-webkit-scrollbar-thumb { background: rgba(232,146,68,0.3); border-radius: 2px; }
  .entry-body em { font-style: italic; color: var(--cream); }
  .entry-body .quote { color: var(--cream); font-style: italic; }

  .entry-source {
    margin-top: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 0.15em;
    color: var(--cream-faint); text-transform: uppercase;
  }

  .entry-image {
    position: relative; width: 100%;
    aspect-ratio: 4 / 5; max-height: 60vh;
    border-radius: 2px; overflow: hidden;
    background: var(--ink-warm);
    box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(244,234,216,0.06);
  }
  .entry-image img { max-width: 100%; object-fit: cover; display: block; }

  /* Ephemera + Discography images: preserve actual proportions, feathered glow */
  #view-ephemera .entry-image,
  #view-discography .entry-image {
    aspect-ratio: auto;
    height: auto;
    max-height: calc(100vh - 370px);
    background: transparent;
    box-shadow: none;
    display: flex; align-items: center; justify-content: flex-start;
    overflow: visible;
  }
  #view-ephemera .entry-image img,
  #view-discography .entry-image img {
    width: auto; height: auto;
    max-width: 100%; max-height: calc(100vh - 370px);
    object-fit: contain;
    border-radius: 2px;
    box-shadow:
      0 0 60px 12px rgba(232, 146, 68, 0.18),
      0 0 24px 4px rgba(232, 146, 68, 0.12),
      0 30px 60px rgba(0,0,0,0.5);
    cursor: zoom-in;
    transition: transform 0.3s ease, box-shadow 0.4s ease;
  }
  #view-ephemera .entry-image img:hover,
  #view-discography .entry-image img:hover {
    transform: scale(1.02);
    box-shadow:
      0 0 80px 18px rgba(232, 146, 68, 0.28),
      0 0 30px 6px rgba(232, 146, 68, 0.18),
      0 30px 60px rgba(0,0,0,0.5);
  }
  #view-ephemera .entry-image .placeholder,
  #view-discography .entry-image .placeholder {
    position: relative; width: 100%; aspect-ratio: 4 / 5;
    background: linear-gradient(135deg, rgba(232,146,68,0.08) 0%, rgba(122,91,142,0.12) 50%, rgba(192,131,137,0.06) 100%);
    border-radius: 2px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(244,234,216,0.06);
  }
  #view-ephemera .entry-image::after,
  #view-discography .entry-image::after { display: none; }

  /* Multi-image layouts: ephemera entries with multiple images.
     Only one image shows at a time, navigated via the toggle overlay above. */
  .entry-image.multi {
    position: relative;
    margin-top: 40px; /* room for toggle pill above */
  }
  .entry-image.multi img {
    display: none;
    max-height: calc(100vh - 410px) !important; /* tighter cap so toggle has room */
  }
  .entry-image.multi img.active {
    display: block;
  }
  .image-toggle {
    position: absolute;
    top: -38px; left: 50%;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px;
    background: rgba(40, 28, 56, 0.95);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(232, 146, 68, 0.25);
    border-radius: 100px;
    padding: 5px 8px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--cream);
    z-index: 10;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5),
                0 0 24px rgba(232, 146, 68, 0.12);
  }
  .img-nav {
    background: transparent;
    border: none;
    color: var(--cream-dim);
    cursor: pointer;
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    transition: color 0.2s ease, background 0.2s ease;
    font-family: inherit;
  }
  .img-nav:hover {
    color: var(--saffron);
    background: rgba(232, 146, 68, 0.12);
  }
  .img-counter {
    font-variant-numeric: tabular-nums;
    min-width: 28px; text-align: center;
  }
  .img-counter .img-cur {
    color: var(--saffron);
  }
  .entry-image .placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(135deg, rgba(232,146,68,0.08) 0%, rgba(122,91,142,0.12) 50%, rgba(192,131,137,0.06) 100%);
  }
  .entry-image .placeholder svg { width: 48%; height: 48%; opacity: 0.18; }
  .entry-image .placeholder .ph-id {
    position: absolute; bottom: 18px; left: 18px;
    font-family: 'DM Mono', monospace; font-size: 10px;
    letter-spacing: 0.2em; color: var(--cream-faint); text-transform: uppercase;
  }
  .entry-image .placeholder .ph-note {
    position: absolute; top: 18px; right: 18px;
    font-family: 'DM Mono', monospace; font-size: 9px;
    letter-spacing: 0.2em; color: var(--cream-faint); text-transform: uppercase; opacity: 0.5;
  }
  .entry-image::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 70%, rgba(13,10,20,0.4) 100%);
    pointer-events: none;
  }

  /* ============ TOC + READING ============ */
  #view-reading .reading-shell {
    max-width: 820px; margin: 0 auto;
  }

  /* TOC sub-view */
  .toc-shell {
    display: flex; flex-direction: column; gap: 6px;
    max-height: 70vh; overflow-y: auto;
    padding: 0 16px;
  }
  .toc-shell::-webkit-scrollbar { width: 4px; }
  .toc-shell::-webkit-scrollbar-track { background: transparent; }
  .toc-shell::-webkit-scrollbar-thumb { background: rgba(232,146,68,0.2); border-radius: 2px; }

  .toc-label {
    font-family: 'DM Mono', monospace; font-size: 10px;
    letter-spacing: 0.3em; color: var(--cream-faint);
    text-align: center; text-transform: uppercase;
    margin-bottom: 22px;
  }
  .toc-title-main {
    font-family: 'Fraunces', serif; font-style: italic;
    font-variation-settings: "opsz" 144;
    font-size: clamp(26px, 3.4vw, 38px);
    color: var(--saffron); font-weight: 300; text-align: center;
    line-height: 1.15; letter-spacing: -0.005em;
    margin-bottom: 6px;
  }
  .toc-title-sub {
    font-family: 'Fraunces', serif; font-style: italic;
    font-variation-settings: "opsz" 48;
    font-size: clamp(18px, 2.2vw, 24px);
    color: var(--cream-dim); font-weight: 300; text-align: center;
    line-height: 1.2;
    margin-bottom: 14px;
  }

  .toc-epigraph {
    font-family: 'Newsreader', Georgia, serif; font-weight: 300;
    font-style: italic;
    font-size: clamp(14px, 1.25vw, 16px);
    line-height: 1.7;
    color: var(--cream-dim);
    text-align: center;
    max-width: 560px;
    margin: 24px auto 12px;
    padding: 0 0.5em;
    animation: epigraphGlow 5.5s ease-in-out infinite;
  }
  @keyframes epigraphGlow {
    0%, 100% {
      text-shadow: 0 0 0 rgba(232, 146, 68, 0);
      color: var(--cream-dim);
    }
    50% {
      text-shadow:
        0 0 14px rgba(232, 146, 68, 0.45),
        0 0 28px rgba(232, 146, 68, 0.2);
      color: var(--cream);
    }
  }
  /* attribution doesn't pulse — keeps it grounded as bibliographic */
  .toc-epigraph .attribution {
    animation: none;
    text-shadow: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .toc-epigraph { animation: none; }
  }
  .toc-epigraph .quote-line {
    display: block;
  }
  .toc-epigraph .attribution {
    display: block;
    font-style: normal;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--cream-faint);
    margin-top: 16px;
  }

  .toc-section-title {
    font-family: 'Fraunces', serif; font-weight: 400;
    font-variation-settings: "opsz" 48;
    font-size: clamp(20px, 2.2vw, 26px);
    color: var(--saffron);
    margin-top: 24px; margin-bottom: 10px;
    letter-spacing: -0.005em;
  }
  .toc-section-title:first-child { margin-top: 0; }

  .toc-item {
    background: transparent; border: none;
    font-family: 'Newsreader', Georgia, serif; font-weight: 300;
    font-size: clamp(15px, 1.2vw, 18px);
    color: var(--cream-dim);
    padding: 11px 18px; padding-left: 22px;
    text-align: left; cursor: pointer;
    border-left: 1px solid rgba(244, 234, 216, 0.08);
    transition: all 0.3s ease;
    display: flex; align-items: baseline; gap: 14px;
    width: 100%;
  }
  .toc-item:hover {
    color: var(--cream);
    border-left-color: var(--saffron);
    padding-left: 26px;
  }
  .toc-item .toc-num {
    display: none;
  }
  .toc-item.unavailable {
    color: var(--cream-vfaint); cursor: default;
    font-style: italic;
  }
  .toc-item.unavailable:hover {
    color: var(--cream-faint);
    border-left-color: rgba(244,234,216,0.08);
    padding-left: 22px;
  }
  .toc-item .toc-stub {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--cream-vfaint);
    text-transform: uppercase;
    margin-left: auto;
  }

  /* TOC subitem — indented Part entries under main chapters */
  .toc-subitem {
    background: transparent; border: none;
    font-family: 'Newsreader', Georgia, serif; font-weight: 300;
    font-style: italic;
    font-size: clamp(13px, 1.05vw, 15px);
    color: var(--cream-faint);
    padding: 5px 8px;
    padding-left: 36px;
    text-align: left; cursor: pointer;
    transition: all 0.3s ease;
    display: flex; align-items: baseline; gap: 14px;
    width: 100%;
  }
  .toc-subitem:hover {
    color: var(--cream-dim);
    padding-left: 42px;
  }
  .toc-subitem .toc-num {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--cream-vfaint);
    flex-shrink: 0;
    font-style: normal;
  }
  .toc-subitem .toc-num:empty { min-width: 0; display: none; }
  .toc-subitem.unavailable {
    color: var(--cream-vfaint); cursor: default;
  }
  .toc-subitem.unavailable:hover {
    padding-left: 36px;
  }

  /* Reading sub-view */
  .reading-shell {
    display: flex; flex-direction: column; gap: 22px;
  }
  .reading-back {
    background: transparent; border: none;
    color: var(--cream-faint);
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 0.2em;
    text-transform: uppercase; cursor: pointer;
    padding: 6px 0; align-self: flex-start;
    transition: color 0.3s ease;
  }
  .reading-back:hover { color: var(--saffron); }

  .passage-title {
    font-family: 'Fraunces', serif; font-style: italic;
    font-variation-settings: "opsz" 72;
    font-size: clamp(22px, 2.6vw, 32px);
    color: var(--cream); text-align: center; font-weight: 300;
    letter-spacing: -0.005em;
    margin-bottom: 28px;
  }
  .passage-epigraph {
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 300; font-style: normal;
    font-size: 15px; line-height: 1.55;
    color: var(--cream-faint);
    text-align: center;
    max-width: calc(100% - 1rem);
    margin: 24px auto 16px;
    padding: 0 0.5rem;
  }

  .passage {
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 300;
    font-size: clamp(17px, 1.45vw, 22px);
    line-height: 1.75;
    color: var(--cream-vfaint);
    max-height: 50vh;
    overflow-y: auto;
    padding: 8px 12px;
    text-wrap: pretty;
    scroll-behavior: smooth;
  }
  .passage::-webkit-scrollbar { width: 4px; }
  .passage::-webkit-scrollbar-track { background: transparent; }
  .passage::-webkit-scrollbar-thumb { background: rgba(232,146,68,0.2); border-radius: 2px; }

  .passage .word {
    display: inline;
    color: var(--cream-vfaint);
    transition: color 0.4s ease, text-shadow 0.4s ease;
    cursor: pointer;
  }
  .passage .word.read { color: var(--cream-dim); }
  .passage .word.current {
    color: var(--cream);
    text-shadow: 0 0 18px rgba(232, 146, 68, 0.5);
  }
  .passage .word:hover {
    color: var(--hover);
    text-shadow: 0 0 16px rgba(168, 212, 206, 0.4);
  }

  /* LIT MODE: every word in full saffron with soft warm halo (same family as read-along's current-word glow) */
  .passage.lit-mode .word {
    color: var(--saffron);
    text-shadow: 0 0 14px rgba(232, 146, 68, 0.32);
  }
  .passage.lit-mode .word.read,
  .passage.lit-mode .word.current {
    color: var(--saffron);
    text-shadow: 0 0 14px rgba(232, 146, 68, 0.32);
  }
  .passage.lit-mode .word:hover {
    color: var(--saffron);
    text-shadow: 0 0 22px rgba(232, 146, 68, 0.85),
                 0 0 6px rgba(255, 200, 130, 0.6);
  }

  /* CREAM MODE: every word in cream-dim baseline; hover lifts to full cream */
  .passage.cream-mode .word {
    color: var(--cream-dim);
    text-shadow: none;
  }
  .passage.cream-mode .word.read,
  .passage.cream-mode .word.current {
    color: var(--cream-dim);
    text-shadow: none;
  }
  .passage.cream-mode .word:hover {
    color: var(--cream);
    text-shadow: 0 0 14px rgba(244, 234, 216, 0.4);
  }
  /* Apply cream-mode to archive entries too */
  .archive-entry-passage.cream-mode .word { color: var(--cream-dim); }
  .archive-entry-passage.cream-mode .word.read,
  .archive-entry-passage.cream-mode .word.current { color: var(--cream-dim); }
  .archive-entry-passage.cream-mode .word:hover {
    color: var(--cream);
    text-shadow: 0 0 14px rgba(244, 234, 216, 0.4);
    background: transparent;
  }
  /* Apply lit-mode to archive entries too */
  .archive-entry-passage.lit-mode .word {
    color: var(--saffron);
    text-shadow: 0 0 14px rgba(232, 146, 68, 0.32);
  }
  .archive-entry-passage.lit-mode .word.read,
  .archive-entry-passage.lit-mode .word.current {
    color: var(--saffron);
    text-shadow: 0 0 14px rgba(232, 146, 68, 0.32);
  }
  .archive-entry-passage.lit-mode .word:hover {
    color: var(--saffron);
    text-shadow: 0 0 22px rgba(232, 146, 68, 0.85),
                 0 0 6px rgba(255, 200, 130, 0.6);
    background: transparent;
  }

  /* Three-mode toggle — segmented pill */
  .mode-toggle {
    display: inline-flex;
    background: transparent;
    border: 1px solid rgba(244, 234, 216, 0.18);
    border-radius: 100px;
    padding: 2px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    overflow: hidden;
  }
  .mode-toggle button {
    background: transparent;
    border: none;
    padding: 4px 11px;
    color: var(--cream-faint);
    cursor: pointer;
    border-radius: 100px;
    transition: color 0.25s ease, background 0.25s ease;
    font-family: inherit;
    font-size: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
  }
  .mode-toggle button:hover {
    color: var(--cream);
  }
  .mode-toggle button.active {
    color: var(--saffron);
    background: rgba(232, 146, 68, 0.12);
  }
  .mode-toggle button.active[data-mode="cream"] {
    color: var(--cream);
    background: rgba(244, 234, 216, 0.10);
  }
  .mode-toggle button.active[data-mode="read-along"] {
    color: var(--saffron);
    background: rgba(232, 146, 68, 0.12);
  }

  /* Toggle button — small pill in the reading meta bar */
  .reading-toggle {
    background: transparent;
    border: 1px solid rgba(244, 234, 216, 0.18);
    border-radius: 100px;
    padding: 5px 12px 5px 10px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--cream-faint);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: color 0.3s ease, border-color 0.3s ease, background 0.3s ease;
  }
  .reading-toggle:hover {
    color: var(--cream);
    border-color: rgba(232, 146, 68, 0.4);
  }
  .reading-toggle .toggle-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(244, 234, 216, 0.18);
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  .reading-toggle.active {
    color: var(--saffron);
    border-color: rgba(232, 146, 68, 0.55);
  }
  .reading-toggle.active .toggle-dot {
    background: var(--saffron);
    box-shadow: 0 0 8px rgba(232, 146, 68, 0.6);
  }

  /* Hide play/speed controls when not in read-along mode */
  .reading-controls-right.lit-mode .reading-play,
  .reading-controls-right.lit-mode .speed-row {
    display: none;
  }
  .passage em { font-style: italic; }
  .passage strong { font-weight: 600; }
  .passage .br { display: block; height: 0.7em; }

  /* footnote marker */
  .passage .footnote-marker {
    font-family: 'DM Mono', monospace;
    font-size: 0.6em;
    vertical-align: super;
    color: #ffe066;
    cursor: pointer;
    margin: 0 1px 0 2px;
    padding: 1px 4px;
    border-radius: 3px;
    transition: background 0.2s ease, color 0.2s ease, text-shadow 0.2s ease;
    line-height: 1;
    font-weight: 600;
    user-select: none;
    text-shadow: 0 0 6px rgba(255, 224, 102, 0.35);
  }
  .passage .footnote-marker:hover {
    background: rgba(255, 224, 102, 0.18);
    color: #fff066;
    text-shadow: 0 0 12px rgba(255, 224, 102, 0.7);
  }

  /* footnote popover */
  .footnote-backdrop {
    position: fixed; inset: 0;
    background: rgba(13, 10, 20, 0.5);
    backdrop-filter: blur(2px);
    z-index: 70;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .footnote-backdrop.show { opacity: 1; pointer-events: auto; }

  .footnote-popover {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -48%);
    width: 560px; max-width: calc(100vw - 48px);
    background: rgba(24, 17, 34, 0.97);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(232, 146, 68, 0.25);
    border-radius: 10px;
    padding: 20px 24px 22px;
    z-index: 80;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  }
  .footnote-popover.show {
    opacity: 1; pointer-events: auto;
    transform: translate(-50%, -50%);
  }
  .fn-header {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 12px;
    border-bottom: 1px solid rgba(244, 234, 216, 0.08);
    padding-bottom: 10px;
  }
  .fn-num {
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 0.2em;
    color: var(--saffron); text-transform: uppercase;
  }
  .fn-num::before { content: 'note '; opacity: 0.55; }
  .fn-close {
    background: transparent; border: none;
    color: var(--cream-faint); cursor: pointer;
    font-size: 20px; line-height: 1; padding: 0 4px;
    transition: color 0.3s ease;
  }
  .fn-close:hover { color: var(--cream); }
  .fn-text {
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 300; font-size: 15px; line-height: 1.65;
    color: var(--cream-dim);
    text-wrap: pretty;
    max-height: 50vh; overflow-y: auto;
  }
  .fn-text em { font-style: italic; color: var(--cream); }
  .fn-text::-webkit-scrollbar { width: 4px; }
  .fn-text::-webkit-scrollbar-track { background: transparent; }
  .fn-text::-webkit-scrollbar-thumb { background: rgba(232,146,68,0.25); border-radius: 2px; }

  /* figure marker — inline button with shimmer-glow to attract attention */
  @keyframes figureShimmer {
    0%, 100% {
      text-shadow:
        0 0 6px rgba(255, 224, 102, 0.35),
        0 0 12px rgba(232, 146, 68, 0.18);
      color: rgba(255, 220, 130, 0.95);
    }
    50% {
      text-shadow:
        0 0 12px rgba(255, 240, 130, 0.85),
        0 0 22px rgba(255, 200, 102, 0.55),
        0 0 4px rgba(255, 255, 220, 0.9);
      color: rgba(255, 240, 160, 1);
    }
  }
  .passage .figure-marker {
    font-family: 'DM Mono', monospace;
    font-size: 0.6em;
    vertical-align: super;
    color: rgba(255, 220, 130, 0.95);
    cursor: pointer;
    margin: 0 1px 0 2px;
    padding: 1px 4px;
    border-radius: 3px;
    line-height: 1;
    font-weight: 600;
    user-select: none;
    letter-spacing: 0.05em;
    animation: figureShimmer 3.4s ease-in-out infinite;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .passage .figure-marker:hover {
    background: rgba(255, 224, 102, 0.18);
    transform: scale(1.08);
    /* hover overrides the shimmer with a steady bright state */
    animation: none;
    color: rgba(255, 245, 180, 1);
    text-shadow:
      0 0 16px rgba(255, 240, 130, 0.95),
      0 0 28px rgba(255, 200, 102, 0.7),
      0 0 4px rgba(255, 255, 220, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    .passage .figure-marker {
      animation: none;
      text-shadow:
        0 0 8px rgba(255, 224, 102, 0.5),
        0 0 14px rgba(232, 146, 68, 0.25);
    }
  }

  /* figure popover — like footnote popover but with image-first layout */
  .figure-popover {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -48%);
    width: 620px; max-width: calc(100vw - 48px);
    max-height: calc(100vh - 64px);
    background: rgba(24, 17, 34, 0.97);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(232, 146, 68, 0.25);
    border-radius: 10px;
    z-index: 80;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .figure-popover.show {
    opacity: 1; pointer-events: auto;
    transform: translate(-50%, -50%);
  }
  .fig-header {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 16px 20px 10px;
    border-bottom: 1px solid rgba(244, 234, 216, 0.08);
  }
  .fig-num {
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 0.2em;
    color: var(--saffron); text-transform: uppercase;
  }
  .fig-num::before { content: 'figure '; opacity: 0.55; }
  .fig-close {
    background: transparent; border: none;
    color: var(--cream-faint); cursor: pointer;
    font-size: 20px; line-height: 1; padding: 0 4px;
    transition: color 0.3s ease;
  }
  .fig-close:hover { color: var(--cream); }
  .fig-image-wrap {
    background: rgba(13, 10, 20, 0.5);
    display: flex; align-items: center; justify-content: center;
    min-height: 200px; max-height: 50vh;
    overflow: hidden;
  }
  .fig-image-wrap img {
    max-width: 100%; max-height: 50vh;
    object-fit: contain;
    display: block;
  }
  .fig-meta {
    padding: 14px 20px 18px;
    overflow-y: auto;
  }
  .fig-title {
    font-family: 'Fraunces', serif; font-style: italic;
    font-variation-settings: "opsz" 48;
    font-size: 17px; font-weight: 400;
    color: var(--cream);
    margin-bottom: 4px;
    line-height: 1.3;
  }
  .fig-subtitle {
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 0.12em;
    color: var(--cream-faint); text-transform: uppercase;
    margin-bottom: 10px;
  }
  .fig-body {
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 300; font-size: 14px; line-height: 1.6;
    color: var(--cream-dim);
    text-wrap: pretty;
  }
  .fig-body em { font-style: italic; color: var(--cream); }
  .fig-src {
    font-family: 'DM Mono', monospace;
    font-size: 9px; letter-spacing: 0.18em;
    color: var(--cream-faint); text-transform: uppercase;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid rgba(244, 234, 216, 0.06);
  }

  /* Lightbox: full-screen image viewer */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(13, 10, 20, 0.96);
    backdrop-filter: blur(20px);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
    cursor: zoom-out;
    padding: 40px;
  }
  .lightbox.show {
    opacity: 1; pointer-events: auto;
  }
  .lightbox-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(244,234,216,0.08);
    cursor: default;
  }
  .lightbox-close {
    position: absolute;
    top: 20px; right: 24px;
    background: rgba(244, 234, 216, 0.08);
    border: 1px solid rgba(244, 234, 216, 0.18);
    color: var(--cream);
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 22px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s ease, border-color 0.2s ease;
    z-index: 1;
  }
  .lightbox-close:hover {
    background: rgba(232, 146, 68, 0.18);
    border-color: var(--saffron);
  }

  /* prev/next passage navigation — sits below passage text, above meta bar */
  .passage-nav {
    display: flex; justify-content: space-between; align-items: stretch;
    gap: 16px;
    margin: 24px 0 18px;
    padding: 0 8px;
    min-height: 56px;
  }
  .passage-nav-btn {
    flex: 1;
    display: flex; align-items: center; gap: 10px;
    background: transparent;
    border: 1px solid rgba(244, 234, 216, 0.08);
    border-radius: 8px;
    padding: 10px 16px;
    color: var(--cream-dim);
    cursor: pointer;
    font-family: 'Fraunces', serif; font-style: italic;
    font-variation-settings: "opsz" 24;
    font-size: 14px; font-weight: 300;
    line-height: 1.3;
    transition: border-color 0.3s ease, color 0.3s ease, background 0.3s ease;
    text-align: left;
    min-width: 0;
  }
  .passage-nav-btn:hover:not(:disabled) {
    border-color: rgba(232, 146, 68, 0.4);
    color: var(--cream);
    background: rgba(232, 146, 68, 0.04);
  }
  .passage-nav-btn:disabled {
    opacity: 0.25;
    cursor: default;
  }
  .passage-nav-prev { text-align: left; }
  .passage-nav-next { text-align: right; flex-direction: row-reverse; }
  .passage-nav .nav-arrow {
    color: var(--saffron);
    font-family: 'DM Mono', monospace;
    font-size: 16px;
    font-style: normal;
    flex-shrink: 0;
    transition: transform 0.3s ease;
  }
  .passage-nav-prev:hover:not(:disabled) .nav-arrow {
    transform: translateX(-3px);
  }
  .passage-nav-next:hover:not(:disabled) .nav-arrow {
    transform: translateX(3px);
  }
  .passage-nav .nav-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .passage-nav-btn:disabled .nav-arrow { color: var(--cream-faint); }

  /* Special "Back to TOC" appearance for the next-button at end of sequence */
  .passage-nav-next.is-back-to-toc {
    font-family: 'DM Mono', monospace;
    font-style: normal;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  @media (max-width: 640px) {
    .passage-nav { flex-direction: column; gap: 8px; }
    .passage-nav-btn { font-size: 13px; }
    .passage-nav .nav-label { white-space: normal; }
  }

  .reading-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 0.15em;
    color: var(--cream-faint); text-transform: uppercase;
    padding: 0 8px;
  }
  .reading-controls-right {
    display: flex; align-items: center; gap: 18px;
  }
  .reading-play {
    background: transparent;
    border: 1px solid rgba(232, 146, 68, 0.4);
    color: var(--saffron);
    width: 34px; height: 34px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 11px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s ease;
  }
  .reading-play:hover {
    background: rgba(232, 146, 68, 0.12);
    transform: scale(1.08);
    color: var(--cream);
  }
  .reading-meta .speed-row {
    display: flex; align-items: center; gap: 10px;
  }
  .speed-btn {
    background: transparent; border: 1px solid rgba(244,234,216,0.18);
    color: var(--cream-dim);
    width: 24px; height: 24px; border-radius: 50%;
    font-family: 'DM Mono', monospace; font-size: 12px;
    cursor: pointer; transition: all 0.3s ease;
    display: flex; align-items: center; justify-content: center;
  }
  .speed-btn:hover { border-color: var(--saffron); color: var(--saffron); }

  /* ============ REFERENCES ============ */
  #view-references .references-shell {
    max-width: 820px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 8px;
  }
  .references-heading {
    font-family: 'Fraunces', serif; font-style: italic;
    font-variation-settings: "opsz" 144;
    font-size: clamp(28px, 3.5vw, 40px);
    color: var(--cream); font-weight: 300; text-align: center;
    margin-bottom: 14px;
  }
  .references-subhead {
    font-family: 'DM Mono', monospace; font-size: 10px;
    letter-spacing: 0.25em; color: var(--cream-faint);
    text-align: center; text-transform: uppercase;
    margin-bottom: 28px;
  }
  .references-list {
    max-height: 60vh; overflow-y: auto;
    padding: 0 18px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .references-list::-webkit-scrollbar { width: 4px; }
  .references-list::-webkit-scrollbar-track { background: transparent; }
  .references-list::-webkit-scrollbar-thumb { background: rgba(232,146,68,0.2); border-radius: 2px; }

  .reference-entry {
    font-family: 'Newsreader', Georgia, serif; font-weight: 300;
    font-size: 15px; line-height: 1.55;
    color: var(--cream-dim);
    padding-left: 1.6em; text-indent: -1.6em; /* hanging indent */
    text-wrap: pretty;
  }
  .reference-entry em { font-style: italic; color: var(--cream); }
  .reference-entry a {
    color: var(--saffron);
    text-decoration: none;
    border-bottom: 1px solid rgba(232, 146, 68, 0.3);
    transition: color 0.3s ease, border-color 0.3s ease;
    word-break: break-word;
  }
  .reference-entry a:hover {
    color: var(--cream);
    border-bottom-color: var(--cream);
  }
  .reference-entry a.youtube::before {
    content: '▶ ';
    font-size: 0.7em;
    margin-right: 2px;
    vertical-align: 1px;
  }
  .reference-entry a.image::before {
    content: '↗ ';
    font-size: 0.85em;
    margin-right: 2px;
    color: var(--saffron);
  }
  .reference-entry a.read::before {
    content: '📖 ';
    font-size: 0.85em;
    margin-right: 2px;
    vertical-align: 0;
    /* slightly desaturate emoji rendering to fit the muted palette */
    filter: saturate(0.7) brightness(0.95);
  }

  /* ============ ARCHIVE ============ */
  #view-archive .archive-shell {
    max-width: 820px; margin: 0 auto;
    width: 100%;
  }
  .archive-sub {
    display: none;
  }
  .archive-sub.active {
    display: block;
  }

  /* Index sub-view */
  .archive-heading {
    font-family: 'Fraunces', serif; font-style: italic;
    font-variation-settings: "opsz" 144;
    font-size: clamp(28px, 3.5vw, 40px);
    color: var(--cream); font-weight: 300; text-align: center;
    margin-bottom: 14px;
  }
  .archive-subhead {
    font-family: 'DM Mono', monospace; font-size: 10px;
    letter-spacing: 0.25em; color: var(--cream-faint);
    text-align: center; text-transform: uppercase;
    margin-bottom: 36px;
  }
  .archive-index-list {
    max-height: 60vh; overflow-y: auto;
    padding: 0 16px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .archive-index-list::-webkit-scrollbar { width: 4px; }
  .archive-index-list::-webkit-scrollbar-track { background: transparent; }
  .archive-index-list::-webkit-scrollbar-thumb { background: rgba(232,146,68,0.2); border-radius: 2px; }

  .archive-index-item {
    background: transparent; border: none;
    text-align: left; cursor: pointer;
    padding: 16px 18px;
    border-radius: 4px;
    transition: background 0.3s ease;
    display: flex; flex-direction: column; gap: 4px;
    color: inherit; font: inherit;
  }
  .archive-index-item:hover {
    background: rgba(232, 146, 68, 0.06);
  }
  .archive-index-item .item-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 0.25em;
    color: var(--saffron); text-transform: uppercase;
  }
  .archive-index-item .item-title {
    font-family: 'Fraunces', serif; font-style: italic;
    font-variation-settings: "opsz" 24;
    font-size: 18px; font-weight: 300;
    color: var(--cream); line-height: 1.3;
  }
  .archive-index-item .item-meta {
    font-family: 'Newsreader', Georgia, serif; font-weight: 300;
    font-style: italic;
    font-size: 13px; color: var(--cream-dim);
    margin-top: 2px;
  }

  /* Entry sub-view */
  .archive-entry-header {
    display: flex; justify-content: space-between; align-items: center;
    gap: 16px;
    margin-bottom: 22px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(244, 234, 216, 0.06);
  }
  .archive-back {
    background: transparent; border: none;
    color: var(--cream-faint);
    font-family: 'DM Mono', monospace;
    font-size: 11px; letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 6px 0;
    transition: color 0.3s ease;
  }
  .archive-back:hover { color: var(--cream); }
  .archive-controls {
    display: flex; align-items: center; gap: 8px;
  }
  .archive-controls .ctrl-btn {
    background: transparent; border: 1px solid rgba(244, 234, 216, 0.15);
    color: var(--cream-dim);
    font-family: 'DM Mono', monospace; font-size: 11px;
    width: 32px; height: 32px; border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s ease;
  }
  .archive-controls .ctrl-btn:hover {
    border-color: var(--saffron); color: var(--cream);
  }
  .archive-controls .ctrl-btn.small { width: 24px; height: 24px; font-size: 12px; }

  { id:"B.1—2", img:"images/b1", images:["images/b1","images/b1b"], layout:"stacked", title:"Annual Celebration of Swamini Turiyasangitananda", meta:"TreePeople's S. Mark Taper Amphitheater, Santa Monica Mountains · August 27, annually", body:`Flyers from recent years for the annual celebration of the life and devotional music of Swamini Turiyasangitananda Alice Coltrane, held on her birthday. Presented by Surya Botofasina and Carlos Niño. One flyer depicts Botofasina seated on the steps of the Sai Anantam Ashram after its destruction in the 2018 Woolsey Fire. <em>This is the annual gathering to which Niño invited André Benjamin after encountering him at a grocery store</em>—the encounter that produced <em>New Blue Sun</em> (André 3000, 2023).`, src:"Botofasina / Niño · TreePeople" },

  { id:"B.4", img:"images/b4", title:"Rajna Swaminathan's Apertures", meta:"Apollo Café, Harlem · December 9, 2023", body:`Flyer for Rajna Swaminathan's <em>Apertures</em> performance. Featuring ganavya doraiswamy (vocals), Utsav Lal (piano), Miles Okazaki (guitar), Darian Donovan Thomas (violin), Kalia Vandever (trombone), and Hannah Marks (bass). <em>This is the performance the researcher attended at the Apollo Café in Harlem—the encounter referenced in the thesis's opening pages.</em>`, src:"Apollo Café · Harlem" },
  { id:"B.5", img:"images/b5", images:["images/b5","images/b5b"], layout:"stacked", title:"Monument Eternal, second edition", meta:"Rough Trade Records, Times Square, NYC · February 6, 2025", body:`Screenshot of event listing for the celebration of <em>Monument Eternal</em>'s second edition. Panel: Ravi Coltrane, Brandee Younger, and Ashley Kahn. Retrieved from Akashic Books.`, src:"Akashic Books · akashicbooks.com" },
  { id:"B.6", img:"images/b6", title:"Georgia Anne Muldrow at the Apollo Music Café", meta:"Harlem · March 7, 2025", body:`Georgia Anne Muldrow performing at the Apollo Music Café — described as <span class="quote">"an unscripted night of music that takes the audience on a revolutionary journey through self-love, gratitude and perseverance."</span> <em>This is where the researcher learned from Muldrow that she was an initiate of Turiyasangitananda.</em>`, src:"Photograph by the researcher" },
  { id:"B.7", img:"images/b7", title:"Cosmic Music: The Celestial Songs of Alice Coltrane", meta:"Stern Auditorium / Perelman Stage, Carnegie Hall · May 16, 2025", body:`Featuring Ravi Coltrane, Flying Lotus, Brandee Younger—playing Alice's recently restored harp, originally a gift from John Coltrane in 1967—and Michelle Coltrane leading the Sai Anantam Devotional Ensemble. World premiere orchestral arrangements of Alice Coltrane compositions. <em>The first time Ravi, Flying Lotus, and Michelle appeared onstage together.</em> Culminating event of the Year of Alice. The title pays homage to Alice's 1968 <em>Cosmic Music</em> performance at the same venue.`, src:"@thecoltranehome · Instagram" },
  { id:"B.8", img:"images/b8", title:"ganavya · Daughter of a Temple", meta:"LEITER, 2024", body:`ganavya shared a copy of <em>Monument Eternal</em> with the researcher via Instagram in December 2023—an act of care from a stranger that <em>[re]opened the field-orientation from which this thesis proceeds</em>. Her album <em>Daughter of a Temple</em> (LEITER, 2024) gathers thirty artists across spiritual jazz and Tamil devotional tradition for a recording session that began with the washing of the others' feet.`, src:"The New York Times · November 20, 2024" },
  { id:"B.9", img:"images/b9", title:"Shabaka Hutchings, on kalimba", meta:"Instagram · February 14, 2026", body:`<span class="quote">"For Alice Coltrane, because the energy flow teachings that live through her music are needed more than ever..."</span> Hutchings—a dear friend of ganavya's, who has spoken of his friendship as having carried her through difficult seasons—produced her <em>like the sky I've been too quiet</em> (Native Rebel, 2024) and plays clarinet on <em>Daughter of a Temple</em>. Here, playing kalimba in a private devotional setting. <em>The kinship network sounding through informal infrastructure, care before content.</em>`, src:"@shabakahutchings · Instagram" },
  { id:"B.10", img:"images/b10", title:"Planetarium · Carlos Niño & Friends", meta:"Ridgewood, Queens · April 4, 2026", body:`Carlos Niño & Friends featuring Marshall Allen (101, Sun Ra Arkestra), Darius Jones, and Austin Williamson. <span class="quote">"A deep listening event with a high fidelity sound system in a private loft... we invite you to bring pillows, blankets, sleeping bags and anything else you need to get comfortable, while live musicians and DJs create a landscape for exploring the inner cosmos."</span> <em>This is the room where Niño crossed the floor, shook the researcher's hand, and said: "The story... and now, you're here."</em>`, src:"Carlos Niño & Friends" },
  { id:"B.11", img:"images/b11", title:"The Sound of Ourselves", meta:"Vale of Cashmere, Prospect Park, Brooklyn · August 9, 2025", body:`Surya Botofasina & A Space for Sound, powered by Karlala Soundsystem. <em>During the gathering, Botofasina shared that he had once slept on the benches in this same Vale—unhoused, in the grip of addiction.</em> The researcher and Botofasina connected more deeply that afternoon over a shared experience of substance abuse and recovery. <em>The site of the wound had become the site of the teaching.</em>`, src:"A Space for Sound" },
  { id:"B.12", img:"images/b12", title:"Simone Weil in a Window", meta:"80 Washington Place (NYU), facing Washington Square Park · Spring 2025", body:`In the second semester, in the midst of concerted research, the researcher discovered Weil's work and its resonance with Coltrane's frameworks. The following Monday, in an impromptu office visit, a professor from the first semester—upon hearing about the Weil-Coltrane convergence—shared that her parents, like Alice, had been devotees of Swami Satchidananda. Walking through the park after the meeting, the researcher looked up and saw this: <em>Weil's face, eyes closed, presencing from a window of the program's own building.</em>`, src:"Photograph by the researcher" },
  { id:"B.13", img:"images/b13", title:"Ami Taf Ra · The Prophet & The Madman", meta:"Brainfeeder, 2025 · Japanese record store", body:`The promotional banner reads <span class="quote">「現代のAlice Coltrane?!」</span>—<em>"A modern-day Alice Coltrane?!"</em>—placing her directly in the lineage. Produced and co-written by her life partner Kamasi Washington. <em>The network the thesis traces—Coltrane through Botofasina, Niño, André, Doraiswamy, Hutchings, Williams—runs through Washington too, and the Japanese press prices it before the American scholarly apparatus does.</em>`, src:"@amitaframusic · October 27, 2025" },
  { id:"B.14", img:"images/b14", title:"Ami Taf Ra · Live Debut", meta:"Blue Note, New York City · 2025", body:`Ami Taf Ra debuting <em>The Prophet & The Madman</em> live.`, src:"Photograph by the researcher" },
  { id:"B.15", img:"images/b15", images:["images/b15","images/b15b"], layout:"side-by-side", title:"Divine Revelations", meta:"Philosophical Research Society, LA · August 23, 2025", body:`The Coltrane Home, the Philosophical Research Society, and dublab present <em>Divine Revelations: The Eternal Voice of Alice Coltrane Turiyasangitananda</em>. Eternity's Pillar Ashram and Video Installation; Sai Anantam Devotional Ensemble Live + Black Journal screening. Preceded by <em>An Oral History of Alice Coltrane</em>, presented by Michelle Coltrane—Alice's firstborn, born in Paris in 1960. dublab—the LA freeform radio collective of which Carlos Niño was a founding DJ—co-presenting.`, src:"@philosophical_research_society" },
  { id:"B.16", img:"images/b16", title:"Deeper · Atrium, Queens Museum", meta:"Queens, NYC · October 18, 2025", body:`Carlos Niño / Charanjot Kaur / Surya Botofasina. Presented by withoutSHAPEwithoutFORM. Nep Sidhu's caption: <span class="quote">"New York People's!! JOURNEY OF THE MIND..."</span> <em>This is the room where the researcher met Deep Kailey, who introduced the withoutSHAPEwithoutFORM network from which Total Response, the Wellin Museum recording, and Awakened by the Unstruck follow.</em>`, src:"@nepsidhu · October 15, 2025" },
  { id:"B.17", img:"images/b17", title:"Total Response · A Concert in Simran", meta:"Wellin Hall, Hamilton College, Clinton, NY · March 7, 2026", body:`Nirbhai (Nep) Singh Sidhu / withoutSHAPEwithoutFORM. Carlos Niño, Surya Botofasina, Austin Williamson, Michael Alvidrez, with special guests Ishmael Butler, Angel Bat Dawid, and 'Koi' Voicing Simran. <em>The practice was professionally recorded for the forthcoming 2027 exhibition</em> Awakened by the Unstruck<em>—the unstruck sound made materially accessible as museum infrastructure.</em>`, src:"withoutSHAPEwithoutFORM" },
  { id:"B.18", img:"images/b18", images:["images/b18","images/b18b"], layout:"stacked", title:"Cosmic Music · Book Event", meta:"NYU Bobst Library · March 24, 2026", body:`Cosmic Music: The Life, Art & Transcendence of Alice Coltrane—book event with Andy Beta, Jenn Pelly, Tulsi Reynolds, and Brandee Younger. Beta named the limit of his biographical project from the stage—<em>the limit that is precisely where this thesis lives.</em> Tulsi Reynolds, who played tamboura on Coltrane's <em>Journey in Satchidananda</em>, made eye contact with the researcher and smiled, nodding in recognition.`, src:"Da Capo Press / White Rabbit · 2026" },
  { id:"B.19", img:"images/b19", title:"Doja Cat at the Sai Anantam Ashram", meta:"Luaka Bop, 2017 · retrieved April 2026", body:`Doja Cat (Amala Ratna Zandile Dlamini)—one of the most commercially dominant pop artists of the 2020s—lived at the Sai Anantam Ashram as a child. She appears on the cover of <em>World Spirituality Classics Vol. 1: The Ecstatic Music of Alice Coltrane Turiyasangitananda</em> (Luaka Bop, 2017), to the right of Alice, in a pink dress. <em>The transmission's reach into mainstream pop culture is not a metaphor for cultural diffusion; it is a biographical fact that the reception apparatus has not yet learned to read.</em>`, src:"Luaka Bop · Instagram" },
  { id:"B.20", img:"images/b20", images:["images/b20","images/b20b"], layout:"stacked", title:"Alice Coltrane: Monument Eternal", meta:"Hammer Museum at UCLA · February 9 – May 4, 2025", body:`A major multimedia exhibition taking its name from her 1977 book, featuring archival materials—handwritten correspondence, unreleased audio, rarely seen video—alongside works by nineteen contemporary artists including Rashid Johnson, Cauleen Smith, and Martine Syms. Three thematic sections: <em>Sonic Innovation, Spiritual Transcendence, Architectural Intimacy.</em> Turiya Rising weekly performance series on a stage designed by GeoVanna Gonzalez.`, src:"Photo: Joshua White · Hammer Museum" },
  { id:"B.21", img:"images/b21", title:"The Year of Alice", meta:"John & Alice Coltrane Home · 2024–2025", body:`Inaugural presentation re-positioning Alice Coltrane's legacy as musician, composer, and spiritual leader: catalog reissues including <em>The Carnegie Hall Concert</em> (1971); an Alonzo King LINES Ballet world premiere choreographed to <em>Journey in Satchidananda</em>; the <em>Monument Eternal</em> exhibition at the Hammer; a Kirtan ceremony at the Integral Yoga Institute; and a culminating Carnegie Hall concert. The Year also saw the restoration of Alice's original harp—gifted by John shortly before his passing—to peak condition by Lyon & Healy. It is on loan to Brandee Younger, who plays it today.`, src:"thecoltranehome.org/year-of-alice" },
  { id:"F.1", img:"images/f1", title:"Bernhard Leitner · Räumliche Spaltungen eines Akkordes", meta:"Spatial Splittings of a Chord · from the Sound Cube (TON-WÜRFEL) series", body:`Reproduced in Groys, 2008. <em>The rigid geometry of the spatial grid</em> as figure for the institutional reception apparatus the transmission propagates through and exceeds.`, src:"Figure 1 · Methodologies" },
  { id:"F.2", img:"images/f2", title:"Peter Wessel Zapffe, climbing", meta:"University of Oslo's Aula · Uniforum, 2024", body:`Zapffe engaged in <em>the ironic play of verticality</em>, climbing one of the pillars of the University of Oslo's Aula. The Norwegian philosopher of "the last messiah," whose anti-natalist diagnosis of human consciousness frames the thesis's account of psychocarceral enframement and the existential terror that fugitive resonance interrupts.`, src:"Figure 2 · Methodologies" },
  { id:"F.4", img:"images/f4", title:"Deeper · Flyer", meta:"Queens Museum · October 2025", body:`Flyer for the <em>Deeper</em> event—deep listening evening and opening night of withoutSHAPEwithoutFORM's <em>Journey of the Mind</em> exhibit, Queens Museum, October 2025. Design by Nirbhai (Nep) Singh Sidhu. Retrieved from Surya Botofasina's Instagram.`, src:"Figure 4 · Case Study Two" },
  { id:"F.5", img:"images/f5", title:"Brandon Lopez at the People's Forum", meta:"NYC · November 7, 2025", body:`Brandon Lopez performing at the People's Forum. <em>Fred Moten's voice arrives through the phone clipped to the microphone stand.</em> Photograph by the researcher. The break, in Moten's formulation, names the site at which Black musical practice performs <em>"a cutting and abundant refusal of closure"</em>—the philosophical anchor for the thesis's "holding-open the break" praxis.`, src:"Figure 5 · Case Study Three" },
  { id:"F.6", img:"images/f6", title:"ganavya doraiswamy · Instagram", meta:"March 3, 2026", body:`One frame of a lengthy post from ganavya doraiswamy, Instagram, March 3, 2026.`, src:"Figure 6 · [In]Con-Clusion" },
  { id:"F.7", img:"images/f7", title:"Nirbhai (Nep) Singh Sidhu · metalwork sculpture", meta:"Wellin Museum, Clinton, NY · March 2026", body:`On stage during <em>Total Response</em> practice. Photograph by the researcher. <em>That it will arrive in a museum as physical architecture—sound organized by cosmological practice, the technical object and the cosmic order individuating together—is</em> cosmotechnics <em>made material.</em>`, src:"Figure 7 · [In]Con-Clusion" },
  { id:"F.8", img:"images/f8", title:"listens to alice coltrane once", meta:"Meme · @deepcutsrecordstore, Instagram · March 5, 2026", body:`Scored to Alice Coltrane's <em>Journey in Satchidananda (feat. Pharoah Sanders)</em>. Re-shared by @alicecoltraneofficial (the estate) and Flying Lotus (Steven Ellison, Alice's great-nephew). Commented on by Matana Roberts, AACM-lineage composer and saxophonist: <span class="quote">"all it takes 💐."</span> Bobby Hill character, <em>King of the Hill</em> (20th Television, 1997–2010).`, src:"Figure 8 · [In]Con-Clusion" }

  { id:"01 · 1938", img:"images/d1", audio:"audio/d1", title:"Lead Belly · Scottsboro Boys", meta:"Smithsonian Folkways Recordings", body:`The 1938 recording in which Huddie Ledbetter delivers the spoken afterword that names the survival instruction: <span class="quote">"best stay woke, keep their eyes open."</span> A protest song for nine Black teenagers falsely accused of rape in Alabama. <em>The phrase carries a longer history than any single carrier</em>—the call to remain conscious in the face of material danger inseparable from the call to remain conscious at all.`, src:"Smithsonian Folkways · disc 1 of 5" },
  { id:"02 · 1963", img:"images/d2", audio:"audio/d2", title:"John Coltrane · Alabama", meta:"Live at Birdland · Impulse! Records", body:`Coltrane shaped the saxophone's rhythmic cadence from the flow of Dr. Martin Luther King Jr.'s eulogy following the 16th Street Baptist Church bombing in Birmingham—the attack that claimed the lives of Addie Mae Collins, Cynthia Wesley, Carole Robertson, and Carol Denise McNair. <em>A spoken prayer hidden inside the instrument's voice.</em>`, src:"Impulse! Records · 1963" },
  { id:"03 · 1965", img:"images/d3", audio:"audio/d3", title:"John Coltrane · A Love Supreme", meta:"Impulse! Records", body:`The four-movement suite. Coltrane's offering of gratitude for his deliverance from heroin addiction—<em>a prayer on the boundless potential of vibrational reality, on the unity of all things in God</em>. He wove the words of the Psalm poem into the saxophone's melodic line, a spoken prayer hidden inside the instrument's voice, legible only when the liner notes revealed what the horn had been saying all along.`, src:"Acknowledgement · Resolution · Pursuance · Psalm" },
  { id:"04 · 1970", img:"images/d4", audio:"audio/d4", title:"Alice Coltrane · Ptah, the El Daoud", meta:"Impulse! Records", body:`Includes <em>Turiya and Ramakrishna</em>, the case study one composition. Alice on piano (1, 2, 4) and harp (3); Pharoah Sanders on tenor saxophone, alto flute, bells; Joe Henderson on tenor and alto flute; Ron Carter on double bass; Ben Riley on drums.`, src:"Ptah · Turiya and Ramakrishna · Blue Nile · Mantra" },
  { id:"05 · 1972", img:"images/d5", audio:"audio/d5", title:"John Coltrane · Infinity", meta:"Impulse! Records · produced by Alice Coltrane", body:`Combining Alice's original compositions with sessions from her recently deceased husband. The release was read by critics as disrespectful and demeaning to his memory, rather than as the shared boundary-dissolving practice that John himself had deployed throughout his career. <em>The reception apparatus could not hear a Black woman as co-author of a shared cosmic project. It could only hear a widow handling property.</em>`, src:"Peace on Earth · Living Space · Joy · Leo" },
  { id:"06 · 1972", img:"images/d6", audio:"audio/d6", title:"Alice Coltrane · World Galaxy", meta:"Impulse! Records", body:`Recorded at Record Plant NYC, 1971. Includes Swami Satchidananda's spoken introduction—<em>"Love is the beginning. Love is the continuation. And Love is the end"</em>—and Alice's reverent re-rendering of John's <em>A Love Supreme</em>.`, src:"My Favorite Things · Galaxy In Satchidananda · A Love Supreme" },
  { id:"07 · 1974", img:"images/d7", audio:"audio/d7", title:"Devadip Carlos Santana & Turiya Alice Coltrane · Illuminations", meta:"Columbia Records", body:`The album the 15-year-old researcher was directed to start with by a stranger on Soulseek. Composed to Columbia's commercial chagrin. <em>The first-fruit of the spiritual and musical mentorship Alice maintained with Santana during his Sri Chinmoy discipleship years.</em>`, src:"Angel of Air · Bliss: the Eternal Now · Illuminations" },
  { id:"08 · 2017", img:"images/d8", images:["images/d8","images/d8b"], layout:"side-by-side", audio:"audio/d8", title:"Alice Coltrane · Glorious Chants (Ashram Recordings)", meta:"Avatar Book Institute · 1995 / Luaka Bop · 2017", body:`Private-press cassettes from the Sai Anantam Ashram, first publicly released as <em>World Spirituality Classics Vol. 1: The Ecstatic Music of Alice Coltrane Turiyasangitananda</em>. Alice on vocals, organ, Oberheim OB-8 synthesizers, and harp. The Sai Anantam Singers on vocals.`, src:"Om Rama · Journey to Satchidananda · Rama Katha" },
  { id:"09 · 2004", img:"images/d9", audio:"audio/d9", title:"Alice Coltrane · Translinear Light", meta:"Impulse! Records", body:`Alice's return-to-secular-recording album, produced by Ravi Coltrane. Alice on piano, Wurlitzer organ, and synthesizer; Ravi on tenor and soprano saxophones; Oran Coltrane on alto saxophone; Charlie Haden and James Genus on bass; Jack DeJohnette and Jeff "Tain" Watts on drums; the Sai Anantam Ashram Singers on vocals.`, src:"Sita Ram · Translinear Light · Crescent · Leo" },
  { id:"10 · 2008", img:"images/d10", audio:"audio/d10", title:"Erykah Badu · Master Teacher Medley", meta:"New Amerykah Part One (4th World War) · Universal Motown", body:`Originally composed by Georgia Anne Muldrow for Sa-Ra Creative Partners in 2005. Muldrow's original lyric was <em>"I'd stay woke"</em>—conditional, aspirational. Badu sang it as <em>"I stay woke"</em>—declarative, present tense. <em>The conditional became the declarative.</em> The phrase carried a longer history than any single carrier; Muldrow first heard it from saxophonist Lakecia Benjamin at the New School.`, src:"Universal Motown · 2008" },
  { id:"11 · 2016", img:"images/d11", audio:"audio/d11", title:"Elder Ones · Holy Science", meta:"Northern Spy Records", body:`Four extended movements named for the four yugas. <em>Dvapara Yuga (For Eric Garner)</em>. The avant-garde devotional lineage extending into the contemporary moment.`, src:"Sathya · Treta · Dvapara · Kali Yuga" },
  { id:"12 · 2023", img:"images/d12", audio:"audio/d12", title:"André 3000 · New Blue Sun", meta:"Epic Records", body:`The ambient flute album. Track titles as diaristic koans: <em>"I Swear, I Really Wanted to Make a 'Rap' Album but This Is Literally the Way the Wind Blew Me This Time."</em> The recording the researcher heard on the leaked flight, weeks before <em>Apertures</em>. <em>It was not what i expected. It was a calming and centering sonic contemplation.</em>`, src:"Carlos Niño & Friends · production network" },
  { id:"13 · 2023", img:"images/d13", audio:"audio/d13", title:"Rajna Swaminathan · Apertures", meta:"Commissioned by Chamber Music America's New Jazz Works Program", body:`Co-produced by ganavya doraiswamy. Featuring <em>Surrender is Easier Said Than Done</em>, lyrics by Swaminathan, sung by ganavya. Ingrid Monson—whose framework for jazz improvisation as interaction grounds this thesis's methodology—served as advisor on Swaminathan's doctoral dissertation at Harvard.`, src:"Funded by the Doris Duke Charitable Foundation" },

    title: "Note on the Text",
    paragraphs: [
      `The lowercase <em>i</em> throughout this thesis is a deliberate methodological commitment, not a typographical inconsistency—a visual-conceptual resistance to what Donna Haraway (1988) names the <em>[G]od trick</em> of disembodied, sovereign authorship. Bracket-hyphen poetics break words open at the sites where their generative possibilities live. The prose-poetic register the thesis sustains throughout is grounded across five converging methodological traditions—phenomenology, qualitative methodology, media studies historiography, decolonial feminist philosophy, and Black feminist poetics—as the chapter on methodology articulates at length. Two appendices follow the body of the thesis: <em>Textual Retentions</em> gathers expanded primary texts the thesis engages; <em>Fugitive Ephemera</em> gathers materials from the transmission's contemporary circulation in non-linear arrangement. Unless otherwise noted in the body text, the appendices are offered as companion traces the reader may enter on their own terms.`
    ]

  {
    id: "looking-glass",
    title: "Into the Looking-Glass: Early Oughts [Con]Vexation",
    epigraph: `"Forgive me father, for I have categorized. I have labeled and I have pigeonholed. So sayeth the penitent music historian." — Kahn, 2020`,
    paragraphs: [
      `i discovered Alice Coltrane’s music through a pirated fiber-optic cable connection. At 15, contemplating a request from my father—who had just buried his own mother—to learn Santana’s “Soul Sacrifice” for his future wake, i stumbled into a peer-to-peer anomaly on Soulseek.[^1] A stranger, bypassing the bandwidth constraints of my 56k modem, shared their T1 connection to transfer Santana’s entire discography instead—but with a specific directive: “Start with <em>Illuminations</em>.” This was not a work of the rock star Santana but rather of a given-name, Devadip[^2]—the spiritual comrade of Alice Coltrane, with whom he had composed the movements to his label’s chagrin. i was not studying a genre. i was being initiated into a sonic lineage through a stranger’s generosity and my father’s mortality. The transmission had begun before i had any framework to receive it. In later years, John Coltrane’s “Psalm”—the final movement of <em>A Love Supreme</em>—hung on the wall of my bedroom. The poem was itself Coltrane’s offering of gratitude for his own deliverance from heroin addiction—a prayer on the boundless potential of vibrational reality, on the unity of all things in God. He had woven the words of the poem into the saxophone’s melodic line, a spoken prayer hidden[^3] inside the instrument’s voice, legible only when the liner notes revealed what the horn had been saying all along. i had placed those words on my wall in the early days of recovery from the same affliction—not as decoration but as a reminder of the gratitude i have for every day i experience in a life after death. i had discovered Alice’s music before i ever understood the full breadth of John’s. The transmission had been sounding in my house before i had sensed its voice.`,
    ],
    footnotes: {
      "1": `Soulseek is a peer-to-peer file-sharing application launched in 2001, used primarily for the exchange of music files. Its architecture relies on direct user-to-user transfer—the same relational infrastructure through which the transmission this thesis traces has always propagated.`,
      "2": `<em>Devadip</em>: from the Sanskrit <em>deva</em> (god, divine) and <em>dīpa</em> (lamp, light)—"the lamp, light, and eye of God." Carlos Santana received the name from guru Sri Chinmoy in October 1972 and was a disciple from 1972 to 1981, recording three albums under the name <em>Devadip</em> Carlos Santana: <em>Illuminations</em> with Turiya Alice Coltrane (1974), <em>Oneness: Silver Dreams, Golden Reality</em> (1979), and <em>The Swing of Delight</em> (1980). Though Alice Coltrane was not herself a Chinmoy disciple, she and Santana maintained a concurrent spiritual and musical mentorship during this period, and <em>Illuminations</em>—composed to the Columbia label's commercial chagrin—stands as the first-fruit of that collaboration.`,
      "3": `Coltrane had deployed a similar technique in "Alabama" (1963), shaping the saxophone's rhythmic cadence from the flow of Dr. Martin Luther King Jr.'s eulogy following the 16th Street Baptist Church bombing in Birmingham—the attack that claimed the lives of Addie Mae Collins, Cynthia Wesley, Carole Robertson, and Carol Denise McNair.`,
    }

  {
    id: "thesis-statement",
    title: "Thesis Statement: Always-Already Part-of-It",
    paragraphs: [
      `This thesis argues that Alice Coltrane[^4] Turiyasangitananda’s <em>musicoanagogical</em>[^5] practice enacts a phronetic technology of sensorium [re]attunement: a living transmission the case studies demonstrate through the researcher’s initiated subjectivity and trace through ethnographic field-orientation in New York City’s contemporary avant-garde scene(s). Her recordings, devotional practice, and ashram infrastructure function as nodal entry points into a transmission that exceeds any single artifact. The question this work pursues is not what Coltrane’s praxis is but what it does—what forms of encounter, recognition, and collective becoming it continues to activate in bodies and communities that receive it as transmission rather than as commodity.`,
      `Existing scholarship has approached Coltrane's work biographically and musicologically (Berkman, 2010), within Black women's mystical-utopian lineage (brown, 2021), through Afrofuturist sonic experimentation (Eshun, 1998), and within the type of cultural-historical synthesis the <em>Year of Alice</em>’s lionization-project has occasioned (Beta, 2026). Michael Gallope's <em>The Musician as Philosopher</em> (2024)—published after this thesis's research question had already been formulated—has most directly opened the philosophical reading the present thesis extends, situating Coltrane within a postwar New York vernacular avant-garde whose musicians (alongside David Tudor, Ornette Coleman, the Velvet Underground, Patti Smith, Richard Hell) were resistant philosophers operating at the threshold of music's ineffability. Gallope's chapter on Alice, centered on <em>Universal Consciousness</em> (1971), reads her music as a novel mobilization of ineffability—a “polyphonic, overabundant, oblique” alchemy that interpellates the listener with desire for a transcendence that would “forever appear beyond the capacities of description” (Gallope, 2024, p. 180).`,
      `This thesis joins Gallope's reading and extends it into a register his framework leaves underdeveloped. Where Gallope reads Coltrane's music as a novel mobilization of ineffability— an alchemy that interpellates listeners with desire for a transcendence that would “forever appear beyond the capacities of description” (Gallope, 2024, p. 180)—this thesis acknowledges the ineffable-transcendent dimension and joins a broader contemporary scholarship (brown, 2021; Doraiswamy, 2024; among others) in reading Coltrane's praxis as also a sustained translation of immanence: the cultivation of a present-tense, embodied, collectively-trained sensorium for which the divine is not just transcendent-as-elsewhere but also immanent-as-here, available to a body and a community trained to register vibratory reality at the threshold where conceptual capture begins. The energetic substrate as field of Absolute Consciousness, the austerity-disciplined body, the collective devotional infrastructure, the ashram as working site of daily practice—these are not gestures toward transcendence alone but articulations of immanence as a practical relational condition. <em>Presencing consciousness</em>, the term this thesis develops to name what Coltrane's practice cultivates, names these immanent aspects of a non-dual register: not the transcendent that exceeds description, but the present that exceeds capture by the conceptual apparatus a body has been trained to bring to it.`,
      `This is the philosophical project the thesis receives as an assemblage—Coltrane's writings, recordings, ashram pedagogy, musical practice, and the kinship networks that have continued the work as a heterogeneous gathering of elements that hold together as a single working practice without subordinating any element to the others or to a master-articulation that would govern them. The case studies engage three recordings ('Turiya and Ramakrishna,' 1970; 'Journey to Satchidananda' in its 1980s ashram version, released 2017; 'Translinear Light,' 2004), extending the philosophical reading across the chronological span Gallope's framework brackets—and trace, through ethnographic field-orientation in the contemporary New York avant-garde scene (2023–2026), how the assemblage continues to operate as living transmission in present-tense bodies and communities.`,
      `The chapter on methodology that follows this introduction articulates the commitments under which the engagement operates and grounds the writerly register the thesis sustains throughout. The literature review gathers the theoretical apparatus the inquiry deploys, discussing external sources for their methodological and conceptual relevance to Coltrane's praxis. A beginning bridge chapter then engages <em>Monument Eternal</em> (1977) as initiatory philosophical text, opening the cosmological vocabulary the thesis develops and the recordings articulate in their own medium. Three case studies follow: the first engages "Turiya and Ramakrishna" (1970); the second engages "Journey to Satchidananda" (2017) in its ashram <em>bhajan</em> form; the third engages "Translinear Light" (2004). Each case study closes with a vignette bringing visibility to the contemporary kinship networks that have formed around her memory. This work's final chapter returns to those networks and their ongoing operation in rooms the thesis has inhabited throughout the research period.`,
    ],
    footnotes: {
      "4": `<em>Turiyasangitananda</em> is the spiritual name Alice received from the Supreme, which she translates at the close of <em>Monument Eternal</em> as "The Transcendental Lord's highest song of bliss" (Coltrane-Turiyasangitananda, 1977, p. 52).`,
      "5": `i adopt Doraiswamy's (2024) term <em>musicoanagogical</em> to name a practice in which music operates as the vehicle for anagogic encounter.`,
