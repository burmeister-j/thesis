      `If the <em>ontological witness</em> is the condition and sonic emptying-as-opening its mechanism, the question becomes: what does the practitioner carry forward when the music stops? Doraiswamy’s (2024) concept of <em>portare foglio</em>—carrying leaves—drawn from the <em>yāttirikar sampradāya</em>, names the answer with a precision no European theoretical vocabulary reaches. For the diasporic subject, the temple is not a geographic location. It is a practice of carrying the local with you—the leaves gathered on the pilgrimage route, each one a trace of a specific encounter, collectively constituting a portable sacred architecture that the pilgrim assembles and reassembles in each new place. Coltrane’s praxis—the ashram, the devotional recordings, the pedagogy—were the construction of a <em>portable temple</em> whose carriers would not need the institution to transmit what the institution had enabled. “Translinear Light” is one such leaf: a <em>tertiary retention</em> that carries the quality of the encounter forward to anyone capable of receiving.`,
      `Doraiswamy’s second concept—<em>tiṇṇai</em>, the traditional Tamil veranda occupying the space between the private home and the public street—provides the architectural logic. The <em>tiṇṇai</em> is “perhaps the most important part of the home: something that does not seek to do anything except be a distilled entity of a largeness” (Doraiswamy, 2024). It is neither inside nor outside— a threshold, a fugitive gathering space where private grief meets public witness. The <em>sonic tiṇṇai</em> is what Coltrane builds on the title track and what her inheritors build in every space they enter: a resonant architecture that transforms whatever room it occupies into a threshold between registers. Ed Michel, producing <em>World Galaxy</em>, described the experience: “The amazing thing was her teaching the strings how to play free” (Pouncey, 2002, p. 44). The freedom was not formlessness. It was the transmission of a specific quality of attention—a <em>phronetic pedagogy</em> in which the teacher’s condition was the lesson.`,
      `Marcus Moore, writing in <em>The New York Times</em> in November 2024, described ganavya doraiswamy’s <em>daughter of a temple</em> as the album that “perhaps best captures the creative intimacy around Alice and John”—with arrangements “just slightly off the originals, leaving the bones of the songs intact while reaching toward something new” (Moore, 2024). The bones carried, the flesh renewed. Moore called ganavya “the singer whose work feels like prayer.” What he was naming—without the theoretical vocabulary formalizing it—was the <em>portable temple</em> in its contemporary form: a practice of gathering in which the <em>sonic tiṇṇai</em> is constructed not by an institution but by a single voice trained in the <em>yāttirikar sampradāya</em> and refined through the transmission lineages of both South Indian devotional music and the post-Coltrane experimental tradition.[^33]`,
    ],
    footnotes: {
      "33": `ganavya doraiswamy is a vocalist, composer, and scholar whose practice spans South Indian devotional music, experimental jazz, and the post-Coltrane transmission lineages. Her doctoral work engages the Akashic Records and the <em>yāttirikar sampradāya</em> (pilgrim tradition). She studied under esperanza spalding and works in deep dialogue with Vijay Iyer—who recalls the moment Muhal Richard Abrams asked him, “Are you your mind?,” and answered with an allusion to Buddhist and yogic traditions: you are also the one who observes your own mind (Iyer, in Eyerly & Wheeler, 2021). The <em>ontological witness</em>, posed as a question between two pianists, passed forward into a generation that would carry it to ganavya, who carries it now.`,
    }

      `In September 2025, i attended ganavya’s performance at the First Universalist Unitarian Congregation in Brooklyn. The room itself was dissertation. South Asian elders sat beside queer nightlife workers, noise musicians, jazz scholars, and enamored fans drawn by the sensibilities the artist’s reputation, digital presence, and praxis conveys—a congregation that defied the segregationist logics of the city by the simple fact of being in the same pews. ganavya did not perform at the audience. She co-constituted a space-time with the acoustics and the presenced offering of all who were gathered—the room as resonant field, the congregation as ensemble.`,
      `After a few poems were songed, the parents of a friend and mentor who transitioned from this realm some ten years earlier were brought to the stage. The father, visibly and potently shaken in loving remembrance, sang an ancient Gujarati lullaby. The mother began a <em>garba</em>[^34]. ganavya raised the mother into a tear-filled embrace. The vertical hierarchy of the stage did not dissolve—it folded. The stage and the floor became a single surface without inside or outside. The <em>tiṇṇai</em>.`,
      `Then Marcellus Williams was invoked[^35]—his name, his case, his lyrics. The venue transformed into a site of abolitionist refusal. Hundreds of untrained voices sang his words collectively: a muddy heterophony finding common resonant frequency. The <em>portable temple</em> was no longer a concept. It was audible—the alpha function conducted collectively, in real time, in a room where every person present was simultaneously receiver and transmitter of a transmission that Alice Coltrane had mediated decades earlier and that showed no sign of attenuating. i left the building and the frequency was still sounding. “I thought I could see so far ahead. / Little did I know, I was clouded. / Surrender is easier said than done. / Will you hold my hand as we walk into the sun?” —Rajna Swaminathan, “Surrender is Easier Said Than Done,” from <em>Apertures</em> (2023). Lyrics performed by ganavya doraiswamy[F.6]`,
    ],
    footnotes: {
      "34": `Garba is a Gujarati circle dance performed during Navaratri, the nine-night festival honoring Durga and the divine feminine. The word derives from the Sanskrit <em>garbha</em> (womb): dancers move in concentric circles around a clay lamp symbolizing the soul within the body, enacting the cycle of life, death, and rebirth.`,
      "35": `Marcellus Williams was executed by the state of Missouri on September 24, 2024, despite significant doubt about his conviction and over the objections of the prosecuting attorney. His poetry, composed during his years on death row, circulated through abolitionist networks and entered the musical vocabulary of the communities this thesis traces. ganavya songs a poem he wrote days before his execution, “At Last, Another’s Heartbeat”. She asks the congregation to join her in his refrain: “There is so much | beauty, and comfort | in being in love | and in, just being.”`,
    }

      `This chapter inhabits an assemblage that has been operating as the thesis's own composition all along—and that the scene the field-orientation has been documenting recognized the researcher before the researcher recognized themselves in it.`,
      `“<em>Sat Chit Ananda</em>, Being-Awareness-Bliss”—Aldous Huxley wrote that, for the first time, he understood this, “not on the verbal level, not by inchoate hints or at a distance, but precisely and completely what those prodigious syllables referred to” (1954, p. 17). He was looking at flowers. Dominant readings of the perennialist canon reduce this to textual extraction—a Western intellectual cataloguing Eastern concepts from a comfortable remove. But in that moment, Huxley was not extracting. He was recognizing. Recognition is not discovery—it is remembrance. Hearing a still small voice, the body knows before the mind names. What Huxley transmitted through text—brilliant, permeating, generative—Alice Coltrane Turiyasangitananda transmitted through multi-modal embodied collective practice. “My music and life are both based upon a simple, integral principle,” she wrote: “spirituality and truth” (Coltrane, in Beta, 2026). His infrastructure is commonly reduced to the page; hers must be acknowledged as the life entire. What she built—across decades of monastic discipline, maternal nurturing, pedagogical care, and sonic architecture—was the infrastructure through which recognition could propagate: not as private experience but as <em>collective individuation</em>, not as chemical event but as devotional practice, not as one reader’s afternoon but as radiant flux. It never ceased at the threshold of any room this thesis has entered. <em>Monument Eternal</em> opened the vocabulary; the three recordings sounded it. What the preceding chapters traced—the radical perennialist architecture of a single piano composition, the <em>collective individuation</em> of an ashram devotional, and the <em>portable temple</em> carried in overtones—were not three separate arguments. They were three faces generated out of the same break, viewed through the kaleidoscope Medina named: each new relation retroactively transforming all previously established relations, nothing collapsing into synthesis. What remains is not to summarize what the thesis has found but to demonstrate that the finding-out is still underway—that she was a medium through which the frequency communicated into culture. That transmission is active in rooms she never entered, sounding through infrastructure she could not have predicted with material certainty. The researcher’s initiated subjectivity is the primary evidence. These vignettes are its testimony.`,
      `The frequency predates its carriers. John Coltrane’s Psalm—the poem that became a prayer that became a melody—names it directly: “One thought can produce millions of vibrations and they all go back to God… everything does.” Swami Satchidananda[^36], in the words Alice chose to open her own version of <em>A Love Supreme</em>, names the same structure as Love: “Love is the beginning / Love is the continuation / And Love is the end.” Between John’s vibrations returning to God and Satchidananda’s Love that is simultaneously origin, continuation, and destination, Alice enacted the modes of being this thesis has been tracing—not as origin but as aperture, the one whose fidelity to the transmission made it receivable in a form adequate to its own time. The wall was never the point. The meadow was always-already open. What follows are the rooms in which i knew it.`,
    ],
    footnotes: {
      "36": `Swami Satchidananda, opening invocation at the Woodstock Music and Art Fair, Bethel, New York, August 15, 1969. Satchidananda was Alice Coltrane's guru. Carlos Santana, whose performance of "Soul Sacrifice" at the same festival prompted the researcher's journey into this lineage, would later collaborate with Coltrane on <em>Illuminations</em> (1974) during his own concurrent spiritual path (see footnote 2).`,

      `On November 10, 2023—weeks before i would inhabit <em>Apertures</em>—i listened to a leaked recording of André 3000’s <em>New Blue Sun</em> on the flight from Florida to New York. The album had surfaced online hours earlier with no formal announcement, only a tremor of bewilderment rippling through music culture: André Benjamin, one half of Outkast, had made an ambient flute record. i listened to it the entire flight. It was not what i expected. It was a calming and centering sonic contemplation, priming my nervous system for the new experience of NYC’s ceaseless sensorial flood. The framework through which i would come to understand what i was hearing had not yet been built. Some months later, visiting a close friend in Atlanta who had come through a difficult season and was doing well—back at work, steady at home—i went to see <em>New Blue Sun</em> performed live at Center Stage. A young woman sitting beside me asked, roughly mid- performance, when they would be done warming up. She had come uninformed, expecting a hip- hop show. i explained they had just finished their third movement. She looked worried. André spoke after this, while the ensemble—Carlos Niño, Surya Botofasina, Nate Mercereau, Deantoni Parks—softly improvised beneath his words. He thanked the audience for temporarily surrendering their phones, which had been sealed at entry in magnetically locked pouches that would unlock only at the performance’s end. He described how shared attention was shaping the music—that the album contained round-about licks from which each night’s performance drew, but that the music was mostly improvisational, shaped by the resonance of the room and everyone gathered in it. Then he explained how the project began. He had been playing flute in public spaces for years, since retiring from touring as Outkast. One day, while grocery shopping, Niño approached him and invited him to a gathering he organized each year with Botofasina and others—a musical-honoring of the memory of Alice Coltrane Turiyasangitananda. This was André’s first time playing flute with a group. Over the next several years, they continued to play together, eventually generating the album that would earn a Grammy nomination for Album of the Year. André urged us to seek out his bandmates’ work and announced the start of the <em>Year of Alice</em>.[^37]`,
      `In March 2025, i returned to the Apollo Music Café for the first time since that December night in 2023. i had come to see Georgia Anne Muldrow, whose music i had followed for years without knowing anything about her other than i liked the way her music felt. Midway through the performance, she paused to acknowledge her mentor—Swamini Turiyasangitananda. i was well into the concerted research for this project. i had no idea of the connection. The transmission had been sounding in Muldrow’s work for as long as i had been listening to it. What the research later revealed was that the connection was not incidental but kinship: Muldrow’s aunt is Radha Botofasina-Reyes—the same Radha whose testimony on the <em>Swamini</em>’s teaching anchored the preceding chapters, the longtime ashram member, the mother of Surya Botofasina. Muldrow joined the community as a youth through her mother and aunt and was given the name Jyoti—light, flame—by Alice Coltrane herself. In her own words: “Through my life, Turiyasangitananda, this woman has saved my life. Just being in her field helped me be inspired to live again and not commit suicide” (Muldrow, in Off Shelf, 2020). Muldrow and Surya Botofasina are effectively ashram siblings. The same kinship network that produced the ashram devotionals, that carried the “Just play” pedagogy, that placed Botofasina and Niño on stage with André in Atlanta—had been running beneath Muldrow’s music the entire time i was listening. What Harmony Holiday (2025) warns against—the deification that “bypasses genuine mourning by reducing people to idols”—is precisely what the transmission resists from within its own kinship structure. The network is not a fan community. It is a family and fellowship, and what they carry is practice: the daily labor of living in the frequency. Muldrow’s early career in Los Angeles produced another kind of transmission. At shows, she began selling hand-decorated shirts bearing a phrase she had come across in her travels: Stay Woke.`,
    ],
    footnotes: {
      "37": `The <em>Year of Alice</em> was inaugurated by the John & Alice Coltrane Home and the Coltrane family as a multi- disciplinary series spanning 2024–2025: including but not limited to previously unreleased recordings and reissues; the <em>Monument Eternal</em> exhibition at the Hammer Museum; community programming; an Alonzo King LINES Ballet premiere; a <em>Kirtan</em> ceremony at the Integral Yoga Institute in Manhattan—founded by Alice’s guru Swami Satchidananda in 1966—and a culminating concert at Carnegie Hall curated by Ravi Coltrane with a 40-piece orchestra and the Sai Anantam Devotional Ensemble led by Michelle Coltrane (The John & Alice Coltrane Home, n.d.).`,
    }

      `The phrase carried a longer history than any single carrier. In 1938, Huddie Ledbetter (Lead Belly) recorded “Scottsboro Boys,” a protest song for nine Black teenagers (Clarence Norris, Olen Montgomery, Andy Wright, Willie Roberson, Ozie Powell, Eugene Williams, Charlie Weems, Roy Wright, and Haywood Patterson) falsely accused of rape in Alabama. In the spoken afterword he warned: “I advise everybody, be a little careful when they go along through there— best stay woke, keep their eyes open” (Lead Belly, 1938). A survival instruction, born in the blues, carried in the body—the call to remain conscious in the face of material danger inseparable from the call to remain conscious at all, the two registers of wakefulness never divided in the tradition that carried them.[^38] Muldrow first heard the phrase at the New School from the saxophonist Lakecia Benjamin, who used it casually—“I try to stay woke, but I got to go to sleep”—and adopted it as a personal reminder during a period of emotional struggle. She wrote it on a shirt. She carried it to Los Angeles. She wove it into “Master Teacher,” originally composed for Sa-Ra Creative Partners in 2005. Erykah Badu heard the song at Sa-Ra’s Cosmic Dust Studio and wanted it on her coming album, <em>New Amerykah Part One</em> (4th World War). A crucial alteration occurred in the transfer: Muldrow’s original lyric was “I’d stay woke”— conditional, aspirational, the posture of one who knows she is not, yet what she reaches toward. Badu sang it as “I stay woke”—declarative, present tense, the posture of arrival. “I wasn’t claiming that I was woke,” Muldrow later reflected. “I never saw myself as woke. I saw myself as aspiring for woke, to try and stay woke. But I knew I wasn’t woke” (Muldrow, in Okayplayer, 2018). The conditional became the declarative. The aspiration became the identity. The practice became the brand. By 2014, “stay woke” was the rallying cry of the Black Lives Matter movement. Within years, it was a weapon in the mouths of many who never heard Lead Belly’s voice or known the names of the Scottsboro Boys.`,
      `Badu, in conversation with Ari Melber (2023), named the pharmacological situation with the calm of someone who has watched it happen before: “It doesn’t belong to us anymore… once something goes out in the world it takes a life of its own.” And then, without the theoretical vocabulary but with the full weight of the recognition this thesis has been tracing: “I believe denial is the opposite of love.” Badu’s definition restores what both the weaponization and the well-meaning adoption had flattened: woke-ness as [re]awakened-ness—as alignment with nature, operative in the body, the home, the relationship—not only the political arena. The short- circuiting did not begin with the political-right. It began the moment the practice became identity posturing—the moment the conditional collapsed into the declarative and the labor of staying became the claim of having arrived. What Stiegler calls the short-circuiting of <em>transindividuation</em>—the reduction of collective meaning-making to automated consumption— Badu names as denial. What Gray (2022), reading Stiegler through <em>Ubuntu</em>,[^39] identifies as the disaffection of individuals incapable of being affected—the poverty of attention that renders the <em>pharmakon</em> destructive—Badu names as the absence of Love. What both women were pointing at—what the word carried before the flattening, before the counter-cultural adoption, before even Lead Belly’s warning—was what the Coltranes had been transmitting in sound: access to the pre- individual field before sociogenic, hermeneutic inscriptions format consciousness into the loop this thesis has called <em>psychocarceral enframement</em>. The vernacular had always named the <em>ontological witness</em>. “Stay woke” was <em>Turiya</em> in the tongue of the blues. The <em>changing same</em> that Baraka traced through every formal transformation of Black music had moved through a single word across a century: from survival instruction to aspiration to declaration to weapon to, in the rooms this thesis has inhabited, practice anew.`,
    ],
    footnotes: {
      "38": `In 1962, Harlem author William Melvin Kelley published “If You’re Woke You Dig It” in the New York Times. The essay does not use the word “woke” beyond its title, but its subject—the systematic appropriation and decontextualization of African American slang by white culture—is the precise mechanism the word itself would undergo over the following six decades. The essay is, in this sense, prophetic of its own title’s fate (Kelley, 1962).`,
      "39": `<em>Ubuntu</em> (Nguni): the prefix <em>ubu-</em> denotes “enfolded be-ing” —preindividuated being always oriented toward unfoldment or individuation; the stem <em>ntu-</em> denotes the concrete manifestation of a particular entity. Gray (2022, pp. 334–335), reading Ramose (2003) through Simondon and Stiegler, identifies the movement from <em>ubu-</em> to <em>ntu-</em> as the movement from ontology to epistemology, from “be-ing becoming” to “be-ing knowing”—a process immediately implicating <em>transindividuation</em>, with communalism and interdependence as core values. John Mbiti`,
    }

      `After joining in Deeper practice at the Queens Museum, i went to the Sultan Room in Brooklyn the following night to see Saul Williams perform with Carlos Niño and friends. André’s words from the Atlanta stage—“they’re all doing some amazing and cool stuff”—had carried me there more than 2 years later, <em>tertiary retentions</em> as instructions. When i entered, Deep (Kailey) waved me over. She had read tan email i had sent the night before, sharing readings that resonated with the topics we had discussed after meeting at the <em>Simran</em> activation. She introduced me to her close friend and collaborator, Nirbhai (Nep) Singh Sidhu[^40]—an artist who has designed for grounds <em>ubuntu</em> in the maxim “I am because we are,” opposing it to the Cartesian “I think, therefore I am” (Mbiti, 1970, p. 141). Gray’s argument is that Stiegler’s diagnosis of disaffection—individuals no longer capable of being affected, <em>transindividuation</em> short-circuited by digital automation—finds its ontological counter in <em>Ubuntu</em>’s commitment to cosmic harmony and the recognition of the humanity of others as the condition of one’s own.`,
      `Badu, Williams, and several others. Nep spoke about his work with sound sculptures. After the performance, i went to say goodnight. Nep and Deep said they would be in touch about an upcoming event. In January 2026, the invitation arrived: <em>Total Response</em>, at the Wellin Museum in Clinton, New York. Another <em>Simran</em> activation. This time the practice was being professionally recorded for a 2027 exhibition at the same museum—<em>Awakening the Unstruck</em>— which will feature many new works from Sidhu, including a massive omni-directional sound tower through which visitors will be able to explore the practice of <em>Simran</em>, in high-fidelity playback of the night’s practice. The title names what Sikh call <em>anahad shabad</em>, the unstruck sound that precedes all manifest vibration—the concept this thesis traced through myriad cosmologies. That it will arrive in a museum as physical architecture—sound organized by cosmological practice, the technical object and the cosmic order individuating together—is <em>cosmotechnics</em> made material: not the representation of a tradition but its continuation through new infrastructure, echoing Githere’s Afropresentist turn.`,
      `When i arrived at the Wellin, i went to look at the shirts Sidhu had designed for the evening. The young woman at the merch table said, “It’s good to see you, Jeremy.” She sensed my confusion. While she looked vaguely familiar from the Queens Museum, i did not recall meeting her. She explained that the ideas i’d shared were widely discussed within their organization— withoutShapewithoutForm. After the last event, they had asked many attendees to share our feedback on camera. The testimony i had offered (which i experienced as my own incoherent rambling lol) had been featured in the promotional materials they created because they appreciated my thoughts on their practice and ethos. The network had recognized me before i had recognized myself in it. The researcher had become a <em>tertiary retention</em>—words carrying a pre-individual charge forward beyond the speaker’s awareness of their reach. They interviewed me again after <em>Total Response</em>. i was invited to an informal dinner afterward for friends, artists, and musicians. i sat with one of the founding members of withoutShapewithoutForm—a London-based Sikh woman who had transitioned from clinical psychology to community organization and experimental approaches to mental health education—alongside a professor at the Brooklyn College Conservatory and his wife. We spoke extensively about the ideas in this thesis as they pertain to the organization’s aims, and music-[sub]cultural flows wherein all converge, offering technologies of the self to all people in an irreligious and transcultural way while educating others on specific historical cultural traditions. The shared recognition was immediate: her trajectory from the clinic to the commons, mine from a winding path through numerous spiritual, philosophical, and religious systems—arriving, after years of seeking and recovery, at a Pentecostal congregation in Florida where i helped lead music—to this program, had arrived at the same questions (and answers-in-process) through entirely independent routes. As i made my way around the room saying goodnight, i fell into conversation with Angel Bat Dawid—a multi-instrumentalist and vocalist who had been part of the evening’s practice. Her spirit had stirred in me a particular feeling i had experienced in those years of devotional music. She shared, with visible excitement, that her father was a preacher and she had been raised in the Southern Baptist Church. She expressed how lovely it is to collaborate across traditions in a shared recognition of the Absolute and gave me a two-handed high-five. She recently released music with Marshall Allen—the soon-to-be 102-year-old bandleader of the Sun Ra Arkestra. The trajectory Baraka traced in 1967—from Negro spirituals through the New Thing to cosmic consciousness—had arrived at the same farewell, through an entirely independent path, and was shaking my hand. The next morning, Angel Bat Dawid posted on her socials from the John Coltrane House in Philadelphia—itself undergoing restoration, the material infrastructure of the transmission being renewed in parallel with its sonic carriers. Before i left the Wellin, i found Botofasina, whom i had connected with at several events in the city. i thanked him for carrying Alice’s sensibilities forward. We shook hands and he told me he would see me on the other side (alluding to both of our return trips to Queens).`,
      `Days after Deep introduced me to Nep in Brookyn, Williams took the stage at Le Guess Who festival in Utrecht with Niño and Botofasina—most of the same ensemble i had witnessed practicing in the small room at the Sultan Room now sounding in a European concert hall. Williams opened by reading Assata Shakur’s “Affirmation”: “I believe in living. I believe in the spectrum of beta days and gamma people…” Then he delivered what can only be described as a monologue from the meadow on the other side of the wall—a sustained act of spoken transmission that moved through colonialism, extraction, occupation, the drum as the earliest form of wireless communication—and arrived at a declaration the thesis cannot contain but can only point toward: “Before death is eternity. After death is eternity. There is no death. There’s only eternity. And I be riding on the wings of eternity like—Heeyah!!! Heeyah!!! Heeyah!!!.” The full monologue is placed in Appendix A.1, not as supplementary material but as expanded sentiments the thesis has been preparing the reader to receive on their own terms. The reader who turns to it will find themselves having always-already been inside the frequency. What Williams poiesed was not hauntological in nature—not the ghost of a lost future returning to trouble the present. Githere’s [Afro]presentist ontology acknowledges what he presences: the space between the dream and the memory collapsing into being your reality, now. The transmission does not need [re]animating, because it was never not sounding.[F.7]`,
    ],
    footnotes: {
      "40": `Nirbhai (Nep) Singh Sidhu (b. 1981) is a Punjabi-Canadian interdisciplinary artist working across textile, sculpture, sound, and adornment. A member of the creative collective Black Constellation, his practice investigates what he describes as “the metaphysics of form and spatial rhythm within the context of community and self- expression,” seeking to realize the formlessness of the divine through material form. He has exhibited at the Museum of Contemporary Art (Toronto and Detroit), the Aga Khan Museum, the Heard Museum, and Glasgow International. The omni-directional sound tower being constructed for the 2027 <em>Awakening the Unstruck</em> exhibition at the Wellin Museum extends this investigation into the infrastructure of contemplative acoustics.`,

      `What Du Bois (1903) named as double consciousness—the sense of always looking at oneself through the eyes of [the] other(s)—is <em>psychocarceral enframement</em> at a notice-point in Black American intellectual history: the postcolonial subject divided against itself by a gaze it has internalized but did not author. Bazian (2013), in “The Souls of Muslim Folk,” extends this beyond the historically specific Black American condition Du Bois names—identifying the Eurocentric “known” world as that which “produces double consciousness in all subject people it came in contact with” through the ideological engrafting of its filtering lens onto the very affordance of reflexive cognition. The post-colonial subject Bazian names is the body whose aperture has been engrafted with the colonial-imaginary lens at the moment of its opening—the always-already problematic where the Zapffean co-constitution of reflexive cognition and psychic defense meets the Althusserian interpellation by which, because ideology has no outside, the subject is recruited into Eurocentric subjecthood at the same moment it becomes a subject at all—the methodological situation the <em>mosaic-lensed deframement</em> was named to meet. Medina’s extension from double to <em>kaleidoscopic consciousness</em> is not a correction of Du Bois but an excitation—the fracture (break) held open long enough to become generative rather than imprisoning, the split transformed from wound into faculty. Raymond Williams (1977) gives the transmission network a name the cultural vocabulary has not yet absorbed: a <em>structure of feeling</em>—social experience in solution, as distinct from formations that have been precipitated into fixed and available forms. What Williams names is “a kind of feeling and thinking which is indeed social and material, but each in an embryonic phase before it can become fully articulate and defined exchange,” often “not yet recognized as social but taken to be private, idiosyncratic, and even isolating” (pp. 131–132). The ashram kinship network(s), grocery store invitations, messages of care from strangers on Instagram, and homemade shirts with two words on them— these are not anecdotes. They are the structure of a feeling that the existing critical apparatus seems incapable of pricing. What Bohm (1980) calls the <em>implicate order</em>—the enfolded wholeness from which the explicate manifests—and what Krishnamurti, in their shared dialogues, identifies as the ending of psychological time (Bohm & Krishnamurti, 1985), finds its topological form in Rapoport’s <em>Klein Bottle</em>: the non-orientable surface whose inside and outside are continuous, whose self-penetration surmounts the Cartesian Cut that separated subject from object, mind from world, the knower from the known (Rapoport, 2023). Phillips’ (2025) refusal of the master’s clock draws back into view: colonial time is the orientable surface—sequential, extractive, linear. What the <em>bhajan</em> sessions dissolved, what the <em>Simran</em> activation holds open, and what the <em>portable temple</em> carries in its overtones, is the non-orientable topology in which before and after, inside and outside, self-penetrate. The <em>static-circulatory subject</em> of <em>psychocarceral enframement</em>—looping through commodity, signature, and the recursive self- totalization Hofstadter diagnosed—is not the opposite of stillness but its counterfeit: motion without movement, a circulation that forecloses the very field it mines. The <em>static-oscillatory subject</em> is this topology inhabited: not static in the sense of stopped-ness but vibrating at the frequency of the real-to-Real playback, the <em>Klein Bottle</em>’s continuous surface where what appears as duality—waking and dreaming; scholarship and devotion; the personal and the institutional—is held without the cut that would make them two. It arrives here almost without commentary, because the vignettes have already placed the reader inside it. What Aristotle called <em>phronesis</em>—practical wisdom, the eye of moral experience—Kristjánsson and Fowers (2024) confirm as contingently uncodifiable: it cannot be reduced to algorithm or principle, only recognized in the particular by a perception trained through the accumulation of situated encounters. The thesis has not been arguing for this recognition. It has been [en]training <em>ontological witness</em>. Amid so much contemporary stir around consciousness studies, this thesis is not interested in what consciousness is. It is interested in what we are doing with it.`,
      `What this thesis has been doing with consciousness is exemplifying <em>mosaic-lensed deframement</em>—the method now deeply expressed across every page, every vignette, every close listening, and capable of being flagged here as the methodological recognition the practice has been earning all along. The method holds open the fractures in the post-colonial subject’s psyche, potentiating the generation of ever-new modes of being outside the constructed binaristic enclosures Empire inscribes. It activates the affordances necessary for the self-awareness of cosmic-being-ness to re-cognize its relation to all things, existing in relation to Empire but not of its hermeneutically inscribed ontological abstractions. The fracture and the recognition are the single operation: the <em>holding-open of the break</em> long enough for the cosmic-being-ness beneath the constructions to come into self-awareness of the relations the binary enclosure had foreclosed. The frequency that was never not sounding is the sounding of those relational in- betweens. The expanded work the method potentiates is <em>cosmotechnicity</em> itself—the condition in which technical practices illumine a cosmic order rather than extract or abstract from it, the state held open by the method in which being re-cognizes its relations and enacts them materially. What Coltrane built at Sai Anantam, what the thesis has been tracing across three case studies, and what the transmission continues to build in every carrier who receives it, is <em>cosmotechnicity</em>—the unification of cosmic order and technical activity, plural against the homogenizing Western Promethean model the engrafted lens had foreclosed. The method is itself a practice emerging from the sensibility it makes audible in its subject; <em>technodiversity</em> is what that practice opens toward.`,
    ]
  },

      `In the final stages of this research process, i was exploring more of ganavya’s mentor, Vijay Iyer’s work around Black Radical Imaginaries, when i came across a chapter he’d contributed to <em>Sounding Together</em> (Eyerly & Wheeler, 2021). In the collection’s first chapter, i found myself looking at a photograph of collaborators working to [re]sound eighteenth-century Mohican- Moravian hymn texts. Among them was Bill Miller—Grammy-winning Stockbridge-Munsee Mohican musician, singer-songwriter, practitioner across traditional Native American flute, blues, gospel, rock, and sacred music. Bill Miller is my cousin. i did not know he was in the book. i did not open the book looking for my own heritage. The transmission was already in the family. Miller’s practice—bringing ancestral hymn texts back through improvisation, refusing to listen to the German chorale tunes that had originally carried them, drawing instead on what he heard in the woods with the elder hunters and at powwows—is the same structure this thesis has been tracing at every scale. “It’s bringing the past up to now,” he said, “and it is powerful to hold this thing, this song, hundreds and hundreds of years old and then put it in my breath and put it in my soul and then bring it out in the present tense” (Miller, in Eyerly & Wheeler, 2021). Not reanimation—not the revival of something dead—but the present-tense inhabitation of what was never not sounding. When he speaks to students, he asks: “What is Mohican music?” After watching them struggle, he plays a riff on Johnny Cash or Eric Clapton and says, with a grin, “Now, that’s Mohican music.”[^41] The radical perennialist architecture in a joke. The tradition is the living practice, whatever form it takes. The thesis that began with Alice Coltrane’s perennialist practice discovers, at its close, the same structure in the researcher’s own kinship— the same convergence of traditions, the same refusal to let any single form contain what the practice carries, the same spiritual work in service of community. This was not designed. It emerged in not-knowing what was to be discovered.`,
      `This thesis opens more doors than it has yet entered. The pharmacological journey a single word can take from survival instruction to cultural weapon—traced here across a century—warrants a full study. The cosmotechnical architecture of Sidhu’s sound sculptures, the pedagogical lineage from Coltrane through Botofasina to the next generation, the relationship between <em>Simran</em> and Deep Listening as parallel technologies of the self, the Mohican-Moravian hymn tradition as radical practice of creolization, the kinship networks carrying the transmission through informal channels that institutional sights have historically overlooked (just to name a few)—each is a thesis in waiting. Existing neurological and somatic research in-formation increasingly corroborates the ontological claims this thesis and its interlocutors make—from contemplative neuroscience to polyvagal theory to psychedelic phenomenology—awaits integration with the cultural and philosophical frameworks assembled here.`,
      `At the Rough Trade celebration of <em>Monument Eternal</em>’s second edition, i spoke with panel speaker Ashley Kahn—music journalist and NYU Tisch faculty—about the nature of this thesis. He shared that the university had been developing an interdepartmental course around Turiyasangitananda’s practice and legacy, and that it was proving an immensely difficult task. What this work offers is not a conclusion but a lens, and the lens is available to anyone with the openness to use it.`,
      `From punk to hip-hop to jazz, and every variety of other categorical enclosure, musicians and artists who made their life the work of art… have been educating, inspiring, and informing me all along. The thesis did not produce the recognition. It gave the recognition a language adequate to itself. In a recent video documenting the <em>Total Response</em> practice, i observed: “What i think is so beautiful about the name <em>Koi</em>… the title <em>Koi</em>—that’s so beautiful to me because that’s what’s important to me in my own life. And those are the kind of people that i see as heroes—are these people who’ve accessed true presence—to find the solidity in that—to move that way in your entire life and in every single thing you do. That’s, to me… why you do this” (Burmeister, 2026, March 7, in withoutSHAPEwithoutFORM <em>Total Response</em> promotional video, posted on Instagram).`,
      `The frequency was never not sounding. <em>Koi</em> (ਕੋਈ): someone, anyone. <em>Koi Nahi</em> (ਕੋਈ ਨਹੀ): no one, nobody. <em>Har Koi</em> (ਹਰ ਕੋਈ): everyone, each one.[^42][F.8]`,

const IMG_EXTS = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'avif', 'JPG', 'PNG'];

function tryLoadImage(basePath, onSuccess, onAllFail) {
  let i = 0;
  function tryNext() {
    if (i >= IMG_EXTS.length) { onAllFail && onAllFail(); return; }
    const url = basePath + '.' + IMG_EXTS[i++];
    const probe = new Image();
    probe.onload = () => onSuccess(url);
    probe.onerror = tryNext;
    probe.src = url;
  }
  tryNext();
}

class Rotator {
  constructor(stageEl, entries, name) {
    this.stage = stageEl;
    this.entries = entries;
    this.name = name;
    this.current = 0;
    this.paused = false;
    this.elapsed = 0;
    this.duration = 12000;
    this.render();
  }

  render() {
    this.entries.forEach((e, i) => {
      const article = document.createElement('article');
      article.className = 'entry' + (i === 0 ? ' active' : '');
      article.dataset.index = i;

      // determine images array: single image (e.img) or array (e.images)
      const imageList = e.images && e.images.length ? e.images : [e.img];
      const layoutClass = e.layout ? ' ' + e.layout : '';

      article.innerHTML = `
        <div class="entry-text">
          <div class="entry-label">${e.id}</div>
          <h2 class="entry-title">${e.title}</h2>
          <p class="entry-meta">${e.meta}</p>
          <div class="entry-body">${e.body}</div>
          <p class="entry-source">${e.src}</p>
        </div>
        <div class="entry-image${imageList.length > 1 ? ' multi' : ''}">
          <div class="placeholder">
            ${mandalaSVG}
            <span class="ph-id">${e.id}</span>
            <span class="ph-note">drop in: ${imageList[0]}.*</span>
          </div>
        </div>`;
      const frame = article.querySelector('.entry-image');

      // Load each image; insert in PDF order. For multi-image entries,
      // only one image shows at a time; navigation is via the toggle controls.
      let attemptsFinished = 0;
      const totalAttempts = imageList.length;

      function attachToggleIfReady() {
        if (imageList.length <= 1) return;
        if (attemptsFinished < totalAttempts) return;
        if (frame.querySelector('.image-toggle')) return;
        const loadedImgs = frame.querySelectorAll('img');
        if (loadedImgs.length < 2) return; // no point in a toggle if only one loaded

        const toggle = document.createElement('div');
        toggle.className = 'image-toggle';
        toggle.innerHTML = `
          <button class="img-nav img-prev" aria-label="previous image">‹</button>
          <span class="img-counter"><span class="img-cur">1</span> / ${loadedImgs.length}</span>
          <button class="img-nav img-next" aria-label="next image">›</button>
        `;
        frame.appendChild(toggle);

        const cur = toggle.querySelector('.img-cur');
        const prevBtn = toggle.querySelector('.img-prev');
        const nextBtn = toggle.querySelector('.img-next');
        let active = 0;

        function showAt(i) {
          const imgs = frame.querySelectorAll('img');
          imgs.forEach((im, ii) => im.classList.toggle('active', ii === i));
          cur.textContent = i + 1;
          active = i;
        }
        prevBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          showAt((active - 1 + loadedImgs.length) % loadedImgs.length);
        });
        nextBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          showAt((active + 1) % loadedImgs.length);
        });
      }

      imageList.forEach((basePath, idx) => {
        tryLoadImage(basePath,
          (url) => {
            const imgEl = document.createElement('img');
            imgEl.src = url; imgEl.alt = e.title;
            imgEl.dataset.imgIndex = idx;
            if (imageList.length > 1) {
              imgEl.classList.toggle('active', idx === 0);
            }
            // remove placeholder on first successful load
            const ph = frame.querySelector('.placeholder');
            if (ph) ph.remove();
            // insert in correct order based on idx
            const existing = Array.from(frame.querySelectorAll('img'));
            const next = existing.find(el => Number(el.dataset.imgIndex) > idx);
            if (next) frame.insertBefore(imgEl, next);
            else frame.appendChild(imgEl);
            attemptsFinished++;
            attachToggleIfReady();
          },
          () => {
            // Failed to load — log so we can debug missing files
            console.warn(`Image not found: ${basePath} (entry ${e.id})`);
            attemptsFinished++;
            attachToggleIfReady();
          }
        );
      });

      this.stage.appendChild(article);
    });
  }

  setActive(idx) {
    this.stage.querySelectorAll('.entry').forEach(el => {
      el.classList.toggle('active', Number(el.dataset.index) === idx);
    });
    this.current = idx;
    const active = this.stage.querySelector('.entry.active .entry-body');
    if (active) active.scrollTop = 0;
  }

  goTo(idx) {
    this.setActive((idx + this.entries.length) % this.entries.length);
    this.elapsed = 0;
  }

  next() { this.goTo(this.current + 1); }
  prev() { this.goTo(this.current - 1); }

  step(deltaMs) {
    if (this.paused) return;
    this.elapsed += deltaMs;
    if (this.elapsed >= this.duration) this.next();
  }

  progressPct() {
    return Math.min((this.elapsed / this.duration) * 100, 100);
  }
}

class Reader {
  constructor() {
    this.passage = null;
    this.wordEls = [];
    this.wordIndex = 0;
    this.paused = true; // start paused — user enters from TOC
    this.timeUntilNext = 0;
    this.speed = 0.5;
  }

  load(passageId) {
    this.passage = passages.find(p => p.id === passageId);
    if (!this.passage) return;
    let titleHTML = `<div>${this.passage.title}</div>`;
    if (this.passage.epigraph) titleHTML += `<div class="passage-epigraph">${this.passage.epigraph}</div>`;
    passageTitleEl.innerHTML = titleHTML;

    passageEl.innerHTML = '';
    this.wordEls = [];
    this.passage.paragraphs.forEach((para, pi) => {
      const span = document.createElement('span');
      const tmp = document.createElement('span');
      // convert [^N] to clickable footnote markers BEFORE wrapping words
      let processed = para.replace(/\[\^(\d+)\]/g, '<sup class="footnote-marker" data-fn="$1" tabindex="0">$1</sup>');
      // convert [F.N] (or [d5]) to clickable figure markers
      processed = processed.replace(/\[(F\.\d+|d\d+)\]/g, '<sup class="figure-marker" data-fig="$1" tabindex="0">$1</sup>');
      tmp.innerHTML = processed;
      this.wrapWords(tmp);
      while (tmp.firstChild) span.appendChild(tmp.firstChild);
      passageEl.appendChild(span);
      if (pi < this.passage.paragraphs.length - 1) {
        const br = document.createElement('span');
        br.className = 'br';
        passageEl.appendChild(br);
      }
    });
    this.wordEls = Array.from(passageEl.querySelectorAll('.word'));
    this.wordEls.forEach((el, i) => el.addEventListener('click', () => this.jumpTo(i)));
    // wire up footnote markers
    passageEl.querySelectorAll('.footnote-marker').forEach(m => {
      m.addEventListener('click', (e) => {
        e.stopPropagation();
        showFootnote(m.dataset.fn);
      });
    });
    // wire up figure markers
    passageEl.querySelectorAll('.figure-marker').forEach(m => {
      m.addEventListener('click', (e) => {
        e.stopPropagation();
        showFigure(m.dataset.fig);
      });
    });
    this.wordIndex = 0;
    this.timeUntilNext = 0;
    this.setPaused(false);
    this.updateActive();
    this.updateMeta();
  }

  wrapWords(node) {
    const children = Array.from(node.childNodes);
    children.forEach(child => {
      if (child.nodeType === 3) {
        const text = child.textContent;
        if (!text.trim()) return;
        const frag = document.createDocumentFragment();
        const parts = text.split(/(\s+)/);
        parts.forEach(part => {
          if (/^\s+$/.test(part)) {
            frag.appendChild(document.createTextNode(part));
          } else if (part) {
            const span = document.createElement('span');
            span.className = 'word';
            span.textContent = part;
            frag.appendChild(span);
          }
        });
        node.replaceChild(frag, child);
      } else if (child.nodeType === 1) {
        // skip footnote and figure markers — leave them as inline superscripts
        if (child.classList && (child.classList.contains('footnote-marker') || child.classList.contains('figure-marker'))) return;
        this.wrapWords(child);
      }
    });
  }

  getDelay(word) {
    let base = 230;
    let bonus = Math.max(0, word.length - 4) * 28;
    let punct = 0;
    if (/[,;:]$/.test(word)) punct = 130;
    if (/[.!?]$/.test(word)) punct = 380;
    if (/[—–-]$/.test(word)) punct = 180;
    return (base + bonus + punct) / this.speed;
  }

  updateActive() {
    this.wordEls.forEach((el, i) => {
      el.classList.toggle('current', i === this.wordIndex);
      el.classList.toggle('read', i < this.wordIndex);
    });
    const cur = this.wordEls[this.wordIndex];
    if (cur && passageEl) {
      const rect = cur.getBoundingClientRect();
      const containerRect = passageEl.getBoundingClientRect();
      if (rect.bottom > containerRect.bottom - 40 || rect.top < containerRect.top + 40) {
        cur.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }
  }

  updateMeta() {
    if (!this.wordEls.length) return;
    const total = this.wordEls.length;
    const cur = this.wordIndex + 1;
    const wcEl = document.getElementById('wordCount');
    const rpEl = document.getElementById('readingProgress');
    const sdEl = document.getElementById('speedDisplay');
    if (wcEl) wcEl.textContent = `${cur} / ${total}`;
    if (rpEl) rpEl.textContent = `${Math.round((cur / total) * 100)}%`;
    if (sdEl) sdEl.textContent = this.speed.toFixed(1) + '×';
  }

  jumpTo(idx) {
    this.wordIndex = Math.max(0, Math.min(idx, this.wordEls.length - 1));
    this.timeUntilNext = 0;
    this.updateActive();
    this.updateMeta();
  }

  step(deltaMs) {
    if (this.paused || !this.wordEls.length) return;
    if (this.wordIndex >= this.wordEls.length - 1) return;
    this.timeUntilNext -= deltaMs;
    if (this.timeUntilNext <= 0) {
      this.wordIndex++;
      const el = this.wordEls[this.wordIndex];
      this.timeUntilNext = el ? this.getDelay(el.textContent) : 250;
      this.updateActive();
      this.updateMeta();
    }
  }

  setPaused(value) {
    this.paused = value;
    const btn = document.getElementById('readingPlay');
    if (btn) btn.innerHTML = value ? '▶' : '❚❚';
  }

  setSpeed(mult) {
    const newSpeed = Math.max(0.3, Math.min(3.0, mult));
    if (newSpeed === this.speed) return;
    this.speed = newSpeed;
    this.timeUntilNext = 0;
    this.updateMeta();
  }
}

// ============================================================

// ============================================================
// Builds a flat sequence of clickable TOC items (skipping headers and
// unwired entries with id=null), then updates the prev/next buttons
// at the bottom of each passage to point at the surrounding entries.

const passageNavPrevBtn = document.getElementById('passageNavPrev');
const passageNavNextBtn = document.getElementById('passageNavNext');
const passageNavPrevLabel = document.getElementById('passageNavPrevLabel');
const passageNavNextLabel = document.getElementById('passageNavNextLabel');

function getClickableTocItems() {
  // Returns the flat list of TOC items that are wired (have an id) — these
  // are the passages a visitor can navigate between via prev/next.
  return toc.filter(t => (t.type === 'item' || t.type === 'subitem') && t.id);
}

function updatePassageNav(currentId) {
  const items = getClickableTocItems();
  const idx = items.findIndex(t => t.id === currentId);

  // Previous
  if (idx > 0) {
    const prev = items[idx - 1];
    passageNavPrevLabel.textContent = prev.title;
    passageNavPrevBtn.disabled = false;
    passageNavPrevBtn.onclick = () => openPassage(prev.id);
  } else {
    passageNavPrevLabel.textContent = '';
    passageNavPrevBtn.disabled = true;
    passageNavPrevBtn.onclick = null;
  }

  // Next
  if (idx >= 0 && idx < items.length - 1) {
    const next = items[idx + 1];
    passageNavNextLabel.textContent = next.title;
    passageNavNextBtn.disabled = false;
    passageNavNextBtn.classList.remove('is-back-to-toc');
    passageNavNextBtn.onclick = () => openPassage(next.id);
  } else {
    // Last passage: replace with "back to TOC"
    passageNavNextLabel.textContent = 'Table of Contents';
    passageNavNextBtn.disabled = false;
    passageNavNextBtn.classList.add('is-back-to-toc');
    passageNavNextBtn.onclick = backToTOC;
  }
}

// ============================================================
//   R E A D I N G   M O D E   T O G G L E
// ============================================================
// Three modes: "lit" (whole passage glows in saffron, no progression),
// "cream" (cream-dim baseline, gentle hover lift, no progression),
// "read-along" (sequential word-by-word with play/speed controls and saffron highlight).
// Mode is persisted to localStorage and shared between Reading and Voices views.

const MODE_KEY = 'fugitive-ephemera:reading-mode';
let currentMode = 'lit';
try {
  const saved = localStorage.getItem(MODE_KEY);
  if (saved === 'lit' || saved === 'cream' || saved === 'read-along') {
    currentMode = saved;
  }
} catch (e) { /* localStorage unavailable */ }

const modeToggle = document.getElementById('modeToggle');
const archiveModeToggle = document.getElementById('archiveModeToggle');
const readingControlsRight = document.getElementById('readingControlsRight');

function applyModeToElement(el, mode) {
  if (!el) return;
  el.classList.remove('lit-mode', 'cream-mode');
  if (mode === 'lit') el.classList.add('lit-mode');
  else if (mode === 'cream') el.classList.add('cream-mode');
  // read-along: no class added (default progression styling)
}

function syncToggleButtons(toggleEl, mode) {
  if (!toggleEl) return;
  toggleEl.querySelectorAll('button').forEach(btn => {
    const isActive = btn.dataset.mode === mode;
    btn.classList.toggle('active', isActive);
    btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
  });
}

function setMode(mode) {
  currentMode = mode;
  try { localStorage.setItem(MODE_KEY, mode); } catch (e) {}
  
  // Apply to passage element (Reading view)
  applyModeToElement(passageEl, mode);
  // Apply to archive entry passage element (Voices view)
  if (archiveEntryPassageEl) applyModeToElement(archiveEntryPassageEl, mode);
  
  // Update toggle UI in both views
  syncToggleButtons(modeToggle, mode);
  syncToggleButtons(archiveModeToggle, mode);
  
  // Show/hide reading-along controls (play/speed) based on mode
  if (readingControlsRight) {
    if (mode === 'read-along') {
      readingControlsRight.classList.remove('lit-mode');
    } else {
      readingControlsRight.classList.add('lit-mode');
      // Pause the reader when not in read-along mode
      if (typeof reader !== 'undefined' && reader && !reader.paused) reader.setPaused(true);
    }
  }
  
  // Show/hide archive entry play/speed controls based on mode
  if (archiveModeToggle) {
    const archiveControls = archiveModeToggle.parentElement;
    if (archiveControls) {
      const playBtn = archiveControls.querySelector('#archivePlay');
      const speedDown = archiveControls.querySelector('#archiveSpeedDown');
      const speedUp = archiveControls.querySelector('#archiveSpeedUp');
      const speedLabel = archiveControls.querySelector('#archiveSpeedLabel');
      const showProgressionUI = (mode === 'read-along');
      [playBtn, speedDown, speedUp, speedLabel].forEach(el => {
        if (el) el.style.display = showProgressionUI ? '' : 'none';
      });
    }
  }
}

// Wire up toggle buttons
function wireToggle(toggleEl) {
  if (!toggleEl) return;
  toggleEl.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => setMode(btn.dataset.mode));
  });
}
wireToggle(modeToggle);
wireToggle(archiveModeToggle);

// ============================================================
//   F I G U R E S   ( inline marker → popover )
// ============================================================
// Markers in body text like [F.1], [F.2], [d5] resolve to the matching
// Ephemera entry (F.N) or Discography entry (dN), using the same
// image/title/meta/body fields, and render in a popover.
const figPopover = document.getElementById('figurePopover');
const figNum = document.getElementById('figNum');
const figImageWrap = document.getElementById('figImageWrap');
const figTitle = document.getElementById('figTitle');
const figSubtitle = document.getElementById('figSubtitle');
const figBody = document.getElementById('figBody');
const figSrc = document.getElementById('figSrc');

function findFigureSource(figId) {
  // Special mapping: F.3 reuses the Infinity (1972) discography image
  // for in-text continuity with F.1, F.2, F.4, F.5, F.6, F.7, F.8
  if (figId === 'F.3' && typeof discography !== 'undefined') {
    const inf = discography.find(a => a.id.startsWith('05 '));
    if (inf) return inf;
  }
  // Try ephemera first (F.1, F.2, etc.)
  if (typeof ephemera !== 'undefined') {
    const e = ephemera.find(a => a.id === figId);
    if (e) return e;
  }
  // Then discography by exact id (e.g., "05 · 1972")
  if (typeof discography !== 'undefined') {
    const d = discography.find(a => a.id === figId);
    if (d) return d;
    // Also accept "d5", "d10" etc. → match by track number prefix
    const m = figId.match(/^d(\d+)$/i);
    if (m) {
      const num = m[1].padStart(2, '0');
      const byNum = discography.find(a => a.id.startsWith(num + ' '));
      if (byNum) return byNum;
    }
  }
  return null;
}

function showFigure(figId) {
  const data = findFigureSource(figId);
  if (!data) return;
  reader.setPaused(true);
  figNum.textContent = figId;
  // Image: try all supported extensions (jpg, jpeg, png, webp, gif, avif, JPG, PNG)
  if (data.img) {
    figImageWrap.innerHTML = '<div class="fig-loading">…</div>';
    tryLoadImage(data.img,
      (url) => {
        figImageWrap.innerHTML =
          `<img src="${url}" alt="${(data.title||'figure').replace(/"/g,'&quot;')}">`;
      },
      () => {
        figImageWrap.innerHTML = '<div class="fig-loading">image not available</div>';
        console.warn(`Figure popover image not found: ${data.img} (figId ${figId})`);
      }
    );
  } else {
    figImageWrap.innerHTML = '';
  }
  figTitle.innerHTML = data.title || '';
  figSubtitle.textContent = data.meta || '';
  figBody.innerHTML = data.body || '';
  figSrc.textContent = data.src || '';
  figPopover.classList.add('show');
  fnBackdrop.classList.add('show'); // reuse footnote backdrop
}

function hideFigure() {
  figPopover.classList.remove('show');
  fnBackdrop.classList.remove('show');
}

document.getElementById('figClose').addEventListener('click', hideFigure);
// Backdrop click handler — but we need to update the existing footnote backdrop handler
// to also dismiss figures. The fnBackdrop click already fires hideFootnote; let's also
// wire it to call hideFigure when figure popover is open.
fnBackdrop.addEventListener('click', hideFigure);

const playerEl = document.getElementById('player');
const playerLabel = document.getElementById('playerLabel');
const playerTitle = document.getElementById('playerTitle');
const playerMini = document.getElementById('playerMini');
const playerToast = document.getElementById('playerToast');
const bandcampEmbedWrap = document.getElementById('bandcampEmbedWrap');
const playerPrev = document.getElementById('playerPrev');
const playerNext = document.getElementById('playerNext');

let currentTrackIndex = 0;

function showToast(msg, duration = 3200) {
  playerToast.textContent = msg;
  playerToast.classList.add('show');
  clearTimeout(playerToast._t);
  playerToast._t = setTimeout(() => playerToast.classList.remove('show'), duration);
}

function expandPlayer() { playerEl.classList.remove('collapsed'); }
function collapsePlayer() { playerEl.classList.add('collapsed'); }

// Title setter — wraps in inner span and toggles marquee animation if overflow
function setPlayerTitle(text) {
  playerTitle.innerHTML = `<span class="player-title-inner">${text}</span>`;
  requestAnimationFrame(() => {
    const inner = playerTitle.querySelector('.player-title-inner');
    if (!inner) return;
    if (inner.scrollWidth > playerTitle.clientWidth + 4) {
      playerTitle.classList.add('scrolling');
    } else {
      playerTitle.classList.remove('scrolling');
    }
  });
}

function loadTrack(index) {
  if (index < 0 || index >= playlist.length) return;
  currentTrackIndex = index;
  const track = playlist[index];

  // Update label + title
  playerLabel.textContent = `track ${index + 1} / ${playlist.length}`;
  setPlayerTitle(`${track.title} — ${track.artist}`);

  // Build the Bandcamp embed iframe
  // Build the Bandcamp embed iframe — handles both album+track embeds and track-only embeds
  const albumPart = track.albumId ? `album=${track.albumId}/` : '';
  const src = `https://bandcamp.com/EmbeddedPlayer/${albumPart}size=small/bgcol=181122/linkcol=e89244/track=${track.trackId}/transparent=true/`;
  bandcampEmbedWrap.innerHTML = `<iframe style="border: 0; width: 100%; height: 42px;" src="${src}" seamless title="${track.title} by ${track.artist}"><a href="${track.url}">${track.title} by ${track.artist}</a></iframe>`;

  // Update prev/next button states (disable if at edges)
  playerPrev.disabled = (index === 0);
  playerNext.disabled = (index === playlist.length - 1);
}

// Shuffle the playlist after the first track on each page load.
// Alice's "Journey to Satchidananda" always opens; the rest reshuffle.
(function shuffleAfterFirst() {
  if (playlist.length <= 2) return;
  const head = playlist[0];
  const rest = playlist.slice(1);
  // Fisher–Yates shuffle
  for (let i = rest.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [rest[i], rest[j]] = [rest[j], rest[i]];
  }
  playlist.length = 0;
  playlist.push(head, ...rest);
})();

// Initial load
if (playlist.length > 0) {
  loadTrack(0);
} else {
  setPlayerTitle('— no tracks loaded —');
  playerPrev.disabled = true;
  playerNext.disabled = true;
}

// Wire up controls
playerPrev.addEventListener('click', () => {
  if (currentTrackIndex > 0) {
    loadTrack(currentTrackIndex - 1);
    expandPlayer();
  }
});
playerNext.addEventListener('click', () => {
  if (currentTrackIndex < playlist.length - 1) {
    loadTrack(currentTrackIndex + 1);
    expandPlayer();
  }
});

document.getElementById('playerCollapse').addEventListener('click', collapsePlayer);
playerMini.addEventListener('click', expandPlayer);

// auto-link URLs in reference text
function linkifyReference(text) {
  // Classify links three ways:
  //   "youtube"  → ▶  (videos: YouTube URLs OR any citation tagged [Video])
  //   "image"    → ↗  (Instagram image posts — visual content, not text, not video)
  //   "read"     → 📖 (everything else: articles, books, dissertations, news)
  const isVideoCitation = /\[Video\]/i.test(text);
  return text.replace(/(https?:\/\/[^\s<]+)/g, (url) => {
    let trailing = '';
    while (/[.,;:)\]]$/.test(url)) {
      trailing = url.slice(-1) + trailing;
      url = url.slice(0, -1);
    }
    const isYT = /youtube\.com|youtu\.be/i.test(url);
    const isIG = /instagram\.com/i.test(url);
    let cls;
    if (isYT || isVideoCitation) cls = 'youtube';
    else if (isIG) cls = 'image';
    else cls = 'read';
    return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="${cls}">${url}</a>${trailing}`;
  });
}

function renderReferences() {
  const list = document.getElementById('referencesList');
  list.innerHTML = '';
  references.forEach(ref => {
    const div = document.createElement('div');
    div.className = 'reference-entry';
    div.innerHTML = linkifyReference(ref);
    list.appendChild(div);
  });
}

      `"I would like to read a poem by a very recent ancestor and an inspiration to those of us on this stage. Her name is Assata Shakur. If you do not know who she is, we encourage you to find out who she is. This is a poem that begins her autobiography. It is called “Affirmation”:


 ‘I believe in living. I believe in the spectrum of beta days and gamma people.


 I believe in sunshine, in windmills and waterfalls, tricycles and rocking chairs, and I

 believe that seeds grow into sprouts and sprouts grow into trees.


 I believe in the magic of the hands and in the wisdom of the eyes.


 I believe in rain and tears and in the blood of infinity.


 I believe in life, and I have seen the death parade march through the torso of the earth,

 sculpting mud bodies in its path.


 I have seen the destruction of the daylight and seen bloodthirsty maggots prayed to and

 saluted.


 I have seen the kind become the blind and the blind become the bind, in one easy lesson.


 I have walked on cut glass.


 I have eaten crow and blunderbread and breathed the stench of indifference.


 I have been locked by the lawless, handcuffed by the haters, gagged by the greedy.


 And if I know anything at all, it's that a wall is just a wall and nothing more at all. It can

 be broken down.’ (from Assata: An Autobiography)`,
      `Hack into dietary sustenance—tradition vs. health | Hack into comfort—compliance | Hack into the rebellious gene | Hack into doctrine—capitalism in relation to free labor and slavery | Hack into the history of the bank—is beating the odds a mere act of joining the winning team? | Hack in the desperation and loneliness—the history of community and the marketplace | Hack into land rights and ownership | Hack into business law—proprietorship | Hack into ambition and greed | Hack into forms of government—systems of control—the relation to suffering and sufferance | Hack into faith and morality—the treatment of one faith towards another | Hack into masculinity; femininity; sexuality | What is taught? What is felt? What is learned? What is shared? | Hack into God: stories of creation—serpents and eggs | Hack into nature: biodynamics, biodiversity, cycles, and seasons | Hack into time; calendars— Descartes—its relationship to doubt. Is it wired to fear? The notion of control—the space-time continuum; the force of gravity—whether the opposite of gravity is freedom | Hack into freedom; power; responsibility; justice—the bill of rights | Hack into coincidence | The summer of '68; the 27 club—the number of people with Facebook profiles—people who choose to share; people who share too much; people who seem lonely; people who want to connect; people want to uplift | Hack itoa self-help; self-sufficiency; and self-indulgence. Hack into crazy | Hack into lunatic | Hack into star | Hack into infamous; notorious—the effects of the construct of poverty on the psyche; the effects of the construct of race—the victims that survived. There is a panel marked survival… three simple copper wires coiled round an orb | Hack into orbit—equatorial landmines—useful and precious metals | Coltan as cotton | Hack into hazardous—nuclear—blu-clear—cloud forms and fish farms; cow farts and pigshit | Hack into horse—industrial; digital | Hack into code | Use your instrument as metaphor | Harness       `We are here to make links, to draw parallels, to make distinctions, observations. What we have observed is that… perhaps there is no time like the present. It's the British poet John Keats who said that poets are midwives of reality. Yet in this moment we have the sense that perhaps—perhaps we are more like, death doulas. Death doulas for the end of empire. What we are certain of is that it is more than our governments that are complicit in genocide. What we acknowledge is that it is perhaps our cultures themselves that hold the root of that complicity. That unsaid sense of superiority that is taught and handed down. Even as we gather in this moment and we think of the mothers and children and brothers and fathers who have lost their lives in Sudan—in this moment—we think of the children. What is true of this moment, and perhaps it is a truth that you share with me, is that I have never seen so many dead children. Count fingers. Count toes. Count blessings. The murders they took no count of is how I learned to count.`,
      `It is not only the contemporary actions that we speak of. We know what has happened in places like: Surinam; Indonesia. I think of the Congo. I think of the uncharted and unrecognized genocides in places like Namibia. The Nama, the Herero, the Lenni Lenape—the indigenous of those illegitimate states, Abya Yala. We acknowledge that everything that has been said about the Zionist entity is true of those illegitimate states that they call America. Which is to say that it has no right to exist on the blood and bones of our ancestors. But we acknowledge—we acknowledge—the wealth and opulence of Europe. We acknowledge that that opulence and wealth, the millions that were made off of slave ships that were sold by this country, for example. I don't know what they teach you in your schools. Nothing. Sounds like they teach you exactly what they taught me in mine. Yet we say—We say, land back and abolition. We say indigenous sovereignty and liberation. We understand abolition as the rebellious and creative re-imagining of our schools—of our communities. We realize that there is an opportunity because there is a connection that has been forged through that which we have all borne witness to: in Palestine; in Yemen; in Iran. The intentional destabilization of the Congo, The intentional destabilization of Haiti. The people in the streets in Madagascar right now—the people in the streets in Tanzania right now—the US Navy ships parked outside of Venezuela right now. All of these have one thing in common. Black death and indigenous erasure extraction. They say fossil fuels. We say ‘whose fossils?’ They would have us imagine that those fossils have developed over time through the death of dinosaurs and mammoths. But what of the people? What of the people? Those over 10 million killed in the Congo for the rubber in the tires of our cars. Our daily comforts. Oh, ‘I can't start my day without coffee.’ Where does the coffee come from? ‘I like a little sugar in mine.’ Where does the sugar come from? ‘Oh, I love chocolate.’ Where does the chocolate come from? ‘Oh, I drive an electric vehicle’. Where does the lithium in the battery come from? It comes from the continued practice of Western civilization. They call it technology. They call it human progress. The irony is that if it were truly digital and technological advancement, why is it so deeply rooted in analog forms of exploitation?`,
      `Glory to the resistance! Glory to all anti-colonial resistance! Glory to all anti-capitalist resistance! We say "racial capitalism" simply to remind you that all capitalism is racial. It is not simply a matter of the exploitation of workers. It is a matter of Black death and Indigenous erasure. And we call on the spirit of the martyrs. We ask them to inhabit us and to inhabit this space. We recognize the drum—the drum—as the earliest form of wireless communication. This is why in those illegitimate states they banned African drums. They banned them. Why? Because they realized that we were using them to communicate, and they feared rebellion.`,
      `How many lives? How many more lives will it take? The poet Audre Lorde says that hope is counterrevolutionary. Pressure cooks. So, how do we apply pressure? Clearly, the most obvious way of bringing a machine to a halt would be by withholding our labor globally. As I mentioned, we are here under the guise of music to convene a meeting. Perhaps we are here to remind ourselves of the role of music. For it is music that travels without passports. That crosses borders and boundaries that are sometime restricted to us, to our siblings and relatives.`,
      `You know, I could recite the grass on a hill and memorize the moon. I know the cloud forms of love by heart and have brought tears to the eye of the storm. My memory banks—vaults of autumn forest and Amazon riverbanks. And I've screamed them into sunsets that echo in earthquakes. Shadows have been my spotlight as I monologue the night and dialogue with days. Soliloquies of wind and breeze applauded by sunrays. We put language in zoos to observe caged thought and tossed peanuts and pea funk at intellect.`,
      `And niggas think these are metaphors. I speak what I see. All words and worlds are metaphors of me. My life is authored by the moon. Footprints written in soil. The fountain pen of Martian men noveling human toil. And yes, the soil speaks highly of me. When earth seeds, root me, poet tree and we forest forever through recitation. Now maybe I'm too serious—too little here; too matter. Though I'm riddled with the reason of the sun, a standup comet with the audience of lungs. This body of laughter—is it with me, or at me? Hu-[mor]e, or less human, though genders mute. And the punchline has this lifeline at its root. I'm a star. This life's the suburbs. I commute. Make daily runs between the sun and earthly loot and raise my children to the height of light and truth. If I could find the spot where truth echoes, I would stand and whisper memories of my children's future. I would let their future dwell in my past so that I might live a brighter now. Now is the essence of my domain and it contains all that was and will be. And I am as I was and will be because I am and always will be | that nigga. I am that nigga. I am that timeless nigga that swings on pendulums like vines through minds of booby- trapped minds that are enslaved by time. I am the life that supersedes lifetimes. I am. It was me with serpentine hair and a timeless stare that with a mortal glare turned mortal fear into stone time capsules. They still exist as the walking dead as I do. The original sufferhead symbol of life and matriarchy severed-head medusa. I am. It was me, the Ecclesiastical One that pointed out that there was nothing new under the sun. And through times of laughter and times of tears, so that no times are real times all times of fear. The wise seer Solomon—I am. It was me, with tattered clothes that made you scatter as you shuffled past me on the street. Yes, you shuffled past me on the street as I stood there conversing with windblown spirits. And I fear it's your loss. You didn't stop to talk to me. I could have told you your future. I explain your present. But instead, I'm the homeless schizophrenic resented for being aimless. The untuned nameless. I am. I am, that nigga. I am that nigga. I am a negro. Yes, negro. Negro from necro, meaning death. I overcame it, so they name me after it. And they be spitting at us behind and putting kick me signs on his back because I am not the son of Sha-Clack-Clack. I am before that. I am before. I am before before. Before death is eternity. After death is eternity. There is no death. There's only eternity. And I be riding on the wings of eternity like— Heeyah!!! Heeyah!!! Heeyah!!! Heeyah!!! Heeyah!!! Heeyah!!!`,

    caption: `Satchidananda was Alice Coltrane's guru. Carlos Santana, whose performance of "Soul Sacrifice" at the same festival prompted the researcher's journey into this lineage, received the name Devadip from guru Sri Chinmoy in 1972 and maintained a concurrent spiritual and musical mentorship with Coltrane, producing <em>Illuminations</em> together in 1974. Retrieved from https://swamisatchidananda.org/life/woodstock-guru/swami-satchidanandas-woodstock-address/`,
