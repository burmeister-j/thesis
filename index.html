      `The thesis, refracted through the assemblage this chapter and the methodology have together described: Alice Coltrane Turiyasangitananda's musicoanagogical practice cultivates a sensorium for which the transcendent and the immanent become available simultaneously—neither register reducible to the other, neither subordinated to it—and the chapters that follow engage distinct articulations of that practice across the assemblage's distinct media. <em>Akasha</em> as field, <em>tertiary retention</em> as actualization, the trace as non-self-identity that exceeds any cut, the break as cutting and abundant refusal of closure, vibration cohering into form under sensorial reading, sounding- as-writing across visual and <em>acoustic space</em>, the impossibility of repetition as the only repetition, monolingualism of the other as ground rather than lack, diffusion past sovereignty, <em>communal individualism</em> against <em>pseudo-individuation</em>, <em>reasonance</em> against the Enlightenment's purification of reason from the body's acoustic participation in the world—these are not separate frameworks the practice draws upon. They are articulations, from distinct and specific traditions, of the single operation the practice performs: the <em>holding-open of the break</em> against the <em>psychocarceral enframement</em> that would close it. The chapters that follow do not test this thesis against the practice. They engage, through close listening and ethnographic field-orientation, distinct articulations of the assemblage already operating it.`,
      `A bridge chapter, three case studies, and a concluding chapter complete the work.`,
      `<strong>Chapter One</strong> engages <em>Monument Eternal</em> (Coltrane-Turiyasangitananda, 1977) as one articulation of the assemblage in the medium of Coltrane's own prose—rendering explicit, in her vocabulary, the cosmology the recordings articulate in their own medium. <em>Akasha</em>, <em>presencing consciousness</em>, atomic ontology, <em>tapas</em> as initiatory suffering, decreative preparation, grace as lived relation— he cosmological vocabulary the chapter assembles from her writing and from the thesis's reading of it—receive the chapter as its own argument. The chapter is also where Infinity (1972), Coltrane's posthumous production work on John's recordings—long dismissed by the jazz reception apparatus as widow-handling-property—is engaged as the assemblage operating at the register of musicological compositional practice, authorized by the cosmological framework <em>Monument Eternal</em> articulates in its own register. The chapter bridges the theoretical apparatus the literature review has assembled and the close-listening case studies that follow.`,
      `<strong>Case Study One</strong> engages "Turiya and Ramakrishna" (1970) as the recording in which the figure- ground architecture of the practice becomes audible in its most stripped-down configuration. The two cosmic traditions named in the title—Turiya (the fourth state of consciousness in Vedantic non-dualism) and Ramakrishna (the nineteenth-century Bengali mystic whose practice held myriad devotional registers in simultaneous attunement)—are held in a single sustained frequency that the trio's sparse architecture renders structurally legible. The chapter performs the close listening Moten's phonography and Khan's <em>Nada Brahma</em> jointly authorize.`,
      `<strong>Case Study Two</strong> engages "Journey to Satchidananda" in its 1980s ashram <em>bhajan</em> version (released by Luaka Bop in 2017) as the site where the practice operates through collective devotional attention sustained across an ensemble. The chapter engages the recording as <em>tertiary retention</em> drawn from the akashic field of a specific room, specific bodies, specific moment in the ashram's devotional life—and traces how that <em>tertiary retention</em> continues to operate as living transmission for receivers who were never in the room. The Vedantic Center as ensemble, <em>communal individualism</em> in operation, is the chapter's central concern.`,
      `<strong>Case Study Three</strong> engages "Translinear Light" (2004) as the late-period synthesis where the acoustic-space architecture of the practice becomes audible across an entire recording. The chapter engages McLuhan's <em>acoustic space</em>, Bourdon's <em>telepresence</em>, Doraiswamy's <em>portare foglio</em> and <em>tiṇṇai</em>, and Adorno-via-Okiji's psychocarceral diagnosis as the framework through which the practice is heard in its full cosmotechnical reach.`,
      `Each case study closes with an ethnographic vignette drawn from the researcher's sustained field- orientation in the contemporary New York avant-garde music scene (2023–2026)—bringing visibility to the kinship networks that continue Coltrane's transmission in present-tense form.`,
      `The final chapter—<strong>[In]Con-Clusion</strong>—returns to those kinship networks and their ongoing operation in rooms the thesis has inhabited throughout the research period. The chapter is not a conclusion in the conventional sense; it is the discovery, after the fact, that the scene the field- orientation has been documenting recognized the researcher before the researcher recognized themselves in it. The thesis's central terms—<em>presencing consciousness</em>, <em>holding-open the break</em>, <em>psychocarceral enframement</em>, <em>mosaic-lensed deframement</em>—are not concluded there; they are found to have been operating as the thesis's own composition all along.`,
      `What follows is not a sequential demonstration but a sustained mosaic. Each chapter opens by recapping the previous and re-binding itself to the thesis the literature review has restated, but its coherence depends finally on the quality of attention the reader brings to the spaces between the chapters—and on the discipline of holding the seeming-contradictions those spaces contain rather than resolving them away.`,

      `<em>Monument Eternal</em> opens with a dedication rather than a thesis. It offers no argument. It makes no methodological claim. It is an act of devotion, and the direction of determination this case study follows is established in the opening gesture: Alice Coltrane Turiyasangitananda's philosophical vocabulary was generated from within a practice of revelation, austerity, and direct encounter with what she names Absolute Consciousness—not derived from the traditions the previous chapter engaged. The theoretical constellation assembled there is accountable to that practice, and this case study receives <em>Monument Eternal</em> as primary philosophical text: an account of revelation written, as its author describes, under divine command (Coltrane- Turiyasangitananda, 1977, Preface). Its five chapters—Spiritual Re-awakening, Austerity, Spiritual Perception, Realization, and The Lord's Grace—move through a cosmological ontology, an account of initiatory suffering, a phenomenology of perception beyond the material senses, an articulation of non-dual consciousness, and an index of grace as lived relation. What follows draws from its core passages to establish the generative vocabulary of this thesis before the musicological case studies deploy it.`,
      `Coltrane opens <em>Monument Eternal</em> at the atomic level. She describes the atom as a miniature universe containing within itself the same characteristics as a solar system—a play on magnetism and harmony. Within each particle of atomic energy, she locates an irreducible order of Absolute Consciousness. This is not metaphor. She articulates a physics: "The feminine electrons hold a powerful sway over the masculine protons inside the atom … even the smallest atoms in existence can never be destroyed—when bombarded, or cut by force, they only transform themselves" (Coltrane-Turiyasangitananda, 1977, pp. 9–10). From this atomic foundation she moves to the fires of <em>tapas</em>—the voluntary austerities through which the practitioner is purified for contact with the Supreme. She describes <em>tapas</em> as simultaneously the gentlest call and the most devastating ordeal: fasts, sleepless vigils, the body reduced from 128 to 105 pounds and later to 95, metals entering the flesh, the heart stopped several times a day (pp. 15–19). She frames the process through the figure of the alchemist: by fire, the Supreme transmutes the base metal of the human heart into gold (p. 13). The atomic ontology and the <em>tapas</em> are one operation viewed at two registers—the cosmos that cannot be destroyed but only transformed and the practitioner whose transformation is itself the demonstration.`,
      `What emerges on the other side of <em>tapas</em> is an [un]condition(ing) rather than a concept. Coltrane names it <em>Absolute, Manifested Formlessness</em>—a pure consciousness in which one functions within and beyond the smallest atom, defying detection, moving alongside others without their knowledge, attuning to the expressions of their art (pp. 20, 37–38). This is the most radical form of engagement with the world, not a withdrawal from it. A soul in this condition, she writes, “can function in at least four places at once” (p. 38). The boundary between self and field has become nearly imperceptible, yet the practitioner retains the capacity to sense, to serve, and to compose. This is the condition the thesis has named <em>presencing consciousness</em>: the carrying of traces of the experience of the Absolute back through trans-material modes of being—sound, pedagogy, written transmission, communal recordings.`,
      `Coltrane provides the archival technology for this presencing in her account of <em>Akasha</em>—the universal memory that records every thought, word, and deed. She attributes this teaching to John Coltrane <em>Ohnedaruth</em>[^15] who shared it with her shortly before his departure from the earthly plane (p. 31). <em>Akasha</em>, she writes, is positioned a few feet from a person—or, when two or more are gathered, in the center of the room. It "photographs and records each vibration, movement, and articulation of an individual" (p. 32). In this framework, the sonic trace is carried forward beyond the moment of its sounding: every performance, every transmission, every act of devotional listening inscribed in a cosmic register that exceeds individual memory. The cosmological-vibrational register <em>Akasha</em> names had been articulated jointly by John and Eric Dolphy five years before John's ascenscion, in the 1962 <em>DownBeat</em> interview through which both musicians answered Tynan's and Feather's "anti-jazz" charges: "music is a reflection of everything," Dolphy said; "it's a reflection of the universe… like having life in miniature," John affirmed (Coltrane & Dolphy, 1962). <em>Akasha</em>, as Alice receives and extends the teaching, names the archival cosmology this shared vibrational register inscribes—the register from which the recorded oeuvre continues to operate as living transmission, the register the lit review's Stiegler section theorized as <em>tertiary retention</em>: the technical actualization of a field Coltrane had already named on its own cosmological terms.`,
      `<em>Monument Eternal</em> closes on grace as lived relation. "Because of this closeness," she writes of the Supreme, "I do not know what loneliness is, nor do I know what it feels like to be lonely, for I am never alone" (p. 47). Grace is the condition Coltrane is with, not an event that happens to her. The scalar ontology, the <em>tapas</em>, the <em>Absolute, Manifested Formlessness</em>, and <em>Akasha</em> are not sequential stages the practitioner moves through and leaves behind. They are the simultaneously- held architecture of a single practice—the held contradiction the literature review has named, here enacted as the daily condition of one human being.`,

      `That the jazz reception apparatus was unable to hear this architecture is a matter of historical record. In 1972, five years after John's death, Alice Coltrane released <em>Infinity</em>—an album combining her own original compositions with sessions from her recently deceased husband, reworked and re-produced under her direction. Kodwo Eshun, describing the cover art, names the aperture her critics could not enter: "To look at the front sleeve is to fall through fractalized stained glass into nested formations of spirals within spirals, kaleidoscopic iterations as blue as mother sky" (Eshun, 1998, p. 165). The spirals within spirals disclose the fractal recursion of Coltrane's atomic ontology, where the Absolute inhabits every particle of experiential reality. But the reception apparatus could not receive the cover as her cosmological proposition. Her decision to release <em>Infinity</em> was read by critics as disrespectful and demeaning to John's memory, rather than as the shared boundary-dissolving practice that John himself had deployed throughout his career. What the jazz press could hear was a widow handling property; what it could not hear was a Black woman as co-author of a shared cosmic project, operating the compositional practice <em>Monument Eternal</em> had just finished articulating as ontology.`,
      `Moten's (2003) critical remixing of nonconvergent tracks names the operation with precision. Alice's work on <em>Infinity</em>[F.3] was not a departure from John's recordings; it was the Black radical compositional procedure by which two nonconvergent tracks—John's saxophone sessions, Alice's orchestral and compositional additions—are remixed such that each is transformed by the other without being absorbed. This is the break operating at the register of musicological compositional practice, authorized by the cosmological framework <em>Monument Eternal</em> had just articulated. That Eshun, writing in 1998, was among the first to receive the cover on its own terms is a measure of how long the reception apparatus took to catch up to what Coltrane had done. What the thesis now receives through the lit review's theoretical apparatus—Moten's remix, Khan's <em>Nada Brahma</em>, Stiegler's <em>tertiary retention</em>, Glissant's <em>creolization</em>, brown's diffusion—is the vocabulary that was not yet available to the 1972 jazz press, through which Infinity can now be heard as what it always-already was.`,

      `On April 4, 2026, i arrived at a loft in Ridgewood, Queens, for Carlos Niño & Friends—the evening's ensemble featuring Marshall Allen, Darius Jones, and Austin Williamson. Allen, at 101, carries the Sun Ra Arkestra lineage in his body; as the introduction has noted, it was Sun Ra who put Hazrat Inayat Khan's <em>The Mysticism of Sound and Music</em> in John Coltrane's bag, so to speak. What Alice drew from Khan's cosmology into the vocabulary of <em>Monument Eternal</em> had traveled, by that route, through Sun Ra before it reached her. Allen—the Arkestra’s current bandleader—in the room was the lineage immanent.`,
      `Before the music began, Niño recognized me and crossed the room to shake my hand. He noted i'd been at the <em>Total Response</em> event upstate. When i confirmed, he asked how i knew Nep, the artist-curator—assuming i must, since i'd been at an informal dinner afterward for friends, artists, and musicians. i explained the chain: i'd met Deep at the Deeper event at the Queens Museum in October 2025, and she'd introduced me to Nep and the wider withoutSHAPEwithoutFORM network the next evening. He asked how i'd heard about Deeper. i told him i'd been at his André 3000 show in March 2024, where in an extended stage story Dré told the audience to check out what his brothers (bandmates) were up to, and that it was pretty cool and amazing stuff. The recommendation had stayed with me. Niño smiled widely. "Oh!" he said. "The story... and now, you're here." He shook my hand again, more excitedly this time, and said, "I'll be seeing you again." Then we parted.`,
      `What Coltrane Turiyasangitananda (1977) names <em>Akasha</em>—the universal memory that records every thought, word, and deed, positioned a few feet from a person or, when two or more are gathered, in the center of the room (pp. 31–32)—is not a metaphor the thesis reaches for. It is the operation the encounter at the Ridgewood space performed in real time. A stage-aside released into a room in Atlanta in March 2024 had continued to operate across two years, training the receiver's attention, routing them through so many interactions, carrying them finally into a loft where the one who had released the transmission recognized its return in the body it had reached. “Now, you're here”. The Akashic field recognized itself. What the Vedantic cosmology articulates, what Stiegler names as <em>tertiary retention</em>, and what Moten theorizes as the break's anticipatory rewriting—these are three vocabularies for what Niño's greeting named in three words. <em>Monument Eternal</em>'s cosmology is lived-in-relation. The case studies that follow listen from the spaces between those relations.`,

      `…does not begin. It is thrown into being—keys arriving as <em>portamento</em>, sliding into pitch rather than striking it, a piano chord suspended in the middle distance with the declarative weight of an orator mid-sentence, already in motion, as though the listener has been admitted mid- transmission into a frequency that was never not sounding. This is not incidental. Recorded in January 1970 in the basement studio of the Coltrane home in Dix Hills, Long Island (Kernodle, 2010, pp. 88–91), the track marks Alice Coltrane’s definitive emergence as a sovereign composer and practicing <em>Swamini</em>—a teacher whose instrument operates as <em>ontic rapport</em>. To name the piece is already to inhabit its argument: <em>Turiya</em>[^16] is also her name: the name received in realization rather than replacement of identity. What this chapter listens for is the figure-ground architecture of the practice as it becomes audible in a trio's stripped-down configuration—the assemblage operating at the register of so many cosmic traditions held in sustained frequencies, none absorbed into an-other.`,
      `Ramakrishna: the 19th-century Bengali mystic whose entire practice was the embodied demonstration that every tradition—Vaishnavism, Tantra, Islam, Christianity—opens, when fully inhabited, into the same clearing (Gupta, 1974, p. 74). The title is a thesis: two cosmic traditions, one transmission. In the notes to <em>Ptah the El Daoud</em>,[^17] Alice wrote that her focus was, “…to express and bring out the feeling of purification.” She continued, “Sometimes on earth, we don’t have to wait for death to go through a sort of purging, a purification. That march you hear is the march on to purgatory, rather than a series of changes a person might go through” (as cited in Kernodle, 2010, pp. 91–92). Ramakrishna’s entire practice was the body of that purification— not described but undergone, tradition by tradition, until the purging was indistinguishable from the arrival.`,
      `Ramakrishna Paramahamsa was an experimenter—a practitioner who moved sequentially and with total commitment through the initiatory technologies of multiple traditions, entering each fully enough to be transformed from within. His Advaita Vedanta practice dissolved the boundary between worshipper and worshipped. His Tantric <em>sadhana</em> relocated the sacred from transcendence into the body’s own energetic architecture (Gupta, 1974, p. 721). His practice of Islam and Christianity—undertaken with the same unironic rigor—disclosed the same arrival: a non-dual awareness that no single tradition could claim as its exclusive property because every tradition, when pursued to its root, disclosed the same ground. His perennialism bore no resemblance to the comparative textual extraction that dominant readings of the perennialist canon have mistaken for the thing itself. It was enacted, somatic, and verified in the body of a specific human being who had undergone radical social dispossession—dismissed as mad, as excessive, as illegible to the rational order (Isherwood, 1965, p. 86)—and who emerged through his illegibility into a transmission that outlived every socio-institutional attempt to contain it.`,
      `Alice Coltrane knew this structure from the inside-out. Following John’s death in 1967, the critical and institutional apparatus of jazz moved swiftly to enclose her—repositioning her as custodian of his legacy, her own sovereign practice folded into the administrative role of grieving widow (Gallope, 2024, p. 177). The enclosure was not incidental. It was an operation of what Weheliye (2014), reading Wynter, identifies as the <em>genre of Man</em>—the classificatory apparatus that cannot accommodate a Black woman as an originating source of cosmological architecture and so reclassifies her as a relational appendage to male genius (p. 12). The same conversation in which Ramakrishna teaches about the hole in the wall opens with a parable about valuation: a rich man sends a servant to price a diamond at the market. The egg-plant seller offers nine seers of vegetables. The cloth merchant offers nine hundred rupees. The jeweller offers one hundred thousand. The same stone. Each buyer prices it to the exact limit of their own capital—not from malice, not from error, but from the irreducible constraint of what they already know how to see (Gupta, 1974, p. 738). The jazz press was the cloth merchant. It offered the highest valuation available within its existing categories—widow, caretaker, keeper of the flame—and believed itself generous. What passed through the enclosure was not a response to it. From within the imposed structure of grief and institutional dismissal, she built an ashram, assumed a new name, and composed a body of work whose cosmological architecture—built not merely of commercial sound but in community, pedagogy, and lived transmission—exceeded the jazz world’s taxonomic capacity to receive it: not resistance to dispossession but what Weheliye names as “lines of flight, freedom dreams, practices of liberation” that dispossession can constrain but never annihilate (2014, p. 2). Illegibility became the aperture through which transmission passed—a frequency, as the title declares, that was never not sounding. What only the jeweller can see is not a higher market value but a different order of seeing altogether: the hole in the wall, the thin ego of the <em>Isvarakoti</em>, the one who remains on this side of the wall and yet is always in communion with the endless meadow on the other (Gupta, 1974, p. 738). Coltrane was such a one. The wall is hardly there if you are sounding in the meadow.`,
    ],

      "16": `The Sanskrit fourth state of pure witnessing awareness that underlies and interpenetrates waking, dreaming, and deep sleep.`,
      "17": `Ptah is named for the Egyptian creator god whose mouth-opening ceremony, in the Book of the Dead, initiates the departed into the capacity for speech and sustenance in the afterlife. That Coltrane placed “<em>Turiya</em> and Ramakrishna” on an album named for an Egyptian initiatory rite enacts the perennialist architecture at the level of sequencing: Hindu, Egyptian, and the practitioner’s own realized name held in the same container without hierarchy.`,

      `Inside the composition, the ear meets it first as texture: a chord dense and terrestrial, already weighted with the blues’ long memory. What strikes the body before the mind has named it is the <em>acciaccatura</em>:[^18] the crushed note—a micro-collision of adjacent pitches that Coltrane deploys as the kinetic signature of the piece. In Coltrane’s hands it becomes something more primary: the liturgical moan of the Baptist tradition translated into piano touch, the body’s knowledge arriving before cognition has organized it into meaning. Erlmann (2010) traces the historical severance by which Enlightenment ocularcentrism separated the knowing subject from the resonant world— the moment Western epistemology decided that reliable knowledge was visual, distanced, and disembodied (pp. 10–11). The <em>acciaccatura</em> undoes that severance in the duration of a careful swipe. It cannot be heard from a distance. It must be felt. Alice herself named the priority: “It’s more a feeling than a melody” (Feather, 1970). The ensemble confirms this at every register. Riley’s brushed snare drag operates as pseudo-drone pulsation—not marking time but sustaining a duration, a textural bed that holds the composition’s forward motion in hovering suspension while the ghostly bass drum taps keep the assembled pace sensible. Sanders’ bell accents, sparse at the opening, carry the rhythmic quality of passers-by in a brightly-lit processional, building gradually from peripheral shimmer to front-facing claim on the listener’s attention. Carter’s bass is the dynamically expressive counterweight—his counter-harmonic precision holding a ceaseless conversation with Coltrane’s left hand—a conversation whose mutual responsiveness constitutes what Monson (1996) identifies as the generative core of the groove: a field of collective attention in which each player’s listening is as constitutive as their playing (pp. 68– 69). This is a trio at its center—no horns, no saxophone melody to organize the ear around a single narrative. The architecture is omnidirectional, and the listener is immersed.`,
      `One hears in Coltrane’s playing the blues of her Detroit childhood—the gospel-steeped, church- formed musicianship that Baraka (1967) identified as the <em>changing same</em>: the blues impulse that persists through every formal transformation as the spiritual substrate no amount of evolution can dissolve (p. 180). But it is infused here with an abstracted devotional confidence that transmutes the scalar push-pull characteristic of the style. Her note choices carry the soulful lines through oscillating dualistic cohesion—finding uplifting almost-resolutions, then rolling back into the historically familiar uncertainty of the path less-traveled, whether out of choice or necessity. This is not a modal substitution that conventional analysis could name and shelve. It is a blues practice with a persistent brightness—a gravitational pull toward the raised sixth that opens a tonal aperture in the blues’ established emotional architecture, the precise pitch at which what Baraka calls the <em>changing same</em> moves through into its next spiritual iteration (pp. 210– 211). The piano swings its double-to-triple-timed tangential phrases, ringing with the ironic traces of sheer attention to form. Alice told Leonard Feather that near the end she modulates from D-flat up to D and back before going out, and that there is “a suggestion of ‘Parker’s Mood,’ the part to which the words went ‘Come with me….’ It’s like God asking us if we want to go home—that kind of feeling” (Feather, 1970). The subtle brightness the ear has been living with throughout—the raised sixth pulling against the minor’s gravity—finds its macro-structural confirmation in a whole key-center shift: a half step of light admitted into the architecture, then gently withdrawn. A bebop quotation heard as liturgical invitation. The <em>changing same</em>, enacted in a single modulation.`,
      `The harmonic language Coltrane builds over this foundation refuses the austerity of post-bop quartal voicings that had become the dominant currency of avant-garde piano in 1970.[^19] Instead she reaches for density—chords stacked in open fourths over Carter’s pedal points, their internal voices layered so thickly that the sound ceases to behave as harmony in the conventional sense and begins to operate as environment: a thickness of presence the listener does not analyze but inhabits. This thickness is an aural re-presentation of Simondonian <em>metastability</em>—the maintenance of a dynamic equilibrium between competing tonal forces that never resolves into stasis, always holding open the tension between the pre-individual field and the individuated form it temporarily assumes (Simondon, 1992, pp. 300, 302). The chord does not land and rest. It sustains and vibrates. Between Detroit and <em>Turiya</em>—between the blues labor from which Coltrane’s musical formation emerged and the cosmic consciousness toward which her practice is oriented—these voicings hold the threshold space where neither pole is abandoned, and both are held in productive, generative tension.`,
      `At roughly the two-minute mark, a brief approach to transition: the swing and shuffle imperceptibly become a generative increase, and then at 2:08, production itself intervenes—the bells that have been generously enlivening the texture cut abruptly, unnaturally, marking the collective return to the march all the more potent for their sudden absence. Around the midpoint, the cymbals and bells return as Carter’s bass line begins a methodical whole-and-half-note ascent, bedding Coltrane’s trebled <em>glissandi</em>—runs that mirror her iconic harp style, the piano reaching toward the instrument she has not touched on this track. The ensemble climbs. It is reminiscent of the earlier intensifications, though more enrapturing—a Lynchian threshold[^20] in which the listener has been watching a film and has only now realized the film is their life, that they are entering a dream sequence, or the inverse: that they have been dreaming and are now passing through the threshold into the waking world. The ensemble makes its approach to the comfort of resolution, nearly touching it this time, and then the piano runs smear and blur skillfully back into the strained melodic core the composition has been living with from the start. What Ramakrishna calls the hole in the wall, Heidegger the clearing, Moten (2003) the break, and Simone Weil’s <em>metaxu</em>[^21]—four traditions arriving, by entirely distinct routes—semingly—at an analogous structural aperture—becomes audible not as a single harmonic choice but as the architecture of the entire arc: the threshold approached, nearly crossed, and held open (Gupta, 1974, p. 738).`,
    ],
    footnotes: {
      "18": `The <em>acciaccatura</em> is technically an ornamental dissonance—a grace note struck simultaneously with its resolution and immediately released (Sadie, 2001). Its deployment here exceeds its formal function, operating instead as haptic trigger and somatic address.`,
      "19": `Quartal voicings are chords built on stacked fourths rather than the thirds that organize conventional Western harmony. Where tertian harmony produces resolution—the chord wants to go somewhere—quartal voicings suspend that desire, generating an open, hovering quality that resists arrival. In this context, Coltrane’s quartal stacking over Carter’s pedal points produces a vertical density that is neither consonant nor dissonant in the conventional sense but holds both possibilities in a sustained field of tonal ambiguity. The effect is architectural rather than melodic: the listener is placed inside a structure rather than carried along a line.`,
      "20": `“<em>Turiya</em> and Ramakrishna” was recorded in January 1970; Twin Peaks premiered in 1990. David Lynch’s lifelong Transcendental Meditation practice—formalized through the David Lynch Foundation for Consciousness-Based Education and World Peace—and his immersion in Vedantic thought place him downstream of the same contemplative traditions Coltrane was already transmitting through sound. The temporal-perceptual quality his work shares with hers—the dissolved boundary between dreaming and waking, the sensation of discovering mid- experience that one has crossed a threshold without noticing—is not a stylistic coincidence but a convergence rooted in shared practice. What the author instinctively calls “Lynchian” is, in this lineage, Coltrane’s—that of the Absolute.`,
      "21": `Weil names <em>metaxu</em>—the Greek between (from Symposium 202e) that Weil develops as the figure for what simultaneously separates and connects: "every separation is a link" (Weil, 1947/2002, p. 132). To hold open the break is to enact <em>metaxu</em>.`,

      `What the aperture demands of the one who would enter it is not extraordinary effort but its opposite: a particular quality of prepared receptivity that the music trains into existence over the course of its own duration. This is what Medina (2013) calls <em>kaleidoscopic consciousness</em>—not the acquisition of new information but the cultivation of a perceptual apparatus capable of holding multiple perspectival positions simultaneously, each new relation transforming retroactively all previously established relations, nothing collapsing into synthesis, everything remaining in productive tension (p. 299). The music at this moment is not offering the listener an experience to be consumed. It is [en]training a faculty. Coltrane’s playing sinks back after the midpoint climb, maintaining the polemic aesthetic but assuming an implicate space in the mix, re-presenting the tangential movements as dynamic chord changes that provide a foundation for the double-bass to take its place at the pulpit. Carter’s pitch inflections and microtonal bends decorate the walking-dance—the brightness i have been hearing throughout the composition now carried in a different voice, the same tonal position held from a new angle. This is the kaleidoscopic turn: the raised sixth that could not be domesticated into the familiar minor, that insisted on its own peculiar register, that asked the ear to remain in contact with irreducible difference without moving to resolve it—now sounding in the bass rather than the piano, the same aperture viewed through a different face of the kaleidoscope. To stay with that brightness across its migrations is already to practice the epistemology Medina names (pp. 306–307).`,
      `But this is not a solitary cognitive achievement. The faculty does not develop in isolation; it is called into being through encounter—specifically through the kind of encounter hooks (1994) theorizes as <em>engaged pedagogy</em>, in which the transmission requires <em>mutual vulnerability</em>: the teacher cannot remain sheltered from the risk she asks of the student (p. 21). The ceaseless conversation between Carter’s bass and Coltrane’s left hand has been modeling this structure from the opening bars—two voices exposed to one another, each altered by the other’s phrasing, neither leading from a position of safety. Coltrane does not demonstrate mastery from a position of completion. She models being-in-transmission—composing, performing, and teaching from within the same exposure she asks of her students, her listeners, her community. The <em>Swamini</em>’s authority is not the authority of the one who has arrived; it is the authority of the one who remains in motion and is willing to be changed by the encounter. Transmission does not move from the full to the empty, from teacher to student in a one-directional transfer. It moves through the space between two exposed subjectivities, each of whom is altered by contact.`,
      `The attention this demands from the listener—and from the student of this music—is not concentration but its opposite. Weil (1952) distinguishes with precision between will and attention: the will tightens, grasps, pursues; attention opens, waits, receives. “Absolutely unmixed attention is prayer” (p. 117). And in her Detachment section: “To detach our desire from all good things and to wait. Experience proves that this waiting is satisfied. It is then we touch the absolute good” (p. 13). The listener who tries to apprehend the transmission analytically—who approaches the music with an agenda, however sophisticated—has already missed it. The almost-resolutions i described—the soulful lines finding their uplifting arrival and then rolling back into uncertainty—are the sonic enactment of this posture: desire carried toward its object, nearly touching it, then released. Not failed resolution but practiced non-grasping. What is required is the faculty Weil names: desire emptied of its object, attention liberated from will, a waiting that is not passive but maximally alert and deliberately un-instrumentalized.`,
      `This attentional posture finds its name in the Christian mystical tradition through a concept Eckhart calls <em>Abgeschiedenheit</em>—detachment, releasement—which Critchley (2024) reads as the highest virtue of the mystical life: a “fluid openness, a cleared looseness, a limpid intensity, where both the concepts of mind and world or the soul and God dissolve into something altogether stranger and yet simpler.” Eckhart’s <em>gelâzenheit</em>—living without a why, being present to what shows itself rather than pursuing it—is the structural condition for the kind of reception the music requires, and it is picked up by Heidegger as <em>Gelassenheit</em>, letting-be, the posture in which the <em>Lichtung</em> (clearing) can open (Critchley, 2024, p. 107). The crucial and often missed dimension is that <em>Abgeschiedenheit</em> is not withdrawal. The self does not disappear; it becomes, in Eckhart’s formulation, “virgin”—free of attachments, images, and works, maximally receptive. The aperture does not open to the one who strains toward it. It opens to the one who has learned to stop straining. In the composition’s final movement, the bass’s leading presence washes into a third and final full-ensemble wall of sound—invoking the prayer call section of a Baptist church service, the most definitively consistent uplifting piano notation in the entire piece carrying it toward its end. The cacophonic percussion gently beckons surrender to the apparent and surrounding flux. Then all active playing ceases, and the final notes ring out. The distinction of separation evaporates. All voicings collapse into one last delicate gasp of sonic presence. The aperture has opened—not to the one who strained toward it, but to the listener who, over the course of the composition’s duration, has been trained to stop reaching.`,
      `The guru enacts this in the moment of teaching. Surya Botofasina was raised at the Sai Anantam Ashram—the son of Radha Reyes-Botofasina, who lived under Alice’s guidance for nearly thirty years and who testified that the <em>Swamini</em> taught “skills: how to live in this world and the world beyond this world” (Berkman, 2010, p. 101). Surya, a pianist formed inside the transmission, described the community’s practice in terms that echo Ramakrishna’s perennialism at the register of the domestic: “The devotional songs we sing, <em>bhajans</em>, are mostly in Sanskrit; however, we celebrate Christmas, we love Jesus, we love anything that has to do with God, period” (Berkman, 2010, p. 107). The clearing we traced through Ramakrishna’s sequential inhabitation of traditions was, at Sai Anantam, the ordinary texture of a childhood. It is this Surya—direct disciple, living carrier of the transmission, and pianist whose harmonic formation occurred under the <em>Swamini</em>’s hands—who describes the pedagogy at its culminating moment: “I could literally feel her at that moment pushing me, leaning over saying, ‘A-flat…E-flat…D-flat,’ and then at the end saying, ‘Just play.’ Because it really speaks to the guru guiding you to the point where you have to meet your own spiritual self” (Christovale, 2025, p. 147). The progression is exact: specific guidance—precise tonal instruction, the transmission of harmonic knowledge—followed by its withdrawal. The “just play” is not an abandonment. It is the most demanding instruction of the encounter: enter the aperture under your own faculty. The <em>Swamini</em> has guided to the threshold. <em>Abgeschiedenheit</em>—living without a why—begins on the other side. What Medina calls <em>kaleidoscopic consciousness</em>, hooks names <em>mutual vulnerability</em>, Weil identifies as attention-as-waiting, and Eckhart theorizes as releasement: Turiyasangitananda enacted in a single phrase. Not syncretically—not through textual comparison or philosophical extraction— but somatically, pedagogically, in the transmission of a specific harmonic sequence to a specific student in a specific room. The withdrawal was the teaching. What followed it was not silence but <em>praxical actance</em>.[^22]`,
      `This is why the title’s logic is finally apophatic. <em>Turiya</em> cannot name what it points toward—the fourth state is defined entirely by what it is not: not waking, not dreaming, not deep sleep, but the witnessing ground beneath, around, and within all three. Critchley (2024), reading Eckhart’s via negativa, notes that the approach to the divine “can only be found through the way of negation— a language that ceaselessly undoes itself” (pp. 52–53). The title enacts exactly this: it names by refusing to contain and points by declining to arrive. So too the music. The chapter has traced what the piece does—how it trains a faculty, transmits through mutual exposure, demands attention-as-waiting, and opens to the one who stops straining—but it cannot finally say what it transmits. The frequency was never not sounding. That is the outermost limit of the claim, and it is already one word too many.`,

    footnotes: {
      "22": `<em>Actance</em>: from Latour (1987, 1991), the capacity of any entity within a network to make a difference, to act— independent of intention or named agency. <em>Praxical actance</em> names theoretically-grounded acting that propagates through a community of practice without being reducible to any single practitioner's intention.`,

      `In October 2025, Surya Botofasina and Carlos Niño performed at the Queens Museum as part of <em>Deeper</em>[F.4]—an event organized by withoutShapewithoutForm under the frame of Deep Listening. Alongside them, practitioners of <em>Simran</em>—the centuries-old Sikh practice of sacred repetition through which the practitioner dissolves habitual selfhood into presence—held their own continuous stream. Both were presented not as religious observance but as irreligious technologies of the self: concrete practices for the cultivation of psycho-spiritual health amid the flood of attention-mining digital platforms and the mass-mediated spectacle-driven emotional destabilization they produce. The room held jazz musicians, meditators, scholars, and variously intrigued souls. No single tradition organized the space; each remained fully itself while the space between them became generative. Afterward, i approached Deep Kailey—co-founder of withoutShapewithoutForm and a close collaborator of Botofasina and Niño—to thank her. What followed was brief but precise: a conversation about <em>Simran</em>’s relationship to Coltrane’s legacy and about whether Weil’s <em>decreation</em> named the same movement from a different shore. She gave me her card. The 1970 recording, with no definitive start, has yet to end. It was still sounding, reconfiguring the white cube’s logic in Queens—and the network through which it propagated is an invitation to openness.`,

      `<em>Sat-Chit-Ananda</em>: being, consciousness, bliss. The title of the devotional is itself an ontological circuit—the three aspects of <em>Brahman</em> held in simultaneous relation, each implying the others, none reducible to a sequence. The journey the title names is not spatial. It is the movement through which the practitioner’s awareness—fractured by the monoculture’s insistence on discrete, measurable selfhood—re-enters the vibratory field from which it was never actually separated. On <em>World Music Vol. 1: The Ecstatic Music of Alice Coltrane Turiyasangitananda</em> (Luaka Bop, 2017), the version of “Journey in Satchidananda” that concerns this chapter is not the 1970 Impulse! recording with Pharoah Sanders, Cecil McBee, and Rashied Ali. It is the ashram version—recorded with Coltrane’s students and disciples at the Sai Anantam Ashram in the Santa Monica Mountains, distributed on private-press cassette, and heard outside that community for the first time only when the Luaka Bop[^23] compilation made it available to the public nearly two decades after Coltrane’s death. The community body is the instrument. What the recording carries is the trace of a <em>collective individuation</em> that had already occurred before any listener pressed play. This chapter listens for is the assemblage operating at collective scale—the <em>bhajan</em> as the site where the practice individuates a community, the recording as <em>tertiary retention</em> of a specific room continuing to act on receivers who were never in it.`,
      `The ashram recording demands a theory of the individual adequate to what it documents. Gilbert Simondon (2020) provides it. For Simondon, the individual is never a finished state. It is a phase in an ongoing process of individuation—a process that always carries with it a charge of pre- individual reality, a reservoir of potentiality that exceeds any given configuration and remains available for further transformation. The individual does not precede the process that forms it; the process is ontologically prior. This means that when Alice Coltrane’s disciples enter the <em>bhajan</em>[^24]—when Radha Botofasina-Reyes[^25] describes “going all over the universe” with her, sessions that could last two or three hours until “you couldn’t sing anymore; all you could do is just say” (brown, 2021, p. 60)—what occurs is not the expression of pre-existing selves through music. It is <em>collective individuation</em>: the simultaneous formation of individual and group through a shared encounter with a pre-individual field that neither the guru nor the disciple contains alone. The ashram was not a retreat from the <em>genre of Man</em>. It was, in Weheliye’s (2014) terms, the generation of a different genre of the human—enfleshment otherwise, enacted not as theory but as daily devotional practice (p. 2).`,
      `What individuates in the <em>bhajan</em> is not only the collective body. It is the temporal structure of experience itself. The master’s clock—the colonial imposition of linear, extractive time that Phillips (2025) traces from the plantation bell to the smartphone screen—cannot accommodate what happens in these sessions. brown (2021) describes them as “melting times, where language ceased and the metaphysics of sound began” (p. 60). The melting is temporal: the sequential organization of past, present, and future that the master’s clock enforces dissolves into what Phillips calls superposition—“overlapping, coexisting dimensions that challenge and resist collapsing into the oppressive, linear timelines” (p. 12). This temporal operation is not a reactive gesture against colonial time. Phillips insists it is “a manifestation of ancestral African space- times” that predate colonial disruption—an ontological priority, not a counterstrategy. The Sufi mystic Hazrat Inayat Khan[^26] (1996) names the cosmological ground of this priority: <em>Nada Brahma</em>, Sound-God—the understanding, shared across Vedantic and Sufi traditions, that sound is the fundamental generative force of the universe, and that the state of <em>anahad nada</em>, the unstruck sound, is what the practitioner hears when attuned to the vibratory field from which all manifestation descends (p. 10). Githere (2022) names the condition that emerges when the clock stops and the unstruck sound becomes audible: <em>Afropresentism</em>— “the space between the dream and the memory collapses into being your reality—now.” That is the temporal logic of the ashram devotional. The journey to <em>Sat-Chit-Ananda</em> is the journey out of the master’s clock and into the vibratory simultaneity that was never not vibrating.`,
    ],
    footnotes: {
      "23": `Luaka Bop is the record label founded by David Byrne in 1988 as a vehicle for Brazilian and Afro-diasporic music the major label apparatus had no infrastructure to receive. Byrne and Talking Heads were embedded in the Downtown New York avant-garde of the late 1970s—a milieu saturated by the same questioning of Western logocentrism Derrida was articulating in writing. <em>Stop Making Sense</em> (1984) enacted in performance what <em>Of Grammatology</em> argued in text: that the live, the reproduced, and the composed are mutually constitutive. Byrne never cites post-structuralist thought—and shares with Derrida a resistance to the postmodernist label others have applied to both: "I never understood why postmodernism had to define itself in the negative. To not say what it aspires to be, but rather what it is not" (Byrne, in Rawsthorn, 2011). The adjacency operated below explicit attribution—which is to say, it moved the way transmission does throughout this work.`,
      "24": `<em>Bhajan</em> is a Sanskrit word meaning “soul chant” (Botofasina-Reyes, in brown, 2021, p. 60). Alice Coltrane describes the practice in her text Mantra: <em>bhajan</em> chanting worships God through song and music, removing agitations from the mind, uplifting the spirit, purifying the atmosphere, and elevating consciousness (cited in Berkman, 2010, p. 94). The form is common across Hindu devotional traditions, typically consisting of a lead vocalist singing verses with a congregation responding in refrain, building in intensity over extended duration. At Sai Anantam Ashram, Coltrane’s <em>bhajans</em> were sui generis—integrating Detroit gospel inflection, jazz harmony, Hindu mantra, and collective improvisation into a devotional genre with no precedent (Berkman, 2010, p. 94). What Baraka (1967) identified as the <em>changing same</em>—the blues impulse persisting through every formal transformation as spiritual substrate—finds in the ashram <em>bhajan</em> not its negation but its next iteration: the gospel-formed voice carrying the same charge into a Vedantic container that does not replace but extends the tradition’s reach (pp. 180, 210–211).`,
      "25": `Radha Botofasina-Reyes was introduced in the preceding chapter through Berkman’s account of her testimony: the <em>Swamini</em> taught “skills: how to live in this world and the world beyond this world” (Berkman, 2010, p. 101). Her son Surya’s account of Turiyasangitananda’s pedagogy (“Just play”) closed that chapter’s argument. The intergenerational dimension of the transmission—mother and son both formed as practitioners within the same devotional community—exemplifies communal individuation propagating across a duration.`,
      "26": `Hazrat Inayat Khan (1882–1927) was an Indian Sufi master of the Chishti order and an accomplished musician — a trained vocalist and vina player who gave concert tours of Indian classical music across the United States and Europe before founding the Sufi Order in London in 1914. His <em>Mysticism of Sound and Music</em> articulates a cosmology in which sound is the fundamental generative and unifying force of the universe—a philosophy inseparable from his practice as a performing musician.`,

      `The track opens in the dense orchestral sonic flux of the Oberheim OB8—an analog synthesizer produced in 1983; the year Coltrane relocated the Vedantic Center to Sai Anantam. She builds a cinematic melodic architecture over a guttural bass drone that establishes the harmonic ground the entire devotional will inhabit. Joshua Spiegelman’s flute enters in pulsating figures, drilling bright accents across the Oberheim’s guiding foundations. The texture is simultaneously orchestral—carrying Coltrane’s deep and explicit debt to Stravinsky, whose compositional solutions she credited as arriving directly from his disembodied self, through meditation (Pouncey, 2002, p. 44)—and devotional, fusing the harmonic affect of gospel worship with the modal suspension of Indian classical raga and a sense-feeling that can only be described as the invocation of atmospheric hallmarks reminiscent of science fiction film scores: the sound of a cosmos being presenced through technical means that no single tradition authorizes. A cosmotechnical assemblage: the Oberheim is a Western instrument, designed for pop and new wave production, re-oriented here by a cosmological practice that treats the synthesizer as a vehicle for devotional [in]activation rather than commercial expression. The technical object and the cosmic order individuate together.`,
      `Then the music pauses. A breath—one or two seconds of silence that functions as a threshold. When the Ashram Singers enter, the orchestral density of the introduction is stripped back and finessed into oceanic swells of congregational voice, with harmonic streams of treble chords flaring off the ends of certain phrases like spray off a wave’s crest. The spatial production is extraordinary: the singers seem to have been captured through multiple microphones at varying distances. The organ’s natural capabilities are manifested through Leslie speaker cabinets and/or tremolo modulation, whose low-frequency oscillation envelops the voicings in a slow, breathing rotation. The effect is not stereo positioning. It is spatial oscillation—the sound itself vibrating between locations, the recording technology producing in the listener’s body the same oscillatory condition the <em>bhajan</em> cultivates in the practitioner’s consciousness. Berkman (2010) notes that Coltrane processed her ashram recordings “evocatively with studio effects and overdubbing” (p. 95); what this production achieves is the sonic expression of what the thesis calls the static- oscillatory subject—a field of collective attention vibrating between states, never arriving, never departing.`,
      `The congregation sings in English: Samsara / Journey to Satchidanandaji / Journey with Satchidanandaji. The first word names the condition the devotional addresses—the cycle of suffering, the psychocarceral loop in Vedantic cosmology. The lyric moves through <em>tapas</em> (“He guides us on the samsaric sea / Through life’s tests and trials / To the soul’s victory”) and arrives at a chiasmus that folds the journey back into itself: “Our journey's end is our journey home / Our journey home is our journey’s end.” End and origin occupy the same location approached from opposing directions, dissolving into a structure where the destination was always-already the ground the practitioner stood on before the first note sounded. This is the <em>changing same</em> at the level of lyric: the blues impulse that Baraka (1967) traced through every formal transformation of Black music—from spirituals through R&B through the New Thing—arriving here in a congregational Sanskrit-English devotional, the spiritual substrate persisting through a container no one in Baraka’s lineage could have predicted but which his argument made structurally inevitable (pp. 180, 210–211).`,
      `Then Sairam Iyer’s voice enters—Tamil-born, Bollywood-trained, singing in a language most of the ashram congregation does not share. His delivery is powerfully front-facing, close-mic’d, and present, cutting against the open, airy spatial field the Sai Anantam Singers inhabit. The contrast is immediate and somatic: where the choir’s English verses suspended the listener in a collective bath of devotional sound, Iyer’s Tamil solo addresses the listener directly and urgently from a different cosmotechnical register entirely. The translation reveals what the English lyric’s cosmic vocabulary does not carry alone: In the ocean of family life / the journey is very difficult. The domestic, the suffering, the material weight of embodied existence—this is where the journey begins, in the difficulty of the household, the same condition Alice described as the labor she had to complete before the path opened (Berkman, 2010, p. 95). Alice solos beneath Iyer in Carnatic scalar passages—South Indian classical ornamentation threading under a Tamil devotional text, both carried by a Black American swamini’s keyboard technique rooted in Detroit gospel and bebop.`,
      `The transfer from choral English to Tamil solo and fluidly back to the choir enacts the perennialist creolization as musical form. The song builds toward its close with choir, Iyer, and the Oberheim’s synthesized lines converging into a texture where each remains uniquely audible while fully integrated into a singular devotional intensity—<em>transindividuation</em> made sonically present, the community body operating as one instrument without any individual voice being absorbed. Then everything stops. In unison. A silent breath of release marks the convergence— and the track ends not in resolution or fade but in collective cessation, the sound withdrawing into the silence it emerged from, the break held open for one breath before the next track begins.`,

      `What the Luaka Bop compilation made available in 2017 was not the <em>bhajan</em> itself. It was its <em>tertiary retention</em>—the technical inscription through which a <em>collective individuation</em> that occurred in a specific room, among specific bodies, at a specific moment in the ashram’s devotional life, becomes available to bodies that were never in that room. Stiegler (1998) extends Simondon’s account of individuation by identifying the role of technical memory—the recorded object, the score, the cassette—in carrying the pre-individual charge forward across the ruptures of death, distance, and institutional enclosure. Lindberg (2024) demonstrates that this extension emerged from a fundamentally musical problematic: for Stiegler, the melody is the prototype of a purely temporal object whose structure coincides with the temporal flow of consciousness itself (p. 183). When a melody is recorded, the <em>tertiary retention</em> does not merely preserve the sound. It carries the retentional structure—the expectations, the protentions, the secondary retentions of an entire musical culture—into a future it cannot predict. The ashram cassettes were <em>tertiary retentions</em> oriented toward care: distributed within a devotional community, received by practitioners whose secondary retentions (their training, their faith, their daily practice of the <em>bhajans</em>) prepared them to activate the pre-individual charge the recording carried. When those same cassettes circulate beyond the ashram—first as collector’s items, then as a Luaka Bop compilation—the question the thesis must hold open is whether the <em>tertiary retention</em> can still transmit what it carried, or whether the receiver’s secondary retentions have been so thoroughly formatted by the master’s clock that the pre-individual charge arrives as commodity rather than transmission. Alice herself addressed this directly: “Audiences do become part of the music in their own way… they’re breathing it with you” (Pouncey, 2002, p. 44). The breathing is the condition. The receiver who breathes with the recording—whose attention operates in the mode Weil named as prayer—activates <em>transindividuation</em>. The receiver who consumes it activates nothing but a loop. The question is not purely theoretical. It was answered, uniquely, in the backspace of a street-level loft on West 37th Street, aglow in red light.`,
    ]

      `In November 2025, i arrived at the People’s Forum in Manhattan,[^27] to see Fred Moten perform with his collaborator, the double-bassist Brandon Lopez[^28][F.5]. Moten’s scholarly work—the break, the undercommons, the object-voice that bypasses the linguistic enclosure of the <em>genre of Man</em>— moves in direct conversation with this thesis’ concerns, and his collaborative practice with Lopez exists within the same musical subcultures i have been orienting with and immersing in throughout the fieldwork. Moten and Lopez made last-minute adjustments: Lopez clipped his phone to a holster on the microphone stand. Moten greeted the audience from wherever he was— his voice arriving through the phone’s speaker, projected through the PA into the room—and shared writing he had been working on that day. Lopez, positioned beside the phone as he would have been beside Moten’s body, aggressively hummed while he thrummed, thumped, and bowed his bass, producing the hyperfracturing sonic interventions that characterize their collaborative practice. After five to ten minutes of prose, Moten wished the audience well and extended his encouragement for Lopez to [re]awaken the room. The trans-spatial, multi-medium movement of thought felt apropos—the undercommons operating as literal transmission infrastructure, the <em>tertiary retention</em> (the phone) carrying the pre-individual charge of Moten’s thinking into a room his body could not enter, Lopez’s bass activating the sonic field that made the transmission receivable. What Moten read that evening cut to the center of what this chapter has been tracing: a meditation on “brutal and murderous individuation in which each and every one will be killed”—the colonial operation that forces the pre-individual into a fixed, extractable singularity—and on the refusal of that operation: “…the people are improperly social and determinate.”[^29] This is Simondon’s individuation read through the break: the pre-individual field that colonial modernity cannot tolerate because it exceeds every attempt to enclose it in a single, accountable, terminable being. Moten’s voice, arriving through a phone clipped to a mic stand in a basement on West 37th Street, was itself the demonstration—the transmission rerouted through unexpected infrastructure, the community body assembled not by physical co-presence but by the quality of attention brought to the space between the speaker and the sounded.`,
      `After the performance, i spoke with a few of the Forum’s employees and bought a physical copy of Freire’s <em>Pedagogy of the Oppressed</em> from their expansive liberation bookstore—a <em>tertiary retention</em> acquired in the same space where another had just been activated. As i headed outside, i ran into a classmate from a previous semester’s course on artistic activism. She was now a student of Moten’s in NYU Tisch’s Performance Studies program. She knew Lopez through acquaintance, and the three of us shared a brief conversation over cigarettes. Lopez explained that Moten’s <em>consent not to be a single being</em> trilogy was never intended as a trilogy—that Moten had difficult feelings about the commercial imperatives the publishers had enacted in forcing the works into proximity. A body of work whose title names the refusal of enclosed singularity had itself been enclosed by the publishing apparatus into a marketable form—an <em>enframing gaze</em>, operating on the very text that diagnoses it.`,

    footnotes: {
      "27": `The People’s Forum is a movement incubator and cultural space in Midtown Manhattan dedicated to building political consciousness through education, art, and organizing. Their programming and library operate within a framework of anti-imperialist, anti-capitalist solidarity.`,
      "28": `Brandon Lopez is a double-bassist and improviser whose practice operates at the intersection of free improvisation, noise, and the spiritual jazz lineages associated with the Coltranes. As a member of Elder Ones, led by vocalist and composer Amirtha Kidambi, he contributed to <em>Holy Science</em> (Northern Spy, 2016). Kidambi has described Alice Coltrane as a primary influence: “Alice’s primary guru was the same one that my family followed, and she participated in the <em>bhajan</em> singing tradition. She looms large for me as a figure who blended so many different styles and traditions, uncompromising in her vision and authentic to herself” (Kidambi, in Elder Ones, 2016, liner notes). Lopez operates as a node in the network this thesis traces.`,
      "29": `Transcribed from a one-minute video recording i made during the performance, November 7, 2025. Moten was sharing unreleased writing-in-progress`,

    id: "chapter-four-part-i",
    title: "Chapter Four: Case Study 003 — “Translinear Light”",
    epigraph: `“I can act, I can be, I can live as I want to, and nothing can—there’s no claim—no one can buy me… I’m free.” — Coltrane, 1970; cited in Gallope, 2024, p. 177`,
    paragraphs: [
      `“Translinear Light” is a deposit and a return. From within that duration—twenty-six years of monastic practice, building the Vedantic Center, composing devotional music with and for her community, carrying the temple as practice rather than institution—Alice Coltrane Turiyasangitananda re-entered the commercial recording apparatus once, at the sustained encouragement of her son Ravi, and left a single <em>tertiary retention</em> in the public square before going back to the quiet work. She was explicit: “I told my children I’m so happy to do this, but I’m not starting a second career.” The album gathered itself across four years and five studios, from April 2000 to June 2004—not a session but an accumulation, the way a pilgrim gathers stones. The final track, “Satya Sai Isha,” was recorded at the Vedantic Center Mandir itself—the ashram folded into the album’s architecture, the temple literally present inside the commercial artifact. This chapter explores the transmission in its cosmotechnical reach—the late-period synthesis where acoustic-space architecture, <em>telepresence</em>, and the psychocarceral diagnosis the practice answers, all become audible across an entire recording. The album opens from the studio and holds its aperture in the sacred space.`,
      `For the third time in this thesis, the title is the first transmission. “Turiya and Ramakrishna” named two cosmic traditions held in a single frequency. “Journey to Satchidananda” named the ontological circuit—being, consciousness, bliss—as a movement the practitioner was always- already within. Here, Coltrane names the topology of the transmission itself: how the light permeates the field. On <em>The Tavis Smiley Show</em> (2004), she offered her own etymology: “look at what ‘trance’ means—it means to transcend, it means to become transcendental.” So, a singular transcendental path of light, that could lead to such great dimensions of consciousness, of revelation, of spirituality, of spiritual power. Translinear: light that does not travel along a line but across lines, through them—the topology of a transmission that refuses the sequential logic of visual space in favor of the simultaneous, non-local character of <em>acoustic space</em>. The album’s title names the aperture this thesis has been tracing since its first chapter.`,
      `That the existing reception has treated the record primarily as a late-career statement— momentous, seamless, refreshing—while leaving the title track virtually unanalyzed is itself symptomatic. So too is the recurring critical lament that Coltrane eschews the harp, the instrument most legible to the reception apparatus as her signature. What this thesis recognizes through “Translinear Light” is her piano—the instrument of lived Detroit formation, her originary compositional voice, the site where the transmission operates without the fetish object that the <em>static-circulatory listener</em> has learned to consume as “Alice Coltrane.” That the three artifacts examined across this thesis are all piano works was not planned. It was felt and sensed—and that hearing is itself a small enactment of the initiated listening this chapter will now discuss.`,

      `The title track begins mid-sentence—a strong, open-voiced chord suspended in the air as though the listener has been admitted to an act already in progress.[^30] The pacing in the opening bars is reverent and oratorical—a gathering of attention, not a demand for it. Within a few bars, Coltrane takes off in an oscillatory figuration that ascends to the high register and descends to the low, the full range of the piano traversed not as display but as mapping—the consciousness orienting itself in the space it is about to open.`,
      `At the low-end landing, Ravi enters on soprano saxophone. There is a distinct care in his articulation—an embodied vibrato that marks his breathing, passing notes blurred in ways that carry both parents’ blues-inflected languages simultaneously. Alice drops back in volume to accent. What emerges is not unison and not conventional harmony but something closer to what Bulut (2025) calls <em>non-dialogue</em>: a distributed mode of interaction in which two voices hear with one another without the dyadic guarantee of call and response—“moments through which one can hear with another and make a shift in being with one another” (p. 10). The soprano saxophone—John’s instrument in his final period—is now sounding through Ravi’s body on Alice’s composition. The generational transfer is not represented. It is happening, in real time, on the recording.`,
      `Around 2:35, Ravi drops out and Alice mulls over the phrase’s ending notes with increasing speed before kicking abruptly into an up-tempo, dissonant, yet rhythmically concise figure that prompts the entry of DeJohnette and Haden. Their arrival is so natural one might not actively notice it—the ensemble’s listening as constitutive as its playing (Monson, 1996, pp. 68–69), the boundary between cue and breath dissolved. DeJohnette grounds a steady pulse while deploying swung tom fills and cymbal work that excites without destabilizing the hypnotic center. Haden’s bass walk is steady and core-shaking. Together they provide a foundation for the entropic maelstrom Alice opens above them: virtuosic leaps between registers, <em>glissandi</em> that marked her work with Bud Powell’s group, with John’s quartet, and across her solo career. Though she is playing the piano, the languages of the harp are unmistakably present—the signature she refused to bring to this album carried in her hands regardless, because it was never in the instrument. It was in the condition of the player.`,
      `Toward the close of her solo section, DeJohnette’s cymbals join the triple-time runs she is melting out of an exquisitely dissonant melodic structure. The section finds an inverse resolve at 4:42 when she returns to the three-hit pulse that started it—the form folding back through itself. As her last chord rings out, Ravi’s soprano slices back in, exemplifying the modal expressiveness his father pioneered. The rhythm section carefully flips the groove; the drums become more technical yet softer, pairing anxiousness with reassuring consistency. Ravi increasingly smears his notes, achieving microtonal fluidity, verging on multiphonic voicings that re-exact that almost-resolved sense across artifacts. Around six minutes, Haden takes off for a few bars while Ravi holds a note into silence. The entire groove returns to the familiar pulse, though more plodding and stilted. DeJohnette introduces a tinny cymbal we have not heard—a metronomic center cutting through the whirling atmosphere—which switches to rounding tom rolls, then dynamic splash and crash accents. Around 7:40 the ensemble begins collectively winding down, each player responding to the others’ acknowledgment that the end is near—pulling off the landing as integral to the transmission as its exploratory center. Ravi’s soprano breathes out its last notes. DeJohnette’s final cymbal sounds almost reversed—a resonance folding back on itself. And Alice’s and Haden’s closing tones are resonantly multiphonic: the piano and bass sustaining frequencies that blur into one another until the sound is nearly indistinguishable from a <em>tanpura</em> or <em>shruti</em> box. The Western instruments, pushed to their resonant limits, arrive at the timbral register of the Indian devotional drone—not through quotation or imitation but through the material physics of vibrating strings allowed to ring until the distinction between piano and bass, between composed and improvised, self-penetrates. The translinear: light crossing lines. The <em>portable temple</em> audible in the last seconds of the track, carried in the overtones.`,
    ],

      `This is the point where the theoretical architecture of the chapter becomes audible. Acoustic space, in McLuhan’s formulation, is the register of simultaneous, non-linear, boundaryless relation—the field in which the ear, unlike the eye, receives from all directions at once without the hierarchizing geometry of perspective. Visual space isolates, sequences, encloses. Acoustic space envelops. What Coltrane builds over the hypnotic pulse of the title track is an acoustic architecture whose operations cannot be apprehended by the visual-spatial logic that governs most critical reception of recorded music. Erlmann (2010) traces how the Enlightenment produced its rational subject through the suppression of resonance[^31]—the conjunction of perceiver and perceived that reason, requiring separation and autonomy, could not tolerate: “While reason implies the disjunction of subject and object, resonance involves their conjunction” (p. 10). Drawing on Tomlinson (1993), Erlmann locates in Ficino’s Renaissance synthesis a theory of musical magic in which sound stems from a force “at once spiritual and material” (p. 32)[^32]—a genealogy modernity was designed to forget. Schwartz’s (2011) broader argument confirms the stakes: noise in the West has been transformed from an aural experience to a root metaphor for what must be excluded in order for meaning to be maintained. Every act of signal-making is simultaneously an act of noise-exclusion. What Coltrane activates on “Translinear Light” is precisely the register the Enlightenment sensorium was constructed to wall off.`,
      `The central claim of this chapter is that the digital-virtual is not ontologically separate from the spiritual or imaginal-virtual. They are the same register—the non-local field where myth, social formation, and hermeneutically constructed identity operate simultaneously. Hauntology, as Derrida theorized and Fisher extended, names one face of this claim: the virtual always carries the trace of what it supposedly displaced. But Fisher’s diagnosis remains bound to visual-space logic—it registers the trace as loss, the ghost as evidence of a future that never arrived. The correction is perceptual: the term is not haunting but <em>telepresence</em>. Bourdon (2021) demonstrates across a sweep from Ciceronian correspondence to digital immersion that presence at a distance is a constitutive human capacity, not a modern technological achievement. The intensity of the experience resides in the body of the receiver, not the bandwidth of the medium. The ashram recording is not a ghost of Alice Coltrane. It is a technology of <em>telepresence</em> whose operative power depends on the listener’s capacity to receive it as transmission rather than commodity.`,
      `If <em>acoustic space</em> is the register and <em>telepresence</em> its operative mode, what constitutes the field in which that <em>telepresence</em> is received? Anzieu (1985) proposed that the self is acoustically constituted before it is visually constituted—that the sonorous bath of intrauterine life produces a psychic envelope prior to Lacan’s mirror stage, prior to the specular construction of bounded selfhood. Bulut (2025) extends this into <em>voice as skin</em>—not a gap between subjects but a “shared surface, a multisensory interface that behaves both as a boundary and as a web of connection across various bodies and environments” (p. 1). What Bulut calls <em>insular solidarity</em>—the mode of relation in which voice touches without guarantee of being touched back in the same way—is the mode the <em>portable temple</em> requires. Sapen (2012), drawing on Bion’s alpha function and Kristeva’s chora, demonstrates that jazz improvisation is not an illustration of intersubjective process but its most direct audible demonstration: the dreamwork conducted out loud, in real time, in the presence of others whose listening is as constitutive as their playing. The improviser does not generate content and transmit it to a passive audience. The ensemble co-dreams—and the quality of that <em>co-dreaming</em> depends not on the technical facility of the players but on the psychic condition they bring to the encounter.`,
      `This is where the critique of jazz offered by Adorno and, differently, by Deleuze becomes useful—not as refutation but as diagnostic filter. Adorno’s complaint that jazz improvisation masks commodity logic beneath the performance of freedom is correct about a specific mode of playing: the virtuoso deploying licks, the session musician performing spontaneity. Deleuze catches the same structure from the rhizomatic side: the jazz that looks like a line of flight but is reterritorialized before it departs. Both identify what happens when improvisation operates without the interior condition—when the techne runs but poietic intentionality is absent. What neither can see, because both are analyzing the output rather than the player, is that the site of transformation is not the improvisation itself. It is the openness of the player to sense through their techne. Coltrane’s decades of spiritual practice—the ashram, the meditation, the devotional discipline—are the construction of the psychic container capable of conducting the resonant field without fragmenting or rigidifying. This is <em>phronesis</em>—not a knowledge one possesses but a quality of being that shows up in action, sensible only by those who share in it.`,
    ],
    footnotes: {
      "31": `Erlmann’s term <em>Vernunft/Resonanz</em> names the joining of reason and resonance in a single concept of personhood—a unity the Enlightenment produced its rational subject by severing (2010, p. 31). The suppression of resonance was, in his account, “modernity’s second science” (p. 11): the foreclosed twin of the rational project, running in parallel for four centuries.`,
      "32": `Schwartz (2011) recovers Ficino’s claim that song is “a most powerful imitator of all things,” whose power moves bidirectionally— “when it imitates the celestials, it also wonderfully arouses our spirit upwards to the celestial influence and the celestial influence downwards to our spirit” (p. 54). That bidirectional movement—spirit upward, celestial downward—is what Coltrane’s practice enacts and what the Cartesian settlement was designed to foreclose.`,
